      script: |
        1000

tariffs:
  currency: EUR
  grid:
    type: custom
    forecast:
      source: js
      script: |
        var now = new Date();
        now.setMinutes(0, 0, 0);
        var rates = [];
        for (var i = 0; i < 48; i++) {
          rates.push({
            start: new Date(now.getTime() + i * 3600000).toISOString(),
            end: new Date(now.getTime() + (i + 1) * 3600000).toISOString(),
            value: 0.3 + 0.08 * Math.sin(i / 3.5),
          });
        }
        JSON.stringify(rates);
