interval: 0.25s

site:
  title: evcc Simulator
  meters:
    grid: grid
    pv:
      - pv

meters:
  - name: grid
    type: custom
    power:
      source: http
      uri: http://localhost:7072/api/state
      jq: .site.grid.power
  - name: pv
    type: custom
    power:
      source: http
      uri: http://localhost:7072/api/state
      jq: .site.pv.power
  - name: lp0meter
    type: custom
    power:
      source: http
      uri: http://localhost:7072/api/state
      jq: .loadpoints[0].power
    energy:
      source: http
      uri: http://localhost:7072/api/state
      jq: .loadpoints[0].energy

# no default vehicle: connecting starts vehicle detection
loadpoints:
  - title: Carport
    charger: charger
    meter: lp0meter
    mode: pv
    soc:
      estimate: false

chargers:
  - name: charger
    type: custom
    enable:
      source: js
      script: |
        false
    enabled:
      source: http
      uri: http://localhost:7072/api/state
      jq: .loadpoints[0].enabled
    status:
      source: http
      uri: http://localhost:7072/api/state
      jq: .loadpoints[0].status
    maxcurrent:
      source: js
      script: |
        16

# neither vehicle reports a charge state, so detection by status never resolves
vehicles:
  - name: golf
    title: blauer e-Golf
    type: custom
    soc:
      source: http
      uri: http://localhost:7072/api/state
      jq: .vehicles[0].soc
    capacity: 20
  - name: honda
    type: template
    template: offline
    title: grüner Honda e
    capacity: 28.5
