name: Claude Fix Command

on:
  issue_comment:
    types: [created]

# Triggered by a `/fix` comment on any issue or PR conversation, maintainers only.
# Delegates to the shared issue agent in fix mode, which investigates, commits a
# fix that a separate job pushes and opens as a PR, comments with the result,
# then minimizes the calling `/fix` comment as RESOLVED, whether or not a PR was
# opened.
jobs:
  fix:
    name: Fix on demand
    if: |
      startsWith(github.event.comment.body, '/fix') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      contents: write # push the fix branch (open-pr job only, the agent job reduces to read)
      issues: write # comment + minimize the calling comment
      pull-requests: write # open PR fix, comment on PR conversations
      discussions: read # read referenced discussions
      id-token: write
      actions: read
    uses: ./.github/workflows/claude-issue-agent-run.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      mode: fix
      comment_id: ${{ github.event.comment.id }}
      comment_node_id: ${{ github.event.comment.node_id }}
    secrets: inherit
