version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "infrastructure"
    # init and analyze must run the same version, SHA pins make them separate dependencies
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "infrastructure"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    # 0 disables version-update PRs; the entry still labels security updates
    open-pull-requests-limit: 0
    labels:
      - "infrastructure"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "infrastructure"
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels:
      - "infrastructure"
