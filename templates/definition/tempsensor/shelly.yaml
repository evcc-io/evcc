template: shelly
products:
  - brand: Shelly
    description:
      generic: Plus Add-On
requirements:
  description:
    en: Requires a Shelly device with Plus Add-On and temperature sensor.
    de: Benötigt ein Shelly Gerät mit Plus Add-On und Temperatursensor.
params:
  - name: host
  - name: user
  - name: password
  - name: sensor
    type: int
    default: 100
    description:
      en: Sensor ID
      de: Sensor-ID
    help:
      en: IDs of Add-On sensors start at 100.
      de: IDs der Add-On Sensoren beginnen bei 100.
render: |
  type: custom
  temp:
    source: http
    uri: http://{{ .host }}/rpc/Temperature.GetStatus?id={{ .sensor }}
    {{- if .user }}
    auth:
      type: digest
      user: {{ .user }}
      password: {{ .password }}
    {{- end }}
    jq: .tC
