template: homeassistant
products:
  - brand: Home Assistant
group: generic
requirements:
  description:
    en: Home Assistant instances in your network will be auto-discovered and suitable entities (e.g. `sensor.*`) will be suggested.
    de: Home Assistant Instanzen in deinem Netzwerk werden automatisch erkannt und passende Entitäten (z.B. `sensor.*`) werden vorgeschlagen.
auth:
  type: homeassistant
  params: [uri, insecure]
params:
  - name: uri
    description:
      de: Home Assistant URI
      en: Home Assistant URI
    example: http://homeassistant.local:8123
    help:
      en: " " # overwrite default
      de: " " # overwrite default
    service: homeassistant/instances
    required: true
  - name: temp
    description:
      de: Temperaturentität
      en: Temperature Entity
    required: true
    service: homeassistant/entities?uri={uri}&insecure={insecure}&domain=sensor,input_number&unit=°C,°F,K
    example: sensor.boiler_temperature
    help:
      en: Entity ID for temperature measurement. °F and K readings are converted to °C.
      de: Entitäts-ID für Temperaturmessung. °F- und K-Werte werden nach °C umgerechnet.
  - name: insecure
render: |
  type: homeassistant
  uri: {{ .uri }}
  insecure: {{ .insecure }}
  temp: {{ .temp }}
