template: kostal-plenticore-gen2
products:
  - brand: Kostal
    description:
      de: Plenticore Hybrid
      en: Plenticore Hybrid
requirements:
  description:
    de: |
      Nur ein System kann und darf auf den Wechselrichter zugreifen! Die Abregelung begrenzt die Wirkleistung des Wechselrichters auf den gewünschten Prozentsatz der Nennleistung (SunSpec WMaxLimPct). Ein gesetztes Limit hat Vorrang vor der Batteriesteuerung.
    en: |
      Only a single system may access the inverter! Curtailment limits the inverter's active power to the desired percentage of its nominal power (SunSpec WMaxLimPct). An active limit takes priority over battery control.
params:
  - name: modbus
    choice: ["tcpip"]
    id: 71
    port: 1502
render: |
  type: custom
  # feed-in curtailment via active power limit (SunSpec model 123, WMaxLimPct @ 40217).
  # written as a single register (fn 06); the Plenticore rejects write multiple (fn 16) here.
  # WMaxLim_Ena (register 40221) is enabled by default and left to the inverter
  # sets the limit percent (100 % = uncurtailed), if set it takes priority over battery control.
  curtail: # limit feed-in to the given percent of nominal (WMaxLimPct)
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 123:WMaxLimPct
  curtailed: # the limit percentage only applies while the limit is enabled
    source: go
    in:
    - name: ena
      type: bool
      config:
        source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 123:WMaxLim_Ena
    - name: limit
      type: float
      config:
        source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 123:WMaxLimPct
    script: |
      percent := 100
      if ena {
        percent = int(limit)
      }
      percent
