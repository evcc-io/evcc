template: sunspec
products:
  - description:
      de: SunSpec Wechselrichter
      en: SunSpec Inverter
group: generic
requirements:
  description:
    de: |
      Die Abregelung begrenzt die Wirkleistung des Wechselrichters auf den gewünschten Prozentsatz seiner maximalen Leistung (SunSpec Modell 123 bzw. 704).
    en: |
      Curtailment limits the inverter's active power to the desired percentage of its maximum power (SunSpec model 123 or 704).
params:
  - name: modbus
    choice: ["tcpip", "rs485"]
render: |
  type: custom
  curtail:
    source: sequence
    set:
      - source: sunspec
        {{- include "modbus" . | indent 6 }}
        value:
          - 704:WMaxLimPct
          - 123:WMaxLimPct
      - source: switch
        switch:
          - case: 100 # Uncurtailed
            set:
              source: const
              value: 0 # Limit disabled
              set:
                source: sunspec
                {{- include "modbus" . | indent 14 }}
                value:
                  - 704:WMaxLimPctEna
                  - 123:WMaxLim_Ena
        default:
          source: const
          value: 1 # Limit enabled
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value:
              - 704:WMaxLimPctEna
              - 123:WMaxLim_Ena
  curtailed: # the limit percentage only applies while the limit is enabled
    source: go
    in:
    - name: ena
      type: bool
      config:
        source: sunspec
        {{- include "modbus" . | indent 6 }}
        value:
          - 704:WMaxLimPctEna
          - 123:WMaxLim_Ena
    - name: limit
      type: float
      config:
        source: sunspec
        {{- include "modbus" . | indent 6 }}
        value:
          - 704:WMaxLimPct
          - 123:WMaxLimPct
    script: |
      percent := 100
      if ena {
        percent = int(limit)
      }
      percent
