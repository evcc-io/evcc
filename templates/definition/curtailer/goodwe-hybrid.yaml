template: goodwe-hybrid
products:
  - brand: GoodWe
    description:
      generic: ET/EH/BH/BT/ESA Hybrid Inverter
requirements:
  description:
    de: |
      Die Abregelung begrenzt die Einspeiseleistung auf den gewünschten Prozentsatz der maximalen AC-Leistung des Wechselrichters.
    en: |
      Curtailment limits feed-in power to the desired percentage of the maximum AC power of the inverter.
params:
  - name: modbus
    choice: ["rs485", "tcpip", "udp"]
    baudrate: 9600
    id: 247
  - name: maxacpower
    required: true
    usages: ["curtailer"] # default usages ["pv"] would hide the param in the curtailer UI
render: |
  type: custom
  # GoodWe only has a single, global feed-in limit for the whole system (registers 47509/47510),
  # there is no per-string curtailment.
  curtail: # limit feed-in to given percent of nominal (100 % = maxacpower)
    source: switch
    switch:
    - case: 100 # uncurtailed
      set:
        source: const
        value: 0 # disable limit
        set:
          source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 47509 # Feed-in power limit enable
            type: writesingle
            encoding: uint16
    default:
      source: sequence
      set:
      # write the limit before enabling it, the device must not apply a stale value
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 47510 # Feed-in power limit, W
          type: writesingle
          encoding: uint16
        scale: {{ divf (maxf .maxacpower 1) 100 }} # % to W
      - source: const
        value: 1 # enable limit
        set:
          source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 47509
            type: writesingle
            encoding: uint16
  curtailed: # allowed feed-in as percent of nominal, derived from feed-in power limit
    source: go
    in:
    - name: ena
      type: int
      config:
        source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 47509 # Feed-in power limit enable
          type: holding
          decode: uint16
    - name: w
      type: float
      config:
        source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 47510 # Feed-in power limit, W
          type: holding
          decode: uint16
    script: |
      percent := 100.0
      if ena != 0 {
        percent = w * 100 / {{ maxf .maxacpower 1 }}
      }
      p := int(percent + 0.5)
      if p > 100 {
        p = 100
      }
      p
