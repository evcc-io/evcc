template: sungrow-hybrid
products:
  - brand: Sungrow
    description:
      generic: SH Series Hybrid Inverter
requirements:
  description:
    de: |
      Die Abregelung begrenzt die Einspeiseleistung auf den gewünschten Prozentsatz der maximalen AC-Leistung des Wechselrichters.
    en: |
      Curtailment limits feed-in power to the desired percentage of the maximum AC power of the inverter.
discovery:
  mdns: ["_http._tcp:WiNet-WebServer"]
  hostname: ["sungrow*"]
  mac: ["AC199F"]
params:
  - name: modbus
    choice: ["rs485", "tcpip"]
    baudrate: 9600
  - name: maxacpower
    service: modbus/read?address=5000&type=input&encoding=uint16&scale=100&{modbus} # Nominal output power, 0.1kW
    required: true
render: |
  type: custom
  # EEG §9 curtailment via the power limitation registers
  #   13086 (doc 13087) feed-in limitation switch, 0xAA enable / 0x55 disable
  #   13073 (doc 13074) feed-in limitation value, W
  # The 0.1 % ratio register 13087 (doc 13088) is missing on older firmware (e.g. SH4.0RS).
  curtail:
    source: sequence
    set:
      # Order matters: switch must be set BEFORE the value (see sungrow-inverter).
      # A failed value write surfaces as error and is retried on next curtail.
      - source: go
        script: |
          ena := 170 // 0xAA - enable limitation
          if curtail == 100 {
            ena = 85 // 0x55 - disable limitation
          }
          ena
        out:
          - name: ena
            type: int
            config:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 13086 # Feed-in Limitation switch (doc 13087), 0xAA enable / 0x55 disable
                type: writesingle
                decode: uint16
      - source: go
        script: |
          watts := curtail * {{ .maxacpower }} / 100
          watts
        out:
          - name: watts
            type: int
            config:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 13073 # Feed-in Limitation Value (doc 13074), 1W resolution
                type: writesingle
                decode: uint16
  curtailed:
    source: go
    in:
      - name: ena
        type: int
        config:
          source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 13086
            type: holding
            decode: uint16
      - name: watts
        type: int
        config:
          source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 13073 # Feed-in Limitation Value (doc 13074), 1W
            type: holding
            decode: uint16
    script: |
      percent := 100
      if ena == 170 {
        percent = watts * 100 / {{ .maxacpower }}
      }
      percent
