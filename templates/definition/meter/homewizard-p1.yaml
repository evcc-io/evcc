template: homewizard
products:
  - brand: HomeWizard
    description:
      generic: Wi-Fi P1 Meter
discovery:
  mdns: ["_hwenergy._tcp", "_homewizard._tcp"]
  mac: ["5C2FAF", "3C39E72"]
params:
  - name: usage
    choice: ["grid"]
  - name: host
render: |
  type: homewizard
  uri: http://{{ .host }}
  usage: {{ .usage }}
