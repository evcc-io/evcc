template: saj-h2
products:
  - brand: SAJ
    description:
      generic: H2 Series Hybrid Solar Inverter
  - brand: Ampere
    description:
      generic: Ampere.StoragePro
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    baudrate: 115200
    comset: 8N1
  - preset: battery-params
  # battery control
  - name: defaultmode
    default: 2
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40AD # SysGridPowerWall
      type: holding
      decode: int16
  currents:
  {{- range $i := until 3 }}
  - source: calc
    mul:
    - source: calc
      sign:
        source: modbus
        {{- include "modbus" $ | indent 6 }}
        register:
          address: {{ add 41023 (mul 6 $i) }} # 0xA03F/0xA045/0xA04B R/S/T GridActivePower (+import/-export)
          type: holding
          decode: int16
    - source: modbus
      {{- include "modbus" $ | indent 4 }}
      register:
        address: {{ add 41022 (mul 6 $i) }} # 0xA03E/0xA044/0xA04A R/S/T meter current
        type: holding
        decode: uint16
      scale: 0.01
  {{- end }}
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x416D # Sum All Phases Feed-In Total
      type: holding
      decode: uint32
    scale: 0.01
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40A5 # TotalPVPower
      type: holding
      decode: int16
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40C5 # Total_PVEnergy
      type: holding
      decode: uint32
    scale: 0.01
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40A6 # TotalBatteryPower
      type: holding
      decode: int16
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x40D5 # Total_BatDisEnergy
      type: holding
      decode: uint32
    scale: 0.01
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0xA00C # Bat1SOC
      type: holding
      decode: uint16
    scale: 0.01
  batterymode:
    source: switch
    switch:
    - case: 1 # normal
      set:
        source: sequence
        set:
        - source: const
          value: {{ .defaultmode }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}        
            register:
              address: 13895 # AppMode 
              type: writesingle
              decode: int16
        - source: const
          value: {{ .minsoc }} 
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 13905 # BatSocLimitkeep 
              type: writesingle
              decode: int16
    - case: 2 # hold
      set:
        source: sequence
        set:
        - source: const
          value: {{ .defaultmode }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}        
            register:
              address: 13895 # AppMode 
              type: writesingle
              decode: int16
        - source: const
          value: {{ .maxsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}        
            register:
              address: 13905 # BatSocLimitkeep 
              type: writesingle
              decode: int16
    - case: 3 # charge
      set:
        source: sequence
        set:
        - source: const
          value: 1 # time_mode
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}        
            register:
              address: 13895 # AppMode 
              type: writesingle
              decode: int16
        - source: const
          value: 1 # enable
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}        
            register:
              address: 13828 # Charge_time_enable_control 
              type: writesingle
              decode: int16
        - source: const
          value: 0 # start (00:00)
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}        
            register:
              address: 13830 # First_charge_start_time 
              type: writesingle
              decode: int16
        - source: const
          value: 0x173B # end (23:59)
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}        
            register:
              address: 13831 # First_charge_end_time 
              type: writesingle
              decode: int16
        - source: const
          value: 0x7F64 # end (0xFF / 100%)
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}        
            register:
              address: 13832 # First_charge_power_time 
              type: writesingle
              decode: int16
  {{- include "battery-params" . }}
  {{- end }}
