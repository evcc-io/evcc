template: alpha-ess-smile
products:
  - brand: Alpha ESS
    description:
      generic: Storion SMILE
capabilities: ["battery-control"]
requirements:
  description:
    de: |
      Die aktive Speichersteuerung nutzt die Dispatch-Register (0x0880–0x088A). Diese werden nicht im Flash gespeichert. In der App muss nichts konfiguriert werden; Netzlade-Zeitfenster, Entladereserve und Ladeschluss-SoC bleiben unverändert. Jeder Dispatch-Befehl läuft nach 120 s ab, falls evcc ihn nicht erneuert. Danach kehrt der Wechselrichter in den Normalbetrieb zurück.
    en: |
      Active battery control uses the dispatch registers (0x0880–0x088A). These are not stored in flash memory. No configuration in the app is required; grid charging time periods, discharge reserve and charge cut SoC are left untouched. Every dispatch command expires after 120 s unless evcc renews it. The inverter then returns to normal operation.
discovery:
  mac: ["BC97400", "70B3D57A2"]
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    baudrate: 9600
    id: 85
  - name: maxacpower
  - preset: battery-params
  - name: maxchargepower
    default: 5000
  - name: watchdog
    default: 60s
    usages: ["battery"]
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 33 # 0x21 Total Active power (Grid Meter)
      type: holding
      decode: int32
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 18 # 0x12 Total energy consumed from grid (Grid)
      type: holding
      decode: uint32
    scale: 0.01
  returnenergy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 16 # 0x10 Total energy feed to grid (Grid)
      type: holding
      decode: uint32
    scale: 0.01
  currents:
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 23 # 0x17 Current of A phase
      type: holding
      decode: int16
    scale: 0.1
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 24 # 0x18 Current of B phase
      type: holding
      decode: int16
    scale: 0.1
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 25 # 0x19 Current of C phase
      type: holding
      decode: int16
    scale: 0.1
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: calc
    add:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 161 # 0xA1 Total Active power (PV Meter)
        type: holding
        decode: int32
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 1055 # 0x41f PV1 power
        type: holding
        decode: uint32
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 1059 # 0x423 PV2 power
        type: holding
        decode: uint32
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 1063 # 0x427 PV3 power
        type: holding
        decode: uint32
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 1067 # 0x42b PV4 power
        type: holding
        decode: uint32
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 1071 # 0x42f PV5 power
        type: holding
        decode: uint32
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 1075 # 0x433 PV6 power
        type: holding
        decode: uint32
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 1086 # 0x43E Inverter Total PV Energy
      type: holding
      decode: uint32
    scale: 0.1
  maxacpower: {{ .maxacpower }}
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 294 # 0x126 Battery Power
      type: holding
      decode: int16
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 290 # 0x122 Battery discharge energy
      type: holding
      decode: uint32
    scale: 0.1
  returnenergy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 288 # 0x120 Battery charge energy
      type: holding
      decode: uint32
    scale: 0.1
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 258 # 0x102 Battery SOC
      type: holding
      decode: uint16
    scale: 0.1
  batterymode:
    source: watchdog
    timeout: {{ .watchdog }}
    reset: 1 # normal
    set:
      source: switch
      switch:
      - case: 1 # normal -> stop dispatch
        set:
          source: const
          value: 0
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 2176 # 0x0880 Dispatch start
              type: writemultiple
              decode: uint16
      - case: 2 # hold -> no discharge, PV surplus may charge the battery
        set:
          source: sequence
          set:
          - source: const
            value: 1
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2176 # 0x0880 Dispatch start, written first: the B3 ignores parameters while the dispatch is stopped
                type: writemultiple
                decode: uint16
          - source: const
            value: {{ sub 32000 (.maxchargepower | int) }}
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2177 # 0x0881 Dispatch active power (W, offset 32000: <32000 charge, >32000 discharge)
                type: writemultiple
                decode: int32
          - source: const
            value: 32000
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2179 # 0x0883 Dispatch reactive power (32000 = 0 var)
                type: writemultiple
                decode: int32
          - source: const
            value: 1
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2181 # 0x0885 Dispatch mode: 1 = battery only charges from PV
                type: writemultiple
                decode: uint16
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2182 # 0x0886 Dispatch SoC target (unused in mode 1)
                type: writemultiple
                decode: uint16
          - source: const
            value: 120
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2183 # 0x0887 Dispatch duration (s), inverter returns to normal operation when it expires
                type: writemultiple
                decode: uint32
          - source: const
            value: 255
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2185 # 0x0889 Dispatch flow direction (255 = bidirectional)
                type: writemultiple
                decode: uint16
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2186 # 0x088A Dispatch PV switch (0 = default)
                type: writemultiple
                decode: uint16
          - source: const
            value: 1
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2176 # 0x0880 Dispatch start, written again last as the G3 and T10 were tested this way
                type: writemultiple
                decode: uint16
      - case: 3 # charge -> charge from grid up to maxsoc
        set:
          source: sequence
          set:
          - source: const
            value: 1
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2176 # 0x0880 Dispatch start, written first: the B3 ignores parameters while the dispatch is stopped
                type: writemultiple
                decode: uint16
          - source: const
            value: {{ sub 32000 (.maxchargepower | int) }}
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2177 # 0x0881 Dispatch active power (W, offset 32000: <32000 charge, >32000 discharge)
                type: writemultiple
                decode: int32
          - source: const
            value: 32000
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2179 # 0x0883 Dispatch reactive power (32000 = 0 var)
                type: writemultiple
                decode: int32
          - source: const
            value: 2
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2181 # 0x0885 Dispatch mode: 2 = SoC control
                type: writemultiple
                decode: uint16
          - source: const
            value: {{ div (mul (.maxsoc | default 100 | int) 5) 2 }}
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2182 # 0x0886 Dispatch SoC target (0.4 %/bit, 250 = 100 %)
                type: writemultiple
                decode: uint16
          - source: const
            value: 120
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2183 # 0x0887 Dispatch duration (s), inverter returns to normal operation when it expires
                type: writemultiple
                decode: uint32
          - source: const
            value: 255
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2185 # 0x0889 Dispatch flow direction (255 = bidirectional)
                type: writemultiple
                decode: uint16
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2186 # 0x088A Dispatch PV switch (0 = default)
                type: writemultiple
                decode: uint16
          - source: const
            value: 1
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 2176 # 0x0880 Dispatch start, written again last as the G3 and T10 were tested this way
                type: writemultiple
                decode: uint16
  {{- include "battery-params" . }}
  {{- end }}
