template: e3dc
deprecated: true
products:
  - brand: E3/DC
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["tcpip"]
  - preset: battery-params
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      type: holding
      decode: int32s
      address: 40073 # Hausverbrauchsleistung in Watt
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: calc
    add:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        type: holding
        decode: int32s
        address: 40067 # Photovoltaikleistung in Watt
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        type: holding
        decode: int32s
        address: 40075 # Leistung zusätzlicher Einspeiser in Watt
      scale: -1 # reverse sign
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      type: holding
      decode: int32s
      address: 40069 # Batterieleistung in Watt
    scale: -1 # reverse direction
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 40082 # Batterie-SOC in %
      type: holding
      decode: uint16
  {{- include "battery-params" . }}
  {{- end }}
