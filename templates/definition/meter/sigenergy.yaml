template: sigenergy
products:
  - brand: Sigenergy
    description:
      generic: Sigen Hybrid
  - brand: Sigenergy
    description:
      generic: Sigen PV Max
  - brand: Sigenergy
    description:
      generic: SigenStore EC
capabilities: ["battery-control"]
requirements:
  description:
    de: Modbus TCP muss in der Konfigurations-App aktiviert werden. Für optimale Ergebnisse sollte das Sigenergy-System im Eigenverbrauchsmodus betrieben werden. Wenn Sie stattdessen den Sigen KI-Modus verwenden möchten, deaktivieren Sie die Option Batterie als Ladepuffer verwenden, aktivieren Sie Entladung der Hausbatterie im Schnell-Modus verhindern und stellen Sie Sonnenüberschuss direkt an die Ladestationen leiten ein.
    en: Modbus TCP must be enabled in the configuration app. For best results the Sigenergy system should be in Self-Consumption mode. If you wish to use the Sigen AI Mode instead, disable option battery as charging buffer, enable prevent home battery discharge in fast mode and set solar surplus goes straight to the charging points.
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: host
  - name: port
    default: 502
  - name: id
    default: 1
  - name: maxacpower
  - preset: battery-params
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: 247
    register:
      address: 30005 # [Grid sensor] Active power
      type: holding
      decode: int32
  energy:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30562 # Accumulated import energy
      type: holding
      decode: uint64
    scale: 0.01
  currents:
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      id: {{ .id }}
      register:
        address: 31017 # Phase A current
        type: holding
        decode: int32
      scale: 0.01
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      id: {{ .id }}
      register:
        address: 31019 # Phase B current
        type: holding
        decode: int32
      scale: 0.01
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      id: {{ .id }}
      register:
        address: 31021 # Phase C current
        type: holding
        decode: int32
      scale: 0.01
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      type: holding
      address: 31035 # PV power (per inverter)
      decode: int32
  maxacpower: {{ .maxacpower }} # W
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      type: holding
      address: 30599 # [ESS] Charge/discharge power (per inverter)
      decode: int32
    scale: -1
  energy:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30574 # [ESS] Accumulated discharge energy (per inverter)
      type: holding
      decode: uint64
    scale: 0.01
  returnenergy:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30568 # [ESS] Accumulated charge energy (per inverter)
      type: holding
      decode: uint64
    scale: 0.01
  soc:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30601 # [ESS] Battery SOC (per inverter)
      type: holding
      decode: uint16
    scale: 0.1
  limitsoc:
    source: convert
    convert: float2int
    set:
      source: modbus
      uri: {{ joinHostPort .host .port }}
      id: 247
      register:
        address: 40048 # Discharge Cut-Off SoC
        type: writeholding
        decode: uint16
      scale: 10
  {{- include "battery-params" . }}
  {{- end }}
