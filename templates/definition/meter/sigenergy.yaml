template: sigenergy
products:
  - brand: Sigenergy
    description:
      generic: Sigen Hybrid
  - brand: Sigenergy
    description:
      generic: Sigen PV Max
  - brand: Sigenergy
    description:
      generic: SigenStore EC
capabilities: ["battery-control"]
requirements:
  description:
    de: Modbus TCP muss in der Konfigurations-App mit Installateursrechten aktiviert werden. Diese Option ist in der mySigen App für Kunden nicht verfügbar.
    en: Modbus TCP must be enabled in the configuration app with installer rights. This option is not available in the mySigen app for customers.
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: host
  - name: port
    default: 502
  - name: id
    default: 1
  - name: maxacpower
  - name: string
    type: choice
    choice: ["0", "1", "2", "3", "4"]
    usages: ["pv"]
    advanced: true
    description:
      de: PV String
      en: PV String
    help:
      de: |
        Nicht gesetzt oder 0 = Gesamtleistung aller Strings, 1-4 = ein einzelner String.
        String-Zähler messen DC-Leistung (Spannung × Strom) und dienen nur der Überwachung. Als PV-Zähler der Site den Gesamtleistungs-Zähler (0) verwenden.
      en: |
        Unset or 0 = total power of all strings, 1-4 = one individual string.
        String meters measure DC power (voltage × current) and are for monitoring only. Keep the total-power meter (0) as the site's PV meter.
  - preset: battery-params
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: 247
    register:
      address: 30005 # [Grid sensor] Active power
      type: holding
      decode: int32
  energy:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30562 # Accumulated import energy
      type: holding
      decode: uint64
    scale: 0.01
  currents:
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      id: {{ .id }}
      register:
        address: 31017 # Phase A current
        type: holding
        decode: int32
      scale: 0.01
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      id: {{ .id }}
      register:
        address: 31019 # Phase B current
        type: holding
        decode: int32
      scale: 0.01
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      id: {{ .id }}
      register:
        address: 31021 # Phase C current
        type: holding
        decode: int32
      scale: 0.01
  {{- end }}
  {{- if eq .usage "pv" }}
  {{- if and .string (ne .string "0") }}
  power:
    source: calc
    mul:
      - source: modbus
        uri: {{ joinHostPort .host .port }}
        id: {{ .id }}
        register:
          address: {{ add 31027 (mul 2 (sub (int .string) 1)) }} # PV{{ .string }} voltage
          type: holding
          decode: int16
        scale: 0.1
      - source: modbus
        uri: {{ joinHostPort .host .port }}
        id: {{ .id }}
        register:
          address: {{ add 31028 (mul 2 (sub (int .string) 1)) }} # PV{{ .string }} current
          type: holding
          decode: int16
        scale: 0.01
  {{- else }}
  power:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      type: holding
      address: 31035 # PV power (per inverter)
      decode: int32
  maxacpower: {{ .maxacpower }} # W
  {{- end }}
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      type: holding
      address: 30599 # [ESS] Charge/discharge power (per inverter)
      decode: int32
    scale: -1
  energy:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30574 # [ESS] Accumulated discharge energy (per inverter)
      type: holding
      decode: uint64
    scale: 0.01
  returnenergy:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30568 # [ESS] Accumulated charge energy (per inverter)
      type: holding
      decode: uint64
    scale: 0.01
  soc:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30601 # [ESS] Battery SOC (per inverter)
      type: holding
      decode: uint16
    scale: 0.1
  limitsoc:
    source: convert
    convert: float2int
    set:
      source: modbus
      uri: {{ joinHostPort .host .port }}
      id: 247
      register:
        address: 40048 # Discharge Cut-Off SoC
        type: writeholding
        decode: uint16
      scale: 10
  {{- include "battery-params" . }}
  {{- end }}
