template: sigenergy
products:
  - brand: Sigenergy
    description:
      generic: Sigen Hybrid
  - brand: Sigenergy
    description:
      generic: Sigen PV Max
  - brand: Sigenergy
    description:
      generic: SigenStore EC
capabilities: ["battery-control"]
requirements:
  description:
    de: Modbus TCP muss in der Konfigurations-App mit Installateursrechten aktiviert werden. Diese Option ist in der mySigen App für Kunden nicht verfügbar.
    en: Modbus TCP must be enabled in the configuration app with installer rights. This option is not available in the mySigen app for customers.
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: host
  - name: port
    default: 502
  - name: id
    default: 1
  - name: maxacpower
  - preset: battery-params
  - name: backupgateway
    type: bool
    usages: ["battery"]
    advanced: true
    default: false
    description:
      de: Backup-Gateway installiert
      en: Backup gateway installed
    help:
      de: |
        Nutzt bei aktiver Entladesperre das Register "Backup SoC" (40046) statt "Discharge Cut-Off SoC" (40048).
        Dadurch bleibt die Hausversorgung bei einem Netzausfall erhalten. Erfordert ein installiertes optionales Backup-Gateway.
      en: |
        Uses the "Backup SoC" register (40046) instead of "Discharge Cut-Off SoC" (40048) to block discharge.
        This keeps the house powered during a grid outage. Requires an installed optional backup gateway.
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: 247
    register:
      address: 30005 # [Grid sensor] Active power
      type: holding
      decode: int32
  energy:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30562 # Accumulated import energy
      type: holding
      decode: uint64
    scale: 0.01
  currents:
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      id: {{ .id }}
      register:
        address: 31017 # Phase A current
        type: holding
        decode: int32
      scale: 0.01
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      id: {{ .id }}
      register:
        address: 31019 # Phase B current
        type: holding
        decode: int32
      scale: 0.01
    - source: modbus
      uri: {{ joinHostPort .host .port }}
      id: {{ .id }}
      register:
        address: 31021 # Phase C current
        type: holding
        decode: int32
      scale: 0.01
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      type: holding
      address: 31035 # PV power (per inverter)
      decode: int32
  maxacpower: {{ .maxacpower }} # W
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      type: holding
      address: 30599 # [ESS] Charge/discharge power (per inverter)
      decode: int32
    scale: -1
  energy:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30574 # [ESS] Accumulated discharge energy (per inverter)
      type: holding
      decode: uint64
    scale: 0.01
  returnenergy:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30568 # [ESS] Accumulated charge energy (per inverter)
      type: holding
      decode: uint64
    scale: 0.01
  soc:
    source: modbus
    uri: {{ joinHostPort .host .port }}
    id: {{ .id }}
    register:
      address: 30601 # [ESS] Battery SOC (per inverter)
      type: holding
      decode: uint16
    scale: 0.1
  limitsoc:
    source: convert
    convert: float2int
    set:
      source: modbus
      uri: {{ joinHostPort .host .port }}
      id: 247
      register:
        {{- if .backupgateway }}
        address: 40046 # Backup SoC
        {{- else }}
        address: 40048 # Discharge Cut-Off SoC
        {{- end }}
        type: writeholding
        decode: uint16
      scale: 10
  {{- include "battery-params" . }}
  {{- end }}
