template: sonoff-pro-3pct120
products:
  - brand: SONOFF
    description:
      generic: Pro-3PCT120
requirements:
  description:
    de: Benötigt ein Gerät mit SONOFF RPC API. Das Passwort wird in der Web-Oberfläche des Geräts vergeben.
    en: Requires a device with SONOFF RPC API. The password is set in the device's web interface.
params:
  - name: usage
    choice: ["grid", "charge", "pv"]
  - name: host
  - name: user
    default: admin
  - name: password
  - name: cache
    default: 1s
render: |
  {{- define "uri" -}}
  http://{{ .host }}/rpc/EnergyMeter.GetStatus?id=0
  {{- end }}
  type: custom
  power:
    source: http
    uri: {{ include "uri" . }}
    auth:
      type: digest
      user: {{ .user }}
      password: {{ .password }}
    jq: .result.status.total_power
    scale: {{ if eq .usage "pv" }}-1{{ else }}1{{ end }}
    cache: {{ .cache }}
  energy:
    source: http
    uri: {{ include "uri" . }}
    auth:
      type: digest
      user: {{ .user }}
      password: {{ .password }}
    jq: .result.status.total_energy.{{ if eq .usage "pv" }}reverse{{ else }}forward{{ end }}
    scale: 0.001
    cache: {{ .cache }}
  returnenergy:
    source: http
    uri: {{ include "uri" . }}
    auth:
      type: digest
      user: {{ .user }}
      password: {{ .password }}
    jq: .result.status.total_energy.{{ if eq .usage "pv" }}forward{{ else }}reverse{{ end }}
    scale: 0.001
    cache: {{ .cache }}
  voltages:
    - source: http
      uri: {{ include "uri" . }}
      auth:
        type: digest
        user: {{ .user }}
        password: {{ .password }}
      jq: .result.status.phase_a.voltage
      scale: 0.01
      cache: {{ .cache }}
    - source: http
      uri: {{ include "uri" . }}
      auth:
        type: digest
        user: {{ .user }}
        password: {{ .password }}
      jq: .result.status.phase_b.voltage
      scale: 0.01
      cache: {{ .cache }}
    - source: http
      uri: {{ include "uri" . }}
      auth:
        type: digest
        user: {{ .user }}
        password: {{ .password }}
      jq: .result.status.phase_c.voltage
      scale: 0.01
      cache: {{ .cache }}
  currents:
    - source: http
      uri: {{ include "uri" . }}
      auth:
        type: digest
        user: {{ .user }}
        password: {{ .password }}
      jq: .result.status.phase_a.current
      scale: 0.01
      cache: {{ .cache }}
    - source: http
      uri: {{ include "uri" . }}
      auth:
        type: digest
        user: {{ .user }}
        password: {{ .password }}
      jq: .result.status.phase_b.current
      scale: 0.01
      cache: {{ .cache }}
    - source: http
      uri: {{ include "uri" . }}
      auth:
        type: digest
        user: {{ .user }}
        password: {{ .password }}
      jq: .result.status.phase_c.current
      scale: 0.01
      cache: {{ .cache }}
  powers:
    - source: http
      uri: {{ include "uri" . }}
      auth:
        type: digest
        user: {{ .user }}
        password: {{ .password }}
      jq: .result.status.phase_a.active_power
      scale: 0.001
      cache: {{ .cache }}
    - source: http
      uri: {{ include "uri" . }}
      auth:
        type: digest
        user: {{ .user }}
        password: {{ .password }}
      jq: .result.status.phase_b.active_power
      scale: 0.001
      cache: {{ .cache }}
    - source: http
      uri: {{ include "uri" . }}
      auth:
        type: digest
        user: {{ .user }}
        password: {{ .password }}
      jq: .result.status.phase_c.active_power
      scale: 0.001
      cache: {{ .cache }}
