template: solarmax-smt
products:
  - brand: SolarMax
    description:
      generic: SolarMax SMT
params:
  - name: usage
    choice: ["pv"]
  - name: modbus
    choice: ["tcpip"]
    id: 1
render: |
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 4151 # PAC
      type: holding
      decode: uint32
    scale: 0.1
  # energy removed: register 4129 (Total) only resolves whole kWh (#32497)
