template: sma-sbs-modbus
products:
  - brand: SMA
    description:
      generic: Sunny Boy Storage 3.7/5.0/6.0 (Modbus)
capabilities: ["battery-control"]
discovery:
  hostname: ["sma*"]
  mac: ["0015BB", "0040AD"]
params:
  - name: usage
    choice: ["battery"]
  - name: modbus
    choice: ["tcpip"]
    port: 502
    id: 3
    help:
      en: ModbusTCP server needs to be enabled.
      de: Der ModbusTCP Server muss aktiviert sein.
  - preset: battery-params
  - name: maxchargepower
    help:
      en: Highest power the battery system can charge with. Leave empty to use the device maximum.
      de: Höchste Leistung, mit der das Batteriesystem laden kann. Leer lassen, um das Gerätemaximum zu verwenden.
  - name: maxdischargepower
    help:
      en: Highest power the battery system can discharge with. Leave empty to use the device maximum.
      de: Höchste Leistung, mit der das Batteriesystem entladen kann. Leer lassen, um das Gerätemaximum zu verwenden.
  - name: watchdog
    default: 60s
  - name: chargepower
    deprecated: true
render: |
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30775 # SMA Modbus Profile: GridMs.TotW
      type: input
      decode: int32nan
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30513 # SMA Modbus Profile: Metering.TotWhOut
      type: holding
      decode: uint64nan
    scale: 0.001
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30845 # SMA Modbus Profile: Bat.ChaStt
      type: holding
      decode: uint32nan
  batterymode:
    source: watchdog
    timeout: {{ .watchdog }}
    reset: 1 # reset watchdog on normal
    set:
      source: switch
      switch:
      - case: 1 # normal
        set:
          source: sequence
          set:
          - source: const
            value: 2424 # Voreinstellung (Dft)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40236 # SMA Modbus Profile: CmpBMS.OpMod - Betriebsart des BMS
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40793 # SMA Modbus Profile: CmpBMS.BatChaMinW - Minimale Batterieladeleistung
                type: writemultiple
                decode: uint32
          - source: go # charge limit
            in:
            - name: limit
              type: int
              config:
                {{- if gt (.maxchargepower | int) 0 }}
                source: const
                value: {{ .maxchargepower }}
                {{- else }}
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40189 # SMA Modbus Profile: BatConv.WMaxCha
                  type: holding
                  decode: uint32
                {{- end }}
            script: |
              limit
            out:
            - name: limit
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40795 # SMA Modbus Profile: CmpBMS.BatChaMaxW - Maximale Batterieladeleistung
                  type: writemultiple
                  decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40797 # SMA Modbus Profile: CmpBMS.BatDschMinW - Minimale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: go # discharge limit
            in:
            - name: limit
              type: int
              config:
                {{- if gt (.maxdischargepower | int) 0 }}
                source: const
                value: {{ .maxdischargepower }}
                {{- else }}
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40191 # SMA Modbus Profile: BatConv.WMaxDsch
                  type: holding
                  decode: uint32
                {{- end }}
            script: |
              limit
            out:
            - name: limit
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40799 # SMA Modbus Profile: CmpBMS.BatDschMaxW - Maximale Batterieentladeleistung
                  type: writemultiple
                  decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40801 # SMA Modbus Profile: CmpBMS.GridWSpt - Sollwert der Netzaustauschleistung
                type: writemultiple
                decode: uint32
      - case: 2 # holddischarge
        set:
          source: sequence
          set:
          - source: const
            value: 2424 # Voreinstellung (Dft)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40236 # SMA Modbus Profile: CmpBMS.OpMod - Betriebsart des BMS
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40793 # SMA Modbus Profile: CmpBMS.BatChaMinW - Minimale Batterieladeleistung
                type: writemultiple
                decode: uint32
          - source: go # charge limit
            in:
            - name: limit
              type: int
              config:
                {{- if gt (.maxchargepower | int) 0 }}
                source: const
                value: {{ .maxchargepower }}
                {{- else }}
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40189 # SMA Modbus Profile: BatConv.WMaxCha
                  type: holding
                  decode: uint32
                {{- end }}
            script: |
              limit
            out:
            - name: limit
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40795 # SMA Modbus Profile: CmpBMS.BatChaMaxW - Maximale Batterieladeleistung
                  type: writemultiple
                  decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40797 # SMA Modbus Profile: CmpBMS.BatDschMinW - Minimale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40799 # SMA Modbus Profile: CmpBMS.BatDschMaxW - Maximale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40801 # SMA Modbus Profile: CmpBMS.GridWSpt - Sollwert der Netzaustauschleistung
                type: writemultiple
                decode: uint32
      - case: 3 # charge
        set:
          source: sequence
          set:
          - source: const
            value: 2289 # Batterie laden (BatChaMod)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40236 # SMA Modbus Profile: CmpBMS.OpMod - Betriebsart des BMS
                type: writemultiple
                decode: uint32
          - source: go # charge limit
            in:
            - name: limit
              type: int
              config:
                {{- if gt (.maxchargepower | int) 0 }}
                source: const
                value: {{ .maxchargepower }}
                {{- else }}
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40189 # SMA Modbus Profile: BatConv.WMaxCha
                  type: holding
                  decode: uint32
                {{- end }}
            script: |
              limit
            out:
            - name: limit
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40793 # SMA Modbus Profile: CmpBMS.BatChaMinW - Minimale Batterieladeleistung
                  type: writemultiple
                  decode: uint32
          - source: go # charge limit
            in:
            - name: limit
              type: int
              config:
                {{- if gt (.maxchargepower | int) 0 }}
                source: const
                value: {{ .maxchargepower }}
                {{- else }}
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40189 # SMA Modbus Profile: BatConv.WMaxCha
                  type: holding
                  decode: uint32
                {{- end }}
            script: |
              limit
            out:
            - name: limit
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40795 # SMA Modbus Profile: CmpBMS.BatChaMaxW - Maximale Batterieladeleistung
                  type: writemultiple
                  decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40797 # SMA Modbus Profile: CmpBMS.BatDschMinW - Minimale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40799 # SMA Modbus Profile: CmpBMS.BatDschMaxW - Maximale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40801 # SMA Modbus Profile: CmpBMS.GridWSpt - Sollwert der Netzaustauschleistung
                type: writemultiple
                decode: uint32
  {{- include "battery-capacity" . }}
  {{- include "battery-minmaxsoc" . }}
  {{- if gt (.maxchargepower | int) 0 }}
  maxchargepower: {{ .maxchargepower }} # W
  {{- else }}
  maxchargepower:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 40189 # SMA Modbus Profile: BatConv.WMaxCha
      type: holding
      decode: uint32
  {{- end }}
  {{- if gt (.maxdischargepower | int) 0 }}
  maxdischargepower: {{ .maxdischargepower }} # W
  {{- else }}
  maxdischargepower:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 40191 # SMA Modbus Profile: BatConv.WMaxDsch
      type: holding
      decode: uint32
  {{- end }}
