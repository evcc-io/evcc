template: sma-sbs-modbus
products:
  - brand: SMA
    description:
      generic: Sunny Boy Storage 3.7/5.0/6.0 (Modbus)
capabilities: ["battery-control"]
discovery:
  hostname: ["sma*"]
  mac: ["0015BB", "0040AD"]
params:
  - name: usage
    choice: ["battery"]
  - name: modbus
    choice: ["tcpip"]
    port: 502
    id: 3
    help:
      en: ModbusTCP server needs to be enabled.
      de: Der ModbusTCP Server muss aktiviert sein.
  - preset: battery-params
  - name: watchdog
    default: 60s
  - name: chargepower
    deprecated: true
render: |
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30775 # SMA Modbus Profile: GridMs.TotW
      type: input
      decode: int32nan
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30513 # SMA Modbus Profile: Metering.TotWhOut
      type: holding
      decode: uint64nan
    scale: 0.001
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30845 # SMA Modbus Profile: Bat.ChaStt
      type: holding
      decode: uint32nan
  batterymode:
    source: watchdog
    timeout: {{ .watchdog }}
    reset: 1 # reset watchdog on normal
    set:
      source: switch
      switch:
      - case: 1 # normal
        set:
          source: sequence
          set:
          - source: const
            value: 2424 # Voreinstellung (Dft)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40236 # SMA Modbus Profile: CmpBMS.OpMod - Betriebsart des BMS
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40793 # SMA Modbus Profile: CmpBMS.BatChaMinW - Minimale Batterieladeleistung
                type: writemultiple
                decode: uint32
          - source: go # charge limit
            {{- include "sma-battery-limit" (dict "root" . "limit" "charge" "write" 40795 "name" "CmpBMS.BatChaMaxW - Maximale Batterieladeleistung") | indent 10 }}
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40797 # SMA Modbus Profile: CmpBMS.BatDschMinW - Minimale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: go # discharge limit
            {{- include "sma-battery-limit" (dict "root" . "limit" "discharge" "write" 40799 "name" "CmpBMS.BatDschMaxW - Maximale Batterieentladeleistung") | indent 10 }}
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40801 # SMA Modbus Profile: CmpBMS.GridWSpt - Sollwert der Netzaustauschleistung
                type: writemultiple
                decode: uint32
      - case: 2 # holddischarge
        set:
          source: sequence
          set:
          - source: const
            value: 2424 # Voreinstellung (Dft)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40236 # SMA Modbus Profile: CmpBMS.OpMod - Betriebsart des BMS
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40793 # SMA Modbus Profile: CmpBMS.BatChaMinW - Minimale Batterieladeleistung
                type: writemultiple
                decode: uint32
          - source: go # charge limit
            {{- include "sma-battery-limit" (dict "root" . "limit" "charge" "write" 40795 "name" "CmpBMS.BatChaMaxW - Maximale Batterieladeleistung") | indent 10 }}
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40797 # SMA Modbus Profile: CmpBMS.BatDschMinW - Minimale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40799 # SMA Modbus Profile: CmpBMS.BatDschMaxW - Maximale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40801 # SMA Modbus Profile: CmpBMS.GridWSpt - Sollwert der Netzaustauschleistung
                type: writemultiple
                decode: uint32
      - case: 3 # charge
        set:
          source: sequence
          set:
          - source: const
            value: 2289 # Batterie laden (BatChaMod)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40236 # SMA Modbus Profile: CmpBMS.OpMod - Betriebsart des BMS
                type: writemultiple
                decode: uint32
          - source: go # charge limit
            {{- include "sma-battery-limit" (dict "root" . "limit" "charge" "write" 40793 "name" "CmpBMS.BatChaMinW - Minimale Batterieladeleistung") | indent 10 }}
          - source: go # charge limit
            {{- include "sma-battery-limit" (dict "root" . "limit" "charge" "write" 40795 "name" "CmpBMS.BatChaMaxW - Maximale Batterieladeleistung") | indent 10 }}
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40797 # SMA Modbus Profile: CmpBMS.BatDschMinW - Minimale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40799 # SMA Modbus Profile: CmpBMS.BatDschMaxW - Maximale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40801 # SMA Modbus Profile: CmpBMS.GridWSpt - Sollwert der Netzaustauschleistung
                type: writemultiple
                decode: uint32
  {{- include "sma-battery-params" . }}
