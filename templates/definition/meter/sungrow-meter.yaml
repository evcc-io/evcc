template: sungrow-meter
products:
  - brand: Sungrow
    description:
      generic: DTSU666 (80 A)
  - brand: CHINT
    description:
      generic: DTSU666 (Sungrow firmware)
requirements:
  description:
    de: Der Zähler darf nicht gleichzeitig am Meter-Port eines Sungrow-Wechselrichters angeschlossen sein. In diesem Fall die Netzwerte über das Wechselrichter-Template auslesen.
    en: The meter must not be connected to the meter port of a Sungrow inverter at the same time. In that case, read the grid values via the inverter template.
params:
  - name: usage
    choice: ["grid", "pv", "charge"]
  - name: modbus
    choice: ["rs485"]
    id: 254
render: |
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x016A # Total active power
      type: holding
      decode: int32
    {{- if eq .usage "pv" }}
    scale: -1
    {{- end }}
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      {{- if eq .usage "pv" }}
      address: 0x0014 # Reverse active energy
      {{- else }}
      address: 0x000A # Forward active energy
      {{- end }}
      type: holding
      decode: uint32
    scale: 0.01
  returnenergy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      {{- if eq .usage "pv" }}
      address: 0x000A # Forward active energy
      {{- else }}
      address: 0x0014 # Reverse active energy
      {{- end }}
      type: holding
      decode: uint32
    scale: 0.01
  currents:
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x0064 # Current of A phase
      type: holding
      decode: uint16
    scale: 0.01
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x0065 # Current of B phase
      type: holding
      decode: uint16
    scale: 0.01
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x0066 # Current of C phase
      type: holding
      decode: uint16
    scale: 0.01
  voltages:
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x0061 # Voltage of A phase
      type: holding
      decode: uint16
    scale: 0.1
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x0062 # Voltage of B phase
      type: holding
      decode: uint16
    scale: 0.1
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x0063 # Voltage of C phase
      type: holding
      decode: uint16
    scale: 0.1
  powers:
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x0164 # Active power of A phase
      type: holding
      decode: int32
    {{- if eq .usage "pv" }}
    scale: -1
    {{- end }}
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x0166 # Active power of B phase
      type: holding
      decode: int32
    {{- if eq .usage "pv" }}
    scale: -1
    {{- end }}
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 0x0168 # Active power of C phase
      type: holding
      decode: int32
    {{- if eq .usage "pv" }}
    scale: -1
    {{- end }}
