template: sma-si-modbus
products:
  - brand: SMA
    description:
      generic: Sunny Island (Modbus)
capabilities: ["battery-control"]
discovery:
  hostname: ["sma*"]
  mac: ["0015BB", "0040AD"]
params:
  - name: usage
    choice: ["battery"]
  - name: modbus
    choice: ["tcpip"]
    port: 502
    id: 3
    help:
      en: ModbusTCP server needs to be enabled.
      de: Der ModbusTCP Server muss aktiviert sein.
  - preset: battery-params
  - name: maxchargepower
    default: 4200
    required: true
  - name: watchdog
    default: 60s
  - name: chargepower
    deprecated: true
render: |
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30775 # SMA Modbus Profile: GridMs.TotW
      type: input
      decode: int32nan
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30513 # SMA Modbus Profile: Metering.TotWhOut
      type: holding
      decode: uint64nan
    scale: 0.001
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30845 # SMA Modbus Profile: Bat.ChaStt
      type: holding
      decode: uint32nan
  batterymode:
    source: watchdog
    timeout: {{ .watchdog }}
    reset: 1 # reset watchdog on normal
    set:
      source: switch
      switch:
      - case: 1 # normal
        set:
          source: sequence
          set:
          - source: const
            value: 803 # inaktiv (Ina)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40151 # SMA Modbus Profile: Inverter.WModCfg.WCtlComCfg.WCtlComAct
                type: writemultiple
                decode: uint32
          - source: const
            value: {{ .maxchargepower }} # charging unrestricted
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40795 # Maximale Batterieladeleistung
                type: writemultiple
                decode: int32
          - source: const
            value: {{ .maxchargepower }} # discharging unrestricted
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40799 # Maximale Batterieentladeleistung
                type: writemultiple
                decode: int32
      - case: 2 # hold
        set:
          source: sequence
          set:
          - source: const
            value: 803 # inaktiv (Ina), self-consumption keeps charging from pv
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40151 # SMA Modbus Profile: Inverter.WModCfg.WCtlComCfg.WCtlComAct
                type: writemultiple
                decode: uint32
          - source: const
            value: {{ .maxchargepower }} # charging unrestricted
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40795 # Maximale Batterieladeleistung
                type: writemultiple
                decode: int32
          - source: const
            value: 0 # 0%, no discharge
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40799 # Maximale Batterieentladeleistung
                type: writemultiple
                decode: int32
      - case: 3 # charge
        set:
          source: sequence
          set:
          - source: const
            value: -{{ .maxchargepower * 1.1}} # Wirkleistungsvorgabe ---> SunnyIsland berechnet die max Wirkleistung via Ampere. 
                                               # im Falle den SI6.0H-1x sind das exemplarisch 20A, also 4600/230 = 20A. Der Max Wert ergibt sich aus dem maximal zulässigen 
                                               # Spannung im Europäischen Stromnetz (+/-10%), somit kann auf den Max Wert des Batteriestellers 10% aufgeschlagen werden 
                                               # um auch bei hohen Spannungen die max 20A auszunutzen. Dies trifft für alle SI zu. Somit erreicht man etwas mehr Leistung
                                               # bei hohen Spannungslagen, anstatt Stumpf bei 4600W bzw 20A bei 230V abzuregeln. Intern begrenzt der SI das maximum automatisch
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40149 # SMA Modbus Profile: Inverter.WModCfg.WCtlComCfg.WSpt
                type: writemultiple
                decode: int32
          - source: const
            value: 802 # aktiv (Act)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40151 # SMA Modbus Profile: Inverter.WModCfg.WCtlComCfg.WCtlComAct
                type: writemultiple
                decode: uint32
          - source: const
            value: {{ .maxchargepower }} # charging unrestricted
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40795 # Maximale Batterieladeleistung
                type: writemultiple
                decode: int32
          - source: const
            value: 0 # no discharging 
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40799 # Maximale Batterieentladeleistung
                type: writemultiple
                decode: int32
  {{- include "battery-params" . }}
