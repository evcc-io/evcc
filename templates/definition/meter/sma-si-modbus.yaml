template: sma-si-modbus
products:
  - brand: SMA
    description:
      generic: Sunny Island (Modbus)
capabilities: ["battery-control"]
discovery:
  hostname: ["sma*"]
  mac: ["0015BB", "0040AD"]
params:
  - name: usage
    choice: ["battery"]
  - name: modbus
    choice: ["tcpip"]
    port: 502
    id: 3
    help:
      en: ModbusTCP server needs to be enabled.
      de: Der ModbusTCP Server muss aktiviert sein.
  - preset: battery-params
  - name: maxchargepower 
    default: 4200
    required: true
  - name: watchdog
    default: 60s
  - name: chargepower
    deprecated: true
render: |
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30775 # SMA Modbus Profile: GridMs.TotW
      type: input
      decode: int32nan
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30513 # SMA Modbus Profile: Metering.TotWhOut
      type: holding
      decode: uint64nan
    scale: 0.001
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30845 # SMA Modbus Profile: Bat.ChaStt
      type: holding
      decode: uint32nan
  batterymode:
    source: watchdog
    timeout: {{ .watchdog }}
    reset: 1 # reset watchdog on normal
    set:
      source: switch
      switch:
      - case: 1 # normal
        set:
          source: sequence
          set:
          - source: const
            value: 803 # inaktiv (Ina)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40151 # SMA Modbus Profile: Inverter.WModCfg.WCtlComCfg.WCtlComAct
                type: writemultiple
                decode: uint32
          - source: go # Helper to read read device max from 40189 and write to 40795
            in:
            - name: maxcharge
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40189 # SMA Modbus Profile: BatConv.WMaxCha
                  type: holding
                  decode: uint32
            script: |
              val := maxcharge
            out:
            - name: val
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40795 # SMA Modbus Profile: CmpBMS.BatChaMaxW (Maximale Batterieladeleistung)
                  type: writemultiple
                  decode: uint32
          - source: go # Helper to read device max from 40191 and write to 40799
            in:
            - name: maxdischarge
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40191 # SMA Modbus Profile: BatConv.WMaxDsch
                  type: holding
                  decode: uint32
            script: |
              val := maxdischarge
            out:
            - name: val
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40799 # SMA Modbus Profile: CmpBMS.BatDschMaxW (Maximale Batterieentladeleistung)
                  type: writemultiple
                  decode: uint32
      - case: 2 # hold
        set:
          source: sequence
          set:
          - source: const
            value: 803 # inaktiv (Ina), self-consumption keeps charging from pv
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40151 # SMA Modbus Profile: Inverter.WModCfg.WCtlComCfg.WCtlComAct
                type: writemultiple
                decode: uint32
          - source: const
            value: {{ .maxchargepower }} # charging unrestricted
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40795 # SMA Modbus Profile: CmpBMS.BatChaMaxW (Maximale Batterieladeleistung)
                type: writemultiple
                decode: uint32
          - source: const
            value: 0 # 0%, no discharge
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40799 # SMA Modbus Profile: CmpBMS.BatDschMaxW (Maximale Batterieentladeleistung)
                type: writemultiple
                decode: uint32
      - case: 3 # charge
        set:
          source: sequence
          set:
          - source: const
            value: -{{ .maxchargepower }} # Wirkleistungsvorgabe
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40149 # SMA Modbus Profile: Inverter.WModCfg.WCtlComCfg.WSpt
                type: writemultiple
                decode: int32
          - source: const
            value: 802 # aktiv (Act)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40151 # SMA Modbus Profile: Inverter.WModCfg.WCtlComCfg.WCtlComAct
                type: writemultiple
                decode: uint32
          - source: go # Helper to read device max from 40191 and write to 40799
            in:
            - name: maxdischarge
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40191 # SMA Modbus Profile: BatConv.WMaxDsch
                  type: holding
                  decode: uint32
            script: |
              val := maxdischarge
            out:
            - name: val
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40799 # SMA Modbus Profile: CmpBMS.BatDschMaxW (Maximale Batterieentladeleistung)
                  type: writemultiple
                  decode: uint32
  {{- include "battery-params" . }}
