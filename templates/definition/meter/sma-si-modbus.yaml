template: sma-si-modbus
products:
  - brand: SMA
    description:
      generic: Sunny Island (Modbus)
capabilities: ["battery-control"]
discovery:
  hostname: ["sma*"]
  mac: ["0015BB", "0040AD"]
params:
  - name: usage
    choice: ["battery"]
  - name: modbus
    choice: ["tcpip"]
    port: 502
    id: 3
    help:
      en: ModbusTCP server needs to be enabled.
      de: Der ModbusTCP Server muss aktiviert sein.
  - preset: battery-params
  - name: maxchargepower
    help:
      en: Highest power the battery system can charge with. Leave empty to use the device maximum.
      de: Höchste Leistung, mit der das Batteriesystem laden kann. Leer lassen, um das Gerätemaximum zu verwenden.
  - name: maxdischargepower
    help:
      en: Highest power the battery system can discharge with. Leave empty to use the device maximum.
      de: Höchste Leistung, mit der das Batteriesystem entladen kann. Leer lassen, um das Gerätemaximum zu verwenden.
  - name: watchdog
    default: 60s
  - name: chargepower
    deprecated: true
render: |
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30775 # SMA Modbus Profile: GridMs.TotW
      type: input
      decode: int32nan
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30513 # SMA Modbus Profile: Metering.TotWhOut
      type: holding
      decode: uint64nan
    scale: 0.001
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30845 # SMA Modbus Profile: Bat.ChaStt
      type: holding
      decode: uint32nan
  batterymode:
    source: watchdog
    timeout: {{ .watchdog }}
    reset: 1 # reset watchdog on normal
    set:
      source: switch
      switch:
      - case: 1 # normal
        set:
          source: sequence
          set:
          - source: const
            value: 803 # inaktiv (Ina)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40151 # SMA Modbus Profile: Inverter.WModCfg.WCtlComCfg.WCtlComAct
                type: writemultiple
                decode: uint32
          - source: go # charge limit
            {{- include "sma-battery-limit-set" (dict "root" . "limit" "charge" "write" 40795 "name" "CmpBMS.BatChaMaxW - Maximale Batterieladeleistung") | indent 10 }}
          - source: go # discharge limit
            {{- include "sma-battery-limit-set" (dict "root" . "limit" "discharge" "write" 40799 "name" "CmpBMS.BatDschMaxW - Maximale Batterieentladeleistung") | indent 10 }}
      - case: 2 # holddischarge
        set:
          source: sequence
          set:
          - source: const
            value: 0 # no discharge
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40799 # SMA Modbus Profile: CmpBMS.BatDschMaxW - Maximale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: go # PV charging unrestricted
            {{- include "sma-battery-limit-set" (dict "root" . "limit" "charge" "write" 40795 "name" "CmpBMS.BatChaMaxW - Maximale Batterieladeleistung") | indent 10 }}
          - source: const
            value: 803 # inaktiv (Ina)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40151 # SMA Modbus Profile: Inverter.WModCfg.WCtlComCfg.WCtlComAct
                type: writemultiple
                decode: uint32
      - case: 3 # charge
        set:
          source: sequence
          set:
          - source: go # Wirkleistungsvorgabe
            {{- include "sma-battery-limit-set" (dict "root" . "limit" "charge" "negate" true "write" 40149 "name" "Inverter.WModCfg.WCtlComCfg.WSpt") | indent 10 }}
          - source: const
            value: 802 # aktiv (Act)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40151 # SMA Modbus Profile: Inverter.WModCfg.WCtlComCfg.WCtlComAct
                type: writemultiple
                decode: uint32
          - source: go # discharge limit
            {{- include "sma-battery-limit-set" (dict "root" . "limit" "discharge" "write" 40799 "name" "CmpBMS.BatDschMaxW - Maximale Batterieentladeleistung") | indent 10 }}
  {{- include "battery-capacity" . }}
  {{- include "battery-minmaxsoc" . }}
  maxchargepower:{{ include "sma-battery-limit" (dict "root" . "limit" "charge") }}
  maxdischargepower:{{ include "sma-battery-limit" (dict "root" . "limit" "discharge") }}
