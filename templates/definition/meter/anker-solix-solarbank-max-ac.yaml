template: anker-solix-solarbank-max-ac
products:
  - brand: Anker
    description:
      generic: SOLIX Solarbank Max AC
capabilities:
  - battery-control
requirements:
  description:
    de: |
      Die Modbus-TCP-Schnittstelle muss in der Anker-App freigeschaltet werden.
      evcc steuert den Backup-SoC: beim Halten auf den aktuellen SoC, im Normalbetrieb auf `minsoc` und beim Laden auf `maxsoc`. Ein in der Anker-App eingestellter Backup-SoC wird dabei überschrieben.
    en: |
      The Modbus TCP interface must be enabled in the Anker app.
      evcc controls the backup SoC: the current SoC while holding, `minsoc` in normal operation and `maxsoc` while charging. A backup SoC set in the Anker app is overwritten.
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["tcpip"]
    port: 502
    id: 1
  - name: maxacpower
    deprecated: true
  - preset: battery-params
  - name: maxchargepower
    default: 2500
  - name: maxdischargepower
    default: 800
  - name: watchdog
    default: 60s
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 10012 # Grid Power (W, positive = import, negative = export)
      type: input
      decode: int32
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: calc
    add:
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 10002 # PV Power (W)
          type: input
          decode: int32
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 10004 # Thirdparty PV Power (W)
          type: input
          decode: int32
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 10018 # Total PV Generation (kWh)
      type: input
      decode: uint32
    scale: 0.1
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 10008 # Battery Power (W, positive = discharging, negative = charging)
      type: input
      decode: int32
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 10264 # Battery Total Discharge Energy (kWh)
      type: input
      decode: uint32
    scale: 0.1
  returnenergy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 10262 # Battery Total Charge Energy (kWh)
      type: input
      decode: uint32
    scale: 0.1
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 10014 # SOC (%)
      type: input
      decode: uint16
  limitsoc:
    source: convert
    convert: float2int
    set:
      source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 60002 # Backup SoC (%)
        type: writesingle
        encoding: uint16
  batterymode:
    source: watchdog
    timeout: {{ .watchdog }}
    reset: 1
    set:
      source: switch
      switch:
        - case: 1 # normal
          set:
            source: sequence
            set:
              - source: const
                value: 0
                set:
                  source: modbus
                  {{- include "modbus" . | indent 16 }}
                  register:
                    address: 10071
                    type: writemultiple
                    encoding: int32
              - source: const
                value: 0 # self_consumption
                set:
                  source: modbus
                  {{- include "modbus" . | indent 16 }}
                  register:
                    address: 10064
                    type: writesingle
                    encoding: uint16
              - source: const
                value: 1 # Backup SoC Enable (always on)
                set:
                  source: modbus
                  {{- include "modbus" . | indent 16 }}
                  register:
                    address: 60003
                    type: writesingle
                    encoding: uint16
        - case: 2 # holddischarge: self_consumption, discharge blocked by backup SoC raised to current SoC
          set:
            source: sequence
            set:
              - source: const
                value: 0 # self_consumption
                set:
                  source: modbus
                  {{- include "modbus" . | indent 16 }}
                  register:
                    address: 10064
                    type: writesingle
                    encoding: uint16
              - source: const
                value: 1 # Backup SoC Enable (always on)
                set:
                  source: modbus
                  {{- include "modbus" . | indent 16 }}
                  register:
                    address: 60003
                    type: writesingle
                    encoding: uint16
        - case: 3 # charge
          set:
            source: sequence
            set:
              - source: const
                value: 3 # third_party_control
                set:
                  source: modbus
                  {{- include "modbus" . | indent 16 }}
                  register:
                    address: 10064
                    type: writesingle
                    encoding: uint16
              - source: const
                value: {{ .maxchargepower }}
                set:
                  source: modbus
                  {{- include "modbus" . | indent 16 }}
                  register:
                    address: 10071
                    type: writemultiple
                    encoding: int32
                  scale: -1 # negative = charge
        - case: 5 # discharge
          set:
            source: sequence
            set:
              - source: const
                value: 3 # third_party_control
                set:
                  source: modbus
                  {{- include "modbus" . | indent 16 }}
                  register:
                    address: 10064
                    type: writesingle
                    encoding: uint16
              - source: const
                value: {{ .minsoc | default 0 }} # discharge is not a limitsoc mode, reset Backup SoC raised by hold
                set:
                  source: modbus
                  {{- include "modbus" . | indent 16 }}
                  register:
                    address: 60002
                    type: writesingle
                    encoding: uint16
              - source: const
                value: {{ .maxdischargepower }} # positive = discharge
                set:
                  source: modbus
                  {{- include "modbus" . | indent 16 }}
                  register:
                    address: 10071
                    type: writemultiple
                    encoding: int32
  {{- include "battery-params" . }}
  {{- end }}
