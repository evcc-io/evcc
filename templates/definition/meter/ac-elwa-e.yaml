template: ac-elwa-e
covers: ["elwa-e"]
products:
  - brand: my-PV
    description:
      generic: AC ELWA-E
discovery:
  mdns: ["_mypv._tcp"]
  mac: ["986D35C"]
params:
  - name: usage
    choice: ["aux"]
  - name: host
render: |
  type: custom
  power:
    source: http
    uri: http://{{ .host }}/data.jsn
    insecure: true
    jq: .power
  soc:
    source: http
    uri: http://{{ .host }}/data.jsn
    insecure: true
    jq: .temp1
    scale: 0.1
