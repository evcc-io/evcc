template: powerfox-poweropti-local
products:
  - brand: Powerfox
    description:
      de: Poweropti (lokal)
      en: Poweropti (local)
requirements:
  description:
    de: Die lokale Schnittstelle erfordert den powerfox PRO Service und Firmware v2.02.07 oder neuer.
    en: The local interface requires the powerfox PRO service and firmware v2.02.07 or newer.
params:
  - name: usage
    choice: ["grid", "pv"]
  - name: host
    example: poweropti
  - name: token
    required: true
    description:
      de: API-Key
      en: API key
    help:
      de: Initial die Geräte-ID des Poweropti, z.B. 1097bd725557.
      en: Initially the Poweropti device id, e.g. 1097bd725557.
  - name: cache
    default: 5s
render: |
  type: custom
  power:
    source: http
    uri: http://{{ .host }}/value
    headers:
      - X-API-KEY: "{{ .token }}"
    jq: .values[] | select(.obis == "1.7.0") | .value
    cache: {{ .cache }}
  {{- if eq .usage "pv" }}
    scale: -1
  {{- end }}
  {{- if eq .usage "grid" }}
  energy:
    source: http
    uri: http://{{ .host }}/value
    headers:
      - X-API-KEY: "{{ .token }}"
    jq: .values[] | select(.obis == "1.8.0") | .value
    scale: 0.001
    cache: {{ .cache }}
  returnenergy:
    source: http
    uri: http://{{ .host }}/value
    headers:
      - X-API-KEY: "{{ .token }}"
    jq: .values[] | select(.obis == "2.8.0") | .value
    scale: 0.001
    cache: {{ .cache }}
  {{- end }}
