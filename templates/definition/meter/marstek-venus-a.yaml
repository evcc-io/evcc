template: marstek-venus-a
covers: ["marstek-venus-d"]
products:
  - brand: Marstek
    description:
      generic: Venus A
  - brand: Marstek
    description:
      generic: Venus D
capabilities: ["battery-control"]
params:
  - name: usage
    choice: ["pv", "battery"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    baudrate: 115200
    comset: 8N1
  - preset: battery-params
  - name: capacity
    required: true
    help:
      de: Venus A 2.12 kWh, Venus D 2.56 kWh je Basisgerät und je Erweiterung
      en: Venus A 2.12 kWh, Venus D 2.56 kWh per base unit and per extension
  - name: minsoc
    default: 11
  - name: maxsoc
    default: 100
  - name: maxchargepower
    required: true
    help:
      de: Für erzwungenes Laden des Speichers. Venus A 1200 W, Venus D 2200 W
      en: For forced charging of the battery. Venus A 1200 W, Venus D 2200 W
  - name: maxdischargepower
    required: true
  - name: work_mode_normal
    default: 1
    advanced: true
    description:
      en: Work mode for Normal state
      de: Work mode für Normal-Modus
    help:
      en: 0=manual, 1=anti-feed, 2=trade mode.
      de: 0=manuell, 1=Eigenverbrauch, 2=AI-Optimierung.
render: |
  type: custom
  {{- if eq .usage "pv" }}
  power:
    source: calc
    add:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30037 # MPPT1 power (W)
        type: holding
        decode: uint16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30038 # MPPT2 power (W)
        type: holding
        decode: uint16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30039 # MPPT3 power (W)
        type: holding
        decode: uint16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 30040 # MPPT4 power (W)
        type: holding
        decode: uint16
      scale: 0.1
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30001 # Battery power (W)
      type: holding
      decode: int16
    scale: -1
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 33002 # Total energy discharged from battery (kWh)
      type: holding
      decode: uint32
    scale: 0.01
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 32104 # Battery SOC (%)
      type: holding
      decode: uint16
  {{- include "marstek-batterymode" . }}
  {{- include "battery-params" . }}
  {{- end }}
