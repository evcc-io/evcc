template: sma-hybrid
products:
  - brand: SMA
    description:
      de: Smart Energy Hybrid-Wechselrichter
      en: Smart Energy Hybrid Inverter
capabilities: ["battery-control"]
requirements:
  description:
    en: When using active battery control by evcc, the 'Forecast-based Charging' function in the SMA portal must not be active. Otherwise, conflicts may arise when controlling the battery.
    de: Bei der Nutzung der aktiven Speichersteuerung durch evcc darf die Funktion 'Prognosebasierten Laden' im SMA Portal nicht aktiv sein. Ansonsten kann es zu Konflikten bei der Steuerung des Speichers kommen.
discovery:
  hostname: ["sma*"]
  mac: ["0015BB", "0040AD"]
params:
  - name: usage
    choice: ["pv", "battery", "grid"]
  - name: modbus
    choice: ["tcpip"]
    port: 502
    id: 3
    help:
      en: ModbusTCP server needs to be enabled.
      de: Der ModbusTCP Server muss aktiviert sein.
  - name: maxacpower
  - preset: battery-params
  - name: watchdog
    default: 60s
    usages: ["battery"]
  - name: chargepower
    deprecated: true
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: calc
    add:
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30865 # SMA Modbus Profile: Metering.GridMs.TotWIn
          type: input
          decode: int32nan
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30867 # SMA Modbus Profile: Metering.GridMs.TotWOut
          type: input
          decode: int32nan
        scale: -1
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30581 # SMA Modbus Profile: Metering.GridMs.TotWhIn
      type: holding
      decode: int32nan
    scale: 0.001
  currents:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 31435 # SMA Modbus Profile: Metering.GridMs.A.phsA # Grid current phase L1, unsigned (independent of flow direction)
        type: input
        decode: int32nan
      scale: 0.001
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 31437 # SMA Modbus Profile: Metering.GridMs.A.phsB # Grid current phase L2, unsigned (independent of flow direction)
        type: input
        decode: int32nan
      scale: 0.001
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 31439 # SMA Modbus Profile: Metering.GridMs.A.phsC # Grid current phase L3, unsigned (independent of flow direction)
        type: input
        decode: int32nan
      scale: 0.001
  powers:
    - source: calc
      add:
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 31265 # SMA Modbus Profile: Metering.GridMs.WIn.phsA # Power drawn from grid phase L1, unsigned, zero if no consumption
            type: input
            decode: uint32nan
          block: # 31259-31270
            register: 31259
            count: 12
          scale: 1
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 31259 # SMA Modbus Profile: Metering.GridMs.W.phsA # Power grid feeding L1, unsigned, zero if no feeding
            type: input
            decode: uint32nan
          block: # 31259-31270
            register: 31259
            count: 12
          scale: -1
    - source: calc
      add:
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 31267 # SMA Modbus Profile: Metering.GridMs.WIn.phsB # Power drawn from grid phase L2, unsigned, zero if no consumption
            type: input
            decode: uint32nan
          block: # 31259-31270
            register: 31259
            count: 12
          scale: 1
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 31261 # SMA Modbus Profile: Metering.GridMs.W.phsB # Power grid feeding L2, unsigned, zero if no feeding
            type: input
            decode: uint32nan
          block: # 31259-31270
            register: 31259
            count: 12
          scale: -1
    - source: calc
      add:
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 31269 # SMA Modbus Profile: Metering.GridMs.WIn.phsC # Power drawn from grid phase L3, unsigned, zero if no consumption
            type: input
            decode: uint32nan
          block: # 31259-31270
            register: 31259
            count: 12
          scale: 1
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 31263 # SMA Modbus Profile: Metering.GridMs.W.phsC # Power grid feeding L3, unsigned, zero if no feeding
            type: input
            decode: uint32nan
          block: # 31259-31270
            register: 31259
            count: 12
          scale: -1
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: calc
    add:
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30773 # SMA Modbus Profile: DcMs.Watt [0]
          type: holding
          decode: int32nan
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30961 # SMA Modbus Profile: DcMs.Watt [1]
          type: holding
          decode: int32nan
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30967 # SMA Modbus Profile: DcMs.Watt [2]
          type: holding
          decode: int32nan
  {{- if gt (.maxacpower | float64) 0.0 }}
  maxacpower: {{ .maxacpower }} # W
  {{- else }}
  maxacpower:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30231 # SMA Modbus Profile: Inverter.WLim
      type: holding
      decode: uint32nan
  {{- end }}
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: calc
    mul:
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30843 # SMA Modbus Profile: Bat.Amp, positive while discharging
          type: holding
          decode: int32nan
        scale: 0.001
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30851 # SMA Modbus Profile: Bat.Vol
          type: holding
          decode: uint32nan
        scale: 0.01
  # no energy: BMS counters BatDsch.ActBatDsch (34665) and BatChrg.ActBatChrg (34661) only count whole kWh, power is integrated instead
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30845 # SMA Modbus Profile: Bat.ChaStt
      type: holding
      decode: uint32nan
  batterymode:
    source: watchdog
    timeout: {{ .watchdog }}
    reset: 1 # reset watchdog on normal
    set:
      source: switch
      switch:
      - case: 1 # normal
        set:
          source: sequence
          set:
          - source: const
            value: 2424 # Voreinstellung (Dft)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40236 # SMA Modbus Profile: CmpBMS.OpMod - Betriebsart des BMS
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40793 # SMA Modbus Profile: CmpBMS.BatChaMinW - Minimale Batterieladeleistung
                type: writemultiple
                decode: uint32
          - source: go # charge limit
            in:
            - name: limit
              type: int
              config:
                {{- if gt (.maxchargepower | int) 0 }}
                source: const
                value: {{ .maxchargepower }}
                {{- else }}
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40189 # SMA Modbus Profile: BatConv.WMaxCha
                  type: holding
                  decode: uint32
                {{- end }}
            script: |
              limit
            out:
            - name: limit
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40795 # SMA Modbus Profile: CmpBMS.BatChaMaxW - Maximale Batterieladeleistung
                  type: writemultiple
                  decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40797 # SMA Modbus Profile: CmpBMS.BatDschMinW - Minimale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: go # discharge limit
            in:
            - name: limit
              type: int
              config:
                {{- if gt (.maxdischargepower | int) 0 }}
                source: const
                value: {{ .maxdischargepower }}
                {{- else }}
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40191 # SMA Modbus Profile: BatConv.WMaxDsch
                  type: holding
                  decode: uint32
                {{- end }}
            script: |
              limit
            out:
            - name: limit
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40799 # SMA Modbus Profile: CmpBMS.BatDschMaxW - Maximale Batterieentladeleistung
                  type: writemultiple
                  decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40801 # SMA Modbus Profile: CmpBMS.GridWSpt - Sollwert der Netzaustauschleistung
                type: writemultiple
                decode: uint32
      - case: 2 # holddischarge
        set:
          source: sequence
          set:
          - source: const
            value: 2424 # Voreinstellung (Dft)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40236 # SMA Modbus Profile: CmpBMS.OpMod - Betriebsart des BMS
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40793 # SMA Modbus Profile: CmpBMS.BatChaMinW - Minimale Batterieladeleistung
                type: writemultiple
                decode: uint32
          - source: go # charge limit
            in:
            - name: limit
              type: int
              config:
                {{- if gt (.maxchargepower | int) 0 }}
                source: const
                value: {{ .maxchargepower }}
                {{- else }}
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40189 # SMA Modbus Profile: BatConv.WMaxCha
                  type: holding
                  decode: uint32
                {{- end }}
            script: |
              limit
            out:
            - name: limit
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40795 # SMA Modbus Profile: CmpBMS.BatChaMaxW - Maximale Batterieladeleistung
                  type: writemultiple
                  decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40797 # SMA Modbus Profile: CmpBMS.BatDschMinW - Minimale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40799 # SMA Modbus Profile: CmpBMS.BatDschMaxW - Maximale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40801 # SMA Modbus Profile: CmpBMS.GridWSpt - Sollwert der Netzaustauschleistung
                type: writemultiple
                decode: uint32
      - case: 3 # charge
        set:
          source: sequence
          set:
          - source: const
            value: 2289 # Batterie laden (BatChaMod)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40236 # SMA Modbus Profile: CmpBMS.OpMod - Betriebsart des BMS
                type: writemultiple
                decode: uint32
          - source: go # charge limit
            in:
            - name: limit
              type: int
              config:
                {{- if gt (.maxchargepower | int) 0 }}
                source: const
                value: {{ .maxchargepower }}
                {{- else }}
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40189 # SMA Modbus Profile: BatConv.WMaxCha
                  type: holding
                  decode: uint32
                {{- end }}
            script: |
              limit
            out:
            - name: limit
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40793 # SMA Modbus Profile: CmpBMS.BatChaMinW - Minimale Batterieladeleistung
                  type: writemultiple
                  decode: uint32
          - source: go # charge limit
            in:
            - name: limit
              type: int
              config:
                {{- if gt (.maxchargepower | int) 0 }}
                source: const
                value: {{ .maxchargepower }}
                {{- else }}
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40189 # SMA Modbus Profile: BatConv.WMaxCha
                  type: holding
                  decode: uint32
                {{- end }}
            script: |
              limit
            out:
            - name: limit
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40795 # SMA Modbus Profile: CmpBMS.BatChaMaxW - Maximale Batterieladeleistung
                  type: writemultiple
                  decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40797 # SMA Modbus Profile: CmpBMS.BatDschMinW - Minimale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40799 # SMA Modbus Profile: CmpBMS.BatDschMaxW - Maximale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40801 # SMA Modbus Profile: CmpBMS.GridWSpt - Sollwert der Netzaustauschleistung
                type: writemultiple
                decode: uint32
      - case: 4 # holdcharge
        set:
          source: sequence
          set:
          - source: const
            value: 2424 # Voreinstellung (Dft)
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40236 # SMA Modbus Profile: CmpBMS.OpMod - Betriebsart des BMS
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40793 # SMA Modbus Profile: CmpBMS.BatChaMinW - Minimale Batterieladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40795 # SMA Modbus Profile: CmpBMS.BatChaMaxW - Maximale Batterieladeleistung
                type: writemultiple
                decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40797 # SMA Modbus Profile: CmpBMS.BatDschMinW - Minimale Batterieentladeleistung
                type: writemultiple
                decode: uint32
          - source: go # discharge limit
            in:
            - name: limit
              type: int
              config:
                {{- if gt (.maxdischargepower | int) 0 }}
                source: const
                value: {{ .maxdischargepower }}
                {{- else }}
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40191 # SMA Modbus Profile: BatConv.WMaxDsch
                  type: holding
                  decode: uint32
                {{- end }}
            script: |
              limit
            out:
            - name: limit
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 40799 # SMA Modbus Profile: CmpBMS.BatDschMaxW - Maximale Batterieentladeleistung
                  type: writemultiple
                  decode: uint32
          - source: const
            value: 0
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 40801 # SMA Modbus Profile: CmpBMS.GridWSpt - Sollwert der Netzaustauschleistung
                type: writemultiple
                decode: uint32
  {{- include "battery-capacity" . }}
  {{- include "battery-minmaxsoc" . }}
  {{- if gt (.maxchargepower | int) 0 }}
  maxchargepower: {{ .maxchargepower }} # W
  {{- else }}
  maxchargepower:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 40189 # SMA Modbus Profile: BatConv.WMaxCha
      type: holding
      decode: uint32
  {{- end }}
  {{- if gt (.maxdischargepower | int) 0 }}
  maxdischargepower: {{ .maxdischargepower }} # W
  {{- else }}
  maxdischargepower:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 40191 # SMA Modbus Profile: BatConv.WMaxDsch
      type: holding
      decode: uint32
  {{- end }}
  {{- end }}
