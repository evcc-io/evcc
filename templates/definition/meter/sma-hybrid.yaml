template: sma-hybrid
products:
  - brand: SMA
    description:
      de: Smart Energy Hybrid-Wechselrichter
      en: Smart Energy Hybrid Inverter
capabilities: ["battery-control"]
requirements:
  description:
    en: When using active battery control by evcc, the 'Forecast-based Charging' function in the SMA portal must not be active. Otherwise, conflicts may arise when controlling the battery.
    de: Bei der Nutzung der aktiven Speichersteuerung durch evcc darf die Funktion 'Prognosebasierten Laden' im SMA Portal nicht aktiv sein. Ansonsten kann es zu Konflikten bei der Steuerung des Speichers kommen.
discovery:
  hostname: ["sma*"]
  mac: ["0015BB", "0040AD"]
params:
  - name: usage
    choice: ["pv", "battery", "grid"]
  - name: modbus
    choice: ["tcpip"]
    port: 502
    id: 3
    help:
      en: ModbusTCP server needs to be enabled.
      de: Der ModbusTCP Server muss aktiviert sein.
  - name: maxacpower
    service: modbus/read?address=30231&type=holding&encoding=uint32&resulttype=int&{modbus} # Inverter.WLim, rated power
  - preset: battery-params
  - name: maxchargepower
    service: modbus/read?address=40189&type=holding&encoding=uint32&resulttype=int&{modbus} # BatConv.WMaxCha
  - name: maxdischargepower
    service: modbus/read?address=40191&type=holding&encoding=uint32&resulttype=int&{modbus} # BatConv.WMaxDsch
  - name: watchdog
    default: 60s
    usages: ["battery"]
  - name: chargepower
    deprecated: true
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: calc
    add:
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30865 # SMA Modbus Profile: Metering.GridMs.TotWIn
          type: input
          decode: int32nan
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30867 # SMA Modbus Profile: Metering.GridMs.TotWOut
          type: input
          decode: int32nan
        scale: -1
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30581 # SMA Modbus Profile: Metering.GridMs.TotWhIn
      type: holding
      decode: int32nan
    scale: 0.001
  currents:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 31435 # SMA Modbus Profile: Metering.GridMs.A.phsA # Grid current phase L1, unsigned (independent of flow direction)
        type: input
        decode: int32nan
      scale: 0.001
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 31437 # SMA Modbus Profile: Metering.GridMs.A.phsB # Grid current phase L2, unsigned (independent of flow direction)
        type: input
        decode: int32nan
      scale: 0.001
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 31439 # SMA Modbus Profile: Metering.GridMs.A.phsC # Grid current phase L3, unsigned (independent of flow direction)
        type: input
        decode: int32nan
      scale: 0.001
  powers:
    - source: calc
      add:
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 31265 # SMA Modbus Profile: Metering.GridMs.WIn.phsA # Power drawn from grid phase L1, unsigned, zero if no consumption
            type: input
            decode: uint32nan
          block: # 31259-31270
            register: 31259
            count: 12
          scale: 1
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 31259 # SMA Modbus Profile: Metering.GridMs.W.phsA # Power grid feeding L1, unsigned, zero if no feeding
            type: input
            decode: uint32nan
          block: # 31259-31270
            register: 31259
            count: 12
          scale: -1
    - source: calc
      add:
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 31267 # SMA Modbus Profile: Metering.GridMs.WIn.phsB # Power drawn from grid phase L2, unsigned, zero if no consumption
            type: input
            decode: uint32nan
          block: # 31259-31270
            register: 31259
            count: 12
          scale: 1
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 31261 # SMA Modbus Profile: Metering.GridMs.W.phsB # Power grid feeding L2, unsigned, zero if no feeding
            type: input
            decode: uint32nan
          block: # 31259-31270
            register: 31259
            count: 12
          scale: -1
    - source: calc
      add:
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 31269 # SMA Modbus Profile: Metering.GridMs.WIn.phsC # Power drawn from grid phase L3, unsigned, zero if no consumption
            type: input
            decode: uint32nan
          block: # 31259-31270
            register: 31259
            count: 12
          scale: 1
        - source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 31263 # SMA Modbus Profile: Metering.GridMs.W.phsC # Power grid feeding L3, unsigned, zero if no feeding
            type: input
            decode: uint32nan
          block: # 31259-31270
            register: 31259
            count: 12
          scale: -1
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: calc
    add:
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30773 # SMA Modbus Profile: DcMs.Watt [0]
          type: holding
          decode: int32nan
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30961 # SMA Modbus Profile: DcMs.Watt [1]
          type: holding
          decode: int32nan
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30967 # SMA Modbus Profile: DcMs.Watt [2]
          type: holding
          decode: int32nan
  maxacpower: {{ .maxacpower }} # W
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: calc
    mul:
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30843 # SMA Modbus Profile: Bat.Amp, positive while discharging
          type: holding
          decode: int32nan
        scale: 0.001
      - source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 30851 # SMA Modbus Profile: Bat.Vol
          type: holding
          decode: uint32nan
        scale: 0.01
  # no energy: BMS counters BatDsch.ActBatDsch (34665) and BatChrg.ActBatChrg (34661) only count whole kWh, power is integrated instead
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 30845 # SMA Modbus Profile: Bat.ChaStt
      type: holding
      decode: uint32nan
  {{- include "sma-batterymode" . }}
  {{- include "sma-battery-params" . }}
  {{- end }}
