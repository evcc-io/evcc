template: deye-storage
products:
  - brand: Deye
    description:
      generic: Storage (hybrid) inverter
  - brand: Sunsynk
    description:
      generic: Storage (hybrid) inverter
capabilities: ["battery-control", "curtail"]
params:
  - name: usage
    choice: ["pv", "battery", "grid"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    baudrate: 9600
    id: 1
  - name: maxacpower
    service: modbus/read?address=16&type=holding&encoding=uint32s&scale=0.1&{modbus} # Rated power, 0.1 W
  - preset: battery-params
  - name: maxdischargecurrent
    service: modbus/read?address=211&type=holding&encoding=uint16&{modbus} # Battery Max Discharge Current
    required: true
    example: 100
    advanced: true
    description:
      en: Max Discharge Current
      de: Max Entladestrom
    help:
      en: |
        Maximum battery discharge current in Amperes (A) for normal mode. Register 211 accepts 0-185 A.
        Power calculation: P(W) = Current(A) x Voltage(V). Example with 48V battery: 100A x 48V = 4800W (4.8kW).
      de: |
        Maximaler Batterieentladestrom in Ampere (A) für Normalmodus. Register 211 akzeptiert 0-185 A.
        Leistungsberechnung: P(W) = Strom(A) x Spannung(V). Beispiel mit 48V Batterie: 100A x 48V = 4800W (4,8kW).
  - name: maxchargecurrent
    service: modbus/read?address=210&type=holding&encoding=uint16&{modbus} # Battery Max Charge Current
    advanced: true
    description:
      en: Max Charge Current
      de: Max Ladestrom
    help:
      en: Maximum battery charge current in Amperes (A), restored after holdcharge mode. Enables the holdcharge battery mode, which stops charging by setting the charge current to 0.
      de: Maximaler Batterieladestrom in Ampere (A), wird nach dem Modus Laden sperren wiederhergestellt. Aktiviert den Batteriemodus Laden sperren, der das Laden durch einen Ladestrom von 0 unterbindet.
  - name: gridchargecurrent
    service: modbus/read?address=230&type=holding&encoding=uint16&{modbus} # Grid Charge Battery Current
    required: true
    example: 60
    advanced: true
    description:
      en: Grid Charge Current
      de: Netzladestrom
    help:
      en: |
        Maximum battery charging current in Amperes (A) from grid for charge mode. Register 230 accepts 0-185 A.
        Power calculation: P(W) = Current(A) x Voltage(V). Example with 48V battery: 60A x 48V = 2880W (2.9kW).
      de: |
        Maximaler Batterieladestrom in Ampere (A) aus dem Netz für Lademodus. Register 230 akzeptiert 0-185 A.
        Leistungsberechnung: P(W) = Strom(A) x Spannung(V). Beispiel mit 48V Batterie: 60A x 48V = 2880W (2,9kW).
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 169 # "Total grid power"
      type: holding
      decode: int16
  energy:
    source: calc
    add:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 78 # "Total_GridBuy_PowerWh_low"
        type: holding
        decode: uint16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 80 # "Total_GridBuy_PowerWh"
        type: holding
        decode: uint16
      scale: 6553.6
  returnenergy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 81 # "Total_GridSell_PowerWh" (low word, high word at 82)
      type: holding
      decode: uint32s
    scale: 0.1
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: calc
    add:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 186 # "PV1 input power"
        type: holding
        decode: uint16
      block: # 186-189
        register: 186
        count: 4
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 187 # "PV2 input power"
        type: holding
        decode: uint16
      block: # 186-189
        register: 186
        count: 4
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 188 # "PV3 input power"
        type: holding
        decode: uint16
      block: # 186-189
        register: 186
        count: 4
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 189 # "PV4 input power"
        type: holding
        decode: uint16
      block: # 186-189
        register: 186
        count: 4
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 96 # "historyPV PowerWh"
      type: holding
      decode: uint32s
    scale: 0.1
  {{- if gt (.maxacpower | int) 0 }}
  maxacpower: {{ .maxacpower }}
  # Feed-in curtailment via "Max Sell Power" (register 245, watts). The register is the
  # device's always-active feed-in ceiling; there is no separate limit-enable register.
  # "Solar Export" (register 247) is the owner's export on/off switch and left untouched.
  curtail: # limit feed-in to the given percent of nominal (100 % = nominal power)
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 245 # Max Sell Power (W)
      type: writemultiple
      decode: uint16
    scale: {{ divf (maxf .maxacpower 1) 100 }} # % to W
  curtailed: # allowed feed-in as percent of nominal, derived from Max Sell Power
    source: go
    in:
      - name: limit
        type: float
        config:
          source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 245 # Max Sell Power (W)
            type: holding
            decode: uint16
    script: |
      // float64 is required: a whole-number input arrives as an int literal
      // round, the watt conversion does not reproduce the written percent exactly
      p := int(float64(limit)*100/{{ maxf .maxacpower 1 }} + 0.5)
      if p > 100 {
        p = 100
      }
      p
  {{- end }}
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 190 # "Battery output power"
      type: holding
      decode: int16
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 74 # "Battery cumulative discharge"
      type: holding
      decode: uint32s
    scale: 0.1
  returnenergy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 72 # "Battery cumulative charge"
      type: holding
      decode: uint32s
    scale: 0.1
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 184 # "battery capacity"
      type: holding
      decode: uint16
  batterymode:
    source: switch
    switch:
    - case: 1 # normal
      set:
        source: sequence
        set:
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 229 # Battery Grid Charging Start (set to minsoc)
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 268 # Program 1 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 269 # Program 2 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 270 # Program 3 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 271 # Program 4 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 272 # Program 5 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 273 # Program 6 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: 1 # enabled
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 232 # Battery Grid Charging
              type: writemultiple
              decode: uint16
        - source: const
          value: 0x00FF # Week, enable TOU
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 248 # Time of Use
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .maxdischargecurrent }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 211 # Battery Max Discharging Current
              type: writemultiple
              decode: uint16
        {{- if gt (.maxchargecurrent | int) 0 }}
        - source: const
          value: {{ .maxchargecurrent }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 210 # Battery Max Charging Current
              type: writemultiple
              decode: uint16
        {{- end }}
    - case: 2 # hold - prevent discharge
      set:
        source: sequence
        set:
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 229 # Battery Grid Charging Start (set to minsoc)
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 268 # Program 1 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 269 # Program 2 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 270 # Program 3 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 271 # Program 4 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 272 # Program 5 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 273 # Program 6 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: 0x00FF # Week, enable TOU
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 248 # Time of Use
              type: writemultiple
              decode: uint16
        - source: const
          value: 0
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 211 # Battery Max Discharging Current
              type: writemultiple
              decode: uint16
        {{- if gt (.maxchargecurrent | int) 0 }}
        - source: const
          value: {{ .maxchargecurrent }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 210 # Battery Max Charging Current
              type: writemultiple
              decode: uint16
        {{- end }}
    - case: 3 # charge - enable grid charging
      set:
        source: sequence
        set:
        - source: const
          value: {{ .gridchargecurrent }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 230 # Battery Grid Charging Current
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .maxsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 229 # Battery Grid Charging Start (SOC target)
              type: writemultiple
              decode: uint16
        - source: const
          value: 1 # enabled
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 232 # Battery Grid Charging
              type: writemultiple
              decode: uint16
        - source: const
          value: 0x0000 # Disabled, ignore TOU schedule
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 248 # Time of Use
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .maxdischargecurrent }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 211 # Battery Max Discharging Current
              type: writemultiple
              decode: uint16
        {{- if gt (.maxchargecurrent | int) 0 }}
        - source: const
          value: {{ .maxchargecurrent }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 210 # Battery Max Charging Current
              type: writemultiple
              decode: uint16
        {{- end }}
    {{- if gt (.maxchargecurrent | int) 0 }}
    - case: 4 # holdcharge - prevent charging
      set:
        source: sequence
        set:
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 229 # Battery Grid Charging Start (set to minsoc)
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 268 # Program 1 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 269 # Program 2 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 270 # Program 3 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 271 # Program 4 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 272 # Program 5 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .minsoc }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 273 # Program 6 SOC
              type: writemultiple
              decode: uint16
        - source: const
          value: 1 # enabled
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 232 # Battery Grid Charging
              type: writemultiple
              decode: uint16
        - source: const
          value: 0x00FF # Week, enable TOU
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 248 # Time of Use
              type: writemultiple
              decode: uint16
        - source: const
          value: {{ .maxdischargecurrent }}
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 211 # Battery Max Discharging Current
              type: writemultiple
              decode: uint16
        - source: const
          value: 0
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 210 # Battery Max Charging Current
              type: writemultiple
              decode: uint16
    {{- end }}
  {{- include "battery-params" . }}
  {{- end }}
