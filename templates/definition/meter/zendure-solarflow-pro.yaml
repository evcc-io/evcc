template: zendure-solarflow-pro
products:
  - brand: Zendure
    description:
      generic: Solarflow 800 Pro
params:
  - name: usage
    choice: ["pv"]
  - name: host
  - name: maxacpower
    default: 800 # W
  - name: cache
    default: 1s
render: |
  type: custom
  power:
    source: http
    uri: http://{{ .host }}/properties/report
    jq: .properties.solarInputPower
    cache: {{ .cache }}
  maxacpower: {{ .maxacpower }}
