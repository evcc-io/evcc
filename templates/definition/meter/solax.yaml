template: solax
covers: ["solax-x1", "solax-x3"]
products:
  - brand: Solax
    description:
      generic: Hybrid X1/X3 G3/G4
  - brand: Qcells
    description:
      generic: Q.HOME ESS HYB-G3
capabilities: ["battery-control"]
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    id: 1
    baudrate: 19200
  - name: mppt3
    type: bool
    default: false
    description:
      de: Dritter PV-Eingang
      en: Third PV input
    help:
      de: Der Wechselrichter hat einen dritten PV-Eingang (MPPT3)
      en: The inverter has a third PV input (MPPT3)
  - name: maxacpower
  - name: storageunit
  - preset: battery-params
  - name: defaultmode
    default: 0 # "SelfUse"
  - name: remotecontrol
    type: bool
    default: false
    advanced: true
    usages: ["battery"]
    description:
      de: Batteriesteuerung per Fernsteuerung (VPP)
      en: Battery control by remote control (VPP)
    help:
      de: Steuert die Batterie über die Modbus Power Control Register statt über die Betriebsart. Diese Register werden nicht im EEPROM gespeichert. evcc erneuert sie regelmäßig, ohne Erneuerung kehrt der Wechselrichter nach etwa 10 Minuten zum Eigenverbrauch zurück. Benötigt Firmware mit VPP-Modi 0-7 (laut SolaX X3-Hybrid G4 ab ARM 1.40/DSP 1.41, X1-Hybrid G4 ab ARM 1.41/DSP 1.44). Getestet mit X3-Hybrid G4, andere Generationen können sich anders verhalten. Vor dem Aktivieren die Batterie auf Normal schalten.
      en: Controls the battery using the Modbus Power Control registers instead of the work mode. These registers are not stored in EEPROM. evcc refreshes them regularly, without refresh the inverter returns to self use after about 10 minutes. Requires firmware with VPP modes 0-7 (according to SolaX X3-Hybrid G4 from ARM 1.40/DSP 1.41, X1-Hybrid G4 from ARM 1.41/DSP 1.44). Tested with X3-Hybrid G4, other generations may behave differently. Switch the battery to normal before enabling.
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 70 # 0x0046 feedin_power(meter)
      type: input
      decode: int32s
    scale: -1
  # no energy: 0x004A consum_energy_total(meter) sums per phase (not phase-balanced)
  currents:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 206 # 0x00CE GridCurrent_R_Meter
        type: input
        decode: int16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 207 # 0x00CF GridCurrent_S_Meter
        type: input
        decode: int16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 208 # 0x00D0 GridCurrent_T_Meter
        type: input
        decode: int16
      scale: 0.1
  voltages:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 202 # 0x00CA GridVoltage_R_Meter
        type: input
        decode: uint16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 203 # 0x00CB GridVoltage_S_Meter
        type: input
        decode: uint16
      scale: 0.1
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 204 # 0x00CC GridVoltage_T_Meter
        type: input
        decode: uint16
      scale: 0.1
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: calc
    add:
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 10 # 0x000A Powerdc1
        type: input
        decode: uint16
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 11 # 0x000B Powerdc2
        type: input
        decode: uint16
  {{- if .mppt3 }}
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 292 # 0x0124 Powerdc3
        type: input
        decode: uint16
  {{- end }}
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 148 # 0x0094 SolarEnergyTotal
      type: input
      decode: uint32s
    scale: 0.1
  maxacpower: {{ .maxacpower }} # W
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      {{- if eq .storageunit "1" }}
      address: 22 # 0x0016 Batpower_Charge1
      {{- else }}
      address: 297 # 0x0129 Batpower_Charge2
      {{- end }}
      type: input
      decode: int16
    scale: -1
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      {{- if eq .storageunit "1" }}
      address: 28 # 0x001C Battery 1 Capacity
      {{- else }}
      address: 301 # 0x012D Battery 2 Capacity
      {{- end }}
      type: input
      decode: uint16
  # energy:
  #   source: modbus
  #   register:
  #     address: 29 # 0x001D Battery Output Energy Total
  #     type: input
  #     decode: uint32s
  #   scale: 0.1
  {{- if .remotecontrol }}
  {{- /* power control registers are volatile (no EEPROM wear) and expire after ~10 min; 32 bit values are low word first */}}
  {{- $soc := .maxsoc | int }}
  {{- if eq $soc 0 }}{{ $soc = 100 }}{{ end }}
  {{- $power := .maxchargepower | int }}
  {{- if eq $power 0 }}{{ $power = 30000 }}{{ end }}
  batterymode:
    source: watchdog
    timeout: 5m # re-write at timeout/2, inverter leaves the mode after 600s; normal is refreshed too since writes during inverter idle are not applied
    set:
      source: switch
      switch:
      - case: 1 # normal
        set:
          source: convert
          convert: int2bytes
          set:
            source: const
            value: "0x0000_0000_00000000_00000000_0000_0000_00000000_00000000_0000" # disabled
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 0x007C # ModbusPowerControl
                type: writemultiple
                decode: bytes
      - case: 2 # holddischarge
        set:
          source: convert
          convert: int2bytes
          set:
            source: const
            value: "0x0007_0001_00000000_00000000_0000_0000_00000000_00000000_0258_00000000" # self-consume, charge only
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 0x007C # ModbusPowerControl
                type: writemultiple
                decode: bytes
      - case: 3 # charge
        set:
          source: convert
          convert: int2bytes
          set:
            source: const
            value: '{{ printf "0x0003_0001_00000000_00000000_0000_%04X_00000000_%04X%04X_0258" $soc (mod $power 65536) (div $power 65536) }}' # soc target control
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 0x007C # ModbusPowerControl
                type: writemultiple
                decode: bytes
  {{- else }}
  batterymode:
    source: switch
    switch:
    - case: 1 # normal
      set:
        source: const
        value: {{ .defaultmode }}
        set:
          source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 0x001F # SolarChargeUseMode
            type: writesingle
            decode: uint16
    - case: 2 # holddischarge
      set:
        source: sequence
        set:
        - source: const
          value: 0 # Stop force charge & discharge
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 0x0020 # Manual mode
              type: writesingle
              decode: uint16
        - source: const
          value: 3 # manual mode
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 0x001F # SolarChargeUseMode
              type: writesingle
              decode: uint16
    - case: 3 # charge
      set:
        source: sequence
        set:
        - source: const
          value: 1 # Wake battery from standby
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 0x0056 # Bat_Awaken
              type: writesingle
              decode: uint16
        - source: const
          value: 1 # Force charge
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 0x0020 # Manual mode
              type: writesingle
              decode: uint16
        - source: const
          value: 3 # manual mode
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 0x001F # SolarChargeUseMode
              type: writesingle
              decode: uint16
  {{- end }}
  {{- include "battery-params" . }}
  {{- end }}
