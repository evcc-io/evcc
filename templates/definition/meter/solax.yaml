template: solax
covers: ["solax-x1", "solax-x3"]
products:
  - brand: Solax
    description:
      generic: Hybrid X1/X3 G3/G4
  - brand: Qcells
    description:
      generic: Q.HOME ESS HYB-G3
capabilities: ["battery-control"]
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    baudrate: 19200
  - name: mppt3
    type: bool
    default: false
    description:
      de: Dritter PV-Eingang
      en: Third PV input
    help:
      de: Der Wechselrichter hat einen dritten PV-Eingang (MPPT3)
      en: The inverter has a third PV input (MPPT3)
  - name: maxacpower
  - name: storageunit
  - preset: battery-params
  - name: defaultmode
    default: 0 # "SelfUse"
render: |
  {{- include "solax" . }}
  {{- if eq .usage "battery" }}
  {{- include "battery-params" . }}
  {{- end }}
