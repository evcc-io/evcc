template: gossen-energymid
products:
  - brand: Gossen Metrawatt
    description:
      generic: ENERGYMID EM2289
  - brand: Gossen Metrawatt
    description:
      generic: ENERGYMID EM2389
params:
  - name: usage
    choice: ["grid", "pv", "charge"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    comset: 8E1
render: |
  type: mbmd
  {{- include "modbus" . }}
  model: energymid
  {{- if ne .usage "pv" }}
  power: Power
  energy: Import
  returnenergy: Export
  currents:
    - CurrentL1
    - CurrentL2
    - CurrentL3
  powers:
    - PowerL1
    - PowerL2
    - PowerL3
  {{- else }}
  power: -Power
  energy: Export
  returnenergy: Import
  currents:
    - -CurrentL1
    - -CurrentL2
    - -CurrentL3
  powers:
    - -PowerL1
    - -PowerL2
    - -PowerL3
  {{- end }}
  voltages:
    - VoltageL1
    - VoltageL2
    - VoltageL3
