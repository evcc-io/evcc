template: huawei-emma
products:
  - brand: Huawei
    description:
      generic: EMMA
capabilities: ["curtail"]
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["tcpip"]
  - preset: battery-params
requirements:
  description:
    en: |
      Modbus TCP has to be enabled on the EMMA with the installer account in the FusionSolar app (Commission device, Communication settings, Modbus TCP). The EMMA answers at unit ID 0, which the template uses.

      The EMMA accepts a single Modbus TCP client at a time; further connections are reset. To share it with other systems, e.g. Home Assistant, use the [Modbus proxy](https://docs.evcc.io/en/reference/configuration/modbusproxy) of evcc.

      The battery readings of the EMMA are read-only. For active battery control, configure the battery with the SUN2000 Hybrid template instead, using the address of the EMMA and the unit ID of the inverter: the EMMA forwards these requests to the inverter. The unit ID is assigned dynamically and can be found in FusionSolar or by trial. When evcc controls the battery, disable the EMMA's own AI energy optimization in the FusionSolar app and leave it in maximum self-consumption mode: only one system should schedule the battery.
    de: |
      Modbus TCP muss auf der EMMA mit dem Installateur-Konto in der FusionSolar-App aktiviert werden (Gerät in Betrieb nehmen, Kommunikationseinstellungen, Modbus TCP). Die EMMA antwortet auf Unit-ID 0, die das Template verwendet.

      Die EMMA akzeptiert nur einen Modbus-TCP-Client gleichzeitig; weitere Verbindungen werden zurückgesetzt. Um sie mit anderen Systemen wie Home Assistant zu teilen, den [Modbus-Proxy](https://docs.evcc.io/de/reference/configuration/modbusproxy) von evcc verwenden.

      Die Batteriewerte der EMMA sind nur lesbar. Für die aktive Batteriesteuerung die Batterie stattdessen mit dem Template SUN2000 Hybrid konfigurieren, mit der Adresse der EMMA und der Unit-ID des Wechselrichters: die EMMA leitet diese Anfragen an den Wechselrichter weiter. Die Unit-ID wird dynamisch vergeben und ist in FusionSolar oder durch Ausprobieren zu finden. Wenn evcc die Batterie steuert, die KI-Energieoptimierung der EMMA in der FusionSolar-App deaktivieren und die EMMA im Modus maximaler Eigenverbrauch belassen: nur ein System sollte die Batterie planen.
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 31657 # Active power of built-in electric energy sensor
      type: holding
      decode: int32
  energy:
    source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 31687 # Total positive active energy of built-in electric energy sensor (grid import)
      type: holding
      decode: int64
    scale: 0.01
  returnenergy:
    source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 31679 # Total negative active energy of built-in electric energy sensor (grid export)
      type: holding
      decode: int64
    scale: 0.01
  currents:
  - source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 31651 # Huawei phase A grid current
      type: holding
      decode: int32
    scale: 0.1
  - source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 31653 # Huawei phase B grid current
      type: holding
      decode: int32
    scale: 0.1
  - source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 31655 # Huawei phase C grid current
      type: holding
      decode: int32
    scale: 0.1
  voltages:
  - source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 31639 # Huawei phase A grid voltage
      type: holding
      decode: uint32
    scale: 0.01
  - source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 31641 # Huawei phase B grid voltage
      type: holding
      decode: uint32
    scale: 0.01
  - source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 31643 # Huawei phase C grid voltage
      type: holding
      decode: uint32
    scale: 0.01
  powers:
  - source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 31665 # Huawei phase A grid power
      type: holding
      decode: int32
  - source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 31667 # Huawei phase B grid power
      type: holding
      decode: int32
  - source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 31669 # Huawei phase C grid power
      type: holding
      decode: int32
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 30354 # Active power
      type: holding
      decode: int32
  energy:
    source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 30348 # E-Total
      type: holding
      decode: uint64nan
    scale: 0.01
  curtail:
    source: sequence
    set:
    # allowed feed-in power as percent of nominal (0-100 %)
    - source: modbus
      id: 0
      uri: {{ joinHostPort .host .port }}
      register:
        address: 40109 # Maximum grid feed-in power (0-100 %)
        type: writesingle
        encoding: uint16
      scale: 10
    # power control mode at grid connection point: 7 = percentage limit while curtailed, 0 = unlimited at 100%
    - source: switch
      switch:
        - case: 100 # uncurtailed
          set:
            source: const
            value: 0 # Unlimited
            set:
              source: modbus
              id: 0
              uri: {{ joinHostPort .host .port }}
              register:
                address: 40100 # Power control mode at grid connection point
                type: writesingle
                encoding: uint16
      default:
        source: const
        value: 7 # Power-limited grid connection (%)
        set:
          source: modbus
          id: 0
          uri: {{ joinHostPort .host .port }}
          register:
            address: 40100 # Power control mode at grid connection point
            type: writesingle
            encoding: uint16
  curtailed:
    source: go
    in:
    - name: mode
      type: int
      config:
        source: modbus
        id: 0
        uri: {{ joinHostPort .host .port }}
        register:
          address: 40100 # Power control mode at grid connection point (0=no curtailment)
          type: holding
          decode: uint16
    - name: percent
      type: int
      config:
        source: modbus
        id: 0
        uri: {{ joinHostPort .host .port }}
        register:
          address: 40109 # Maximum grid feed-in power (0-100 %)
          type: holding
          decode: uint16
        scale: 0.1
    # the percentage register is only meaningful while a limit mode is active
    script: |
      limit := percent
      if mode != 7 {
        limit = 100
      }
      limit
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 30360
      type: holding
      decode: int32nan
    scale: -1
  energy:
    source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 30312 # Total discharge
      type: holding
      decode: uint32nan
    scale: 0.01
  soc:
    source: modbus
    id: 0
    uri: {{ joinHostPort .host .port }}
    register:
      address: 30368
      type: holding
      decode: uint16nan
    scale: 0.01
  {{- include "battery-params" . }}
  {{- end }}
