template: sungrow-ihm
products:
  - brand: Sungrow
    description:
      generic: iHomeManager (iHM)
capabilities: ["curtail"]
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["tcpip", "rs485"]
    baudrate: 9600
    comset: "8N1"
    id: 247
    port: 502
  - name: maxacpower
    usages: ["pv"]
    service: modbus/read?address=8144&type=input&encoding=uint32&scale=100&{modbus} # Register 8145 (Total rated active power, 0.1kW)
  - preset: battery-params
render: |
  {{- if eq .usage "grid" }}
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8156 # Register 8157 (Total active power)
      type: input
      decode: int32s
    block: # Register 8155-8163
      register: 8154
      count: 9
    scale: 10
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8175 # Register 8176 (Import energy at the grid meter)
      type: input
      decode: uint32s
    block: # Register 8176-8179
      register: 8175
      count: 4
    scale: 0.1
  returnenergy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8177 # Register 8178 (Export energy at the grid meter)
      type: input
      decode: uint32s
    block: # Register 8176-8179
      register: 8175
      count: 4
    scale: 0.1
  voltages:
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 4357 # Register 4358 (Phase A voltage, phase-to-neutral, undocumented)
      type: input
      decode: uint16
    block: # Register 4358-4363
      register: 4357
      count: 6
    scale: 0.1 # Factor 0.1 V
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 4359 # Register 4360 (Phase B voltage, phase-to-neutral)
      type: input
      decode: uint16
    block: # Register 4358-4363
      register: 4357
      count: 6
    scale: 0.1
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 4361 # Register 4362 (Phase C voltage, phase-to-neutral)
      type: input
      decode: uint16
    block: # Register 4358-4363
      register: 4357
      count: 6
    scale: 0.1
  powers:
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8558 # Register 8559 (Phase A active power, S32, signed import/export)
      type: input
      decode: int32s
    block: # Register 8559-8564
      register: 8558
      count: 6
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8560 # Register 8561 (Phase B active power)
      type: input
      decode: int32s
    block: # Register 8559-8564
      register: 8558
      count: 6
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8562 # Register 8563 (Phase C active power)
      type: input
      decode: int32s
    block: # Register 8559-8564
      register: 8558
      count: 6
  {{- end }}
  {{- if eq .usage "pv" }}
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8154 # Register 8155 (Total active power)
      type: input
      decode: int32s
    block: # Register 8155-8163
      register: 8154
      count: 9
    scale: 10
  maxacpower: {{ .maxacpower }} # W
  curtail:
    source: sequence
    set:
    # allowed feed-in power as percent of nominal (0-100 % -> 0-1000 = 0.1%)
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 8030 # Register 8031 (Feed-in limitation ratio, 0-1000 = 0.1%)
        type: writesingle
        decode: int16
      scale: 10
    # feed-in limitation: disabled at 100% (unlimited), enabled while curtailed
    - source: switch
      switch:
        - case: 100 # uncurtailed
          set:
            source: const
            value: 85 # 0x55: Disable feed-in limitation
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 8027 # Register 8028 (Feed-in limitation)
                type: writesingle
                decode: uint16
      default:
        source: const
        value: 170 # 0xAA: Enable feed-in limitation
        set:
          source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 8027 # Register 8028 (Feed-in limitation)
            type: writesingle
            decode: uint16
  curtailed: # the limitation ratio only applies while the feed-in limitation is enabled
    source: go
    in:
    - name: ena
      type: int
      config:
        source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 8027 # Register 8028 (Feed-in limitation, 0x55=off, 0xAA=on)
          type: holding
          decode: uint16
    - name: ratio
      type: int
      config:
        source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 8030 # Register 8031 (Feed-in limitation ratio, 0-1000 = 0.1%)
          type: holding
          decode: int16
        scale: 0.1
    script: |
      percent := 100
      if ena == 170 {
        percent = ratio
      }
      percent
  {{- end }}
  {{- if eq .usage "battery" }}
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8160 # Register 8161 (Battery power)
      type: input
      decode: int32s
    block: # Register 8155-8163
      register: 8154
      count: 9
    scale: 10
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8162 # Register 8163 (State of charge)
      type: input
      decode: uint16
    block: # Register 8155-8163
      register: 8154
      count: 9
    scale: 0.1
  {{- include "battery-params" . }}
  {{- end }}
