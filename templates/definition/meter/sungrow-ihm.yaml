template: sungrow-ihm
products:
  - brand: Sungrow
    description:
      generic: iHomeManager (iHM)
capabilities: ["curtail", "battery-control"]
caveats:
  - description:
      de: Die Batteriesteuerung wird durch Angabe der maximalen Ladeleistung aktiviert. Keine weitere Steuerung am iHomeManager oder an den einzelnen Wechselrichtern verwenden.
      en: Set the maximum charge power to enable battery control. Do not use another controller on the iHomeManager or individual inverters.
  - description:
      de: Das Unterbinden der Entladung stoppt auch das Laden aus PV. Bei Kommunikationsverlust soll der iHomeManager nach 60 Sekunden in den Eigenverbrauchsmodus wechseln. VPP und Timeout sind noch auf Hardware zu verifizieren.
      en: Preventing discharge also stops PV charging. On communication loss, the iHomeManager is expected to return to self-consumption after 60 seconds. VPP and timeout behavior still require hardware validation.
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["tcpip", "rs485"]
    baudrate: 9600
    comset: "8N1"
    id: 247
    port: 502
  - name: maxacpower
    usages: ["pv"]
    service: modbus/read?address=8144&type=input&encoding=uint32&scale=100&{modbus} # Register 8145 (Total rated active power, 0.1kW)
  - preset: battery-params
  - name: maxchargepower
    example: 1000
    help:
      de: Aktiviert die Batteriesteuerung. Gesamtleistung aller Batterien in Schritten von 100 W. Nur einen vom System unterstützten Wert einstellen.
      en: Enables battery control. Total power of all batteries in steps of 100 W. Only configure a value supported by the system.
    service: modbus/read?address=8148&type=input&encoding=uint32s&scale=100&{modbus}
render: |
  {{- if eq .usage "grid" }}
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8156 # Register 8157 (Total active power)
      type: input
      decode: int32s
    scale: 10
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8175 # Register 8176 (Import energy at the grid meter)
      type: input
      decode: uint32s
    scale: 0.1
  returnenergy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8177 # Register 8178 (Export energy at the grid meter)
      type: input
      decode: uint32s
    scale: 0.1
  voltages:
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 4356 # Register 4357 (Phase A voltage, phase-to-neutral)
      type: input
      decode: uint16
    scale: 0.1 # Factor 0.1 V
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 4358 # Register 4359 (Phase B voltage, phase-to-neutral)
      type: input
      decode: uint16
    scale: 0.1
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 4360 # Register 4361 (Phase C voltage, phase-to-neutral)
      type: input
      decode: uint16
    scale: 0.1
  powers:
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8558 # Register 8559 (Phase A active power, S32, signed import/export)
      type: input
      decode: int32s
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8560 # Register 8561 (Phase B active power)
      type: input
      decode: int32s
  - source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8562 # Register 8563 (Phase C active power)
      type: input
      decode: int32s
  {{- end }}
  {{- if eq .usage "pv" }}
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8154 # Register 8155 (Total active power)
      type: input
      decode: int32s
    scale: 10
  maxacpower: {{ .maxacpower }} # W
  curtail:
    source: sequence
    set:
    # allowed feed-in power as percent of nominal (0-100 % -> 0-1000 = 0.1%)
    - source: modbus
      {{- include "modbus" . | indent 4 }}
      register:
        address: 8030 # Register 8031 (Feed-in limitation ratio, 0-1000 = 0.1%)
        type: writesingle
        decode: int16
      scale: 10
    # feed-in limitation: disabled at 100% (unlimited), enabled while curtailed
    - source: switch
      switch:
        - case: 100 # uncurtailed
          set:
            source: const
            value: 0 # Disable feed-in limitation
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 8027 # Register 8028 (Feed-in limitation)
                type: writesingle
                decode: uint16
      default:
        source: const
        value: 1 # Enable feed-in limitation
        set:
          source: modbus
          {{- include "modbus" . | indent 8 }}
          register:
            address: 8027 # Register 8028 (Feed-in limitation)
            type: writesingle
            decode: uint16
  curtailed: # the limitation ratio only applies while the feed-in limitation is enabled
    source: go
    in:
    - name: ena
      type: int
      config:
        source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 8027 # Register 8028 (Feed-in limitation, 1=on)
          type: holding
          decode: uint16
    - name: ratio
      type: int
      config:
        source: modbus
        {{- include "modbus" . | indent 6 }}
        register:
          address: 8030 # Register 8031 (Feed-in limitation ratio, 0-1000 = 0.1%)
          type: holding
          decode: int16
        scale: 0.1
    script: |
      percent := 100
      if ena != 0 {
        percent = ratio
      }
      percent
  {{- end }}
  {{- if eq .usage "battery" }}
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8160 # Register 8161 (Battery power)
      type: input
      decode: int32s
    scale: 10
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 8162 # Register 8163 (State of charge)
      type: input
      decode: uint16
    scale: 0.1
  {{- $chargepower := int64 (or .maxchargepower 0) }}
  {{- if or (lt $chargepower 0) (gt $chargepower 429496729500) (ne (mod $chargepower 100) 0) }}
  {{- fail "maxchargepower must be a non-negative multiple of 100 W within the U32 register range" }}
  {{- end }}
  {{- if gt $chargepower 0 }}
  batterymodes: ["normal", "hold", "charge"]
  batterymode:
    source: watchdog
    timeout: 60s
    reset: 1
    set:
      source: sequence
      set:
      # Neutralize stale commands before changing mode or power, but do not interrupt a running charge on refresh.
      - source: switch
        switch:
        - case: 1 # normal
          set: &stop
            source: const
            value: 0xCC
            set: &command
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 8024 # Register 8025 (Charge/discharge command)
                type: writesingle
                decode: uint16
        - case: 2 # hold
          set: *stop
        - case: 3 # charge
          set:
            source: go
            in:
            - name: mode
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 8023 # Register 8024 (Energy management mode)
                  type: holding
                  decode: uint16
            - name: command
              type: int
              config:
                source: modbus
                {{- include "modbus" . | indent 14 }}
                register:
                  address: 8024
                  type: holding
                  decode: uint16
            script: |
              res := 0xCC
              if mode == 4 && command == 0xAA {
                res = 0xAA
              }
              res
            out:
            - name: command
              type: int
              config: *command
      - source: switch
        switch:
        - case: 3
          set:
            source: const
            value: {{ div $chargepower 100 }}
            set:
              source: modbus
              {{- include "modbus" . | indent 12 }}
              register:
                address: 8025 # Registers 8026-8027 (Charge/discharge power, 0.1 kW)
                type: writemultiple
                decode: uint32s
        default:
          source: sleep
          duration: 0s
      # Arm the device timeout before entering VPP, including the first command after startup.
      - source: switch
        switch:
        - case: 1
          set:
            source: sleep
            duration: 0s
        default:
          source: const
          value: 60
          set:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 8032 # Register 8033 (External VPP heartbeat, seconds)
              type: writesingle
              decode: uint16
      - source: go
        script: |
          mode := 4
          if batteryMode == 1 {
            mode = 1
          }
          mode
        out:
        - name: mode
          type: int
          config:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 8023
              type: writesingle
              decode: uint16
      - source: go
        in:
        - name: mode
          type: int
          config:
            source: modbus
            {{- include "modbus" . | indent 10 }}
            register:
              address: 8023
              type: holding
              decode: uint16
        script: |
          expected := 4
          if batteryMode == 1 {
            expected = 1
          }
          if mode != expected {
            panic("iHomeManager did not accept energy management mode")
          }
          command := 0xCC
          if batteryMode == 3 {
            command = 0xAA
          }
          command
        out:
        - name: command
          type: int
          config: *command
  {{- end }}
  {{- include "battery-params" . }}
  {{- end }}
