template: zendure-solarflow-battery
covers: [zendure-solarflow-ac, zendure-solarflow-2400-ac]
products:
  - brand: Zendure
    description:
      generic: Solarflow AC / Pro
capabilities: ["battery-control"]
requirements:
  description:
    de: |
      Für die aktive Batteriesteuerung muss die lokale API über die Zendure App aktiviert werden (HEMS hinzufügen und wieder verlassen).
      Die Seriennummer des Geräts ist in der Zendure App in den Geräteeinstellungen zu finden.
    en: |
      For active battery control, the local API must be enabled via the Zendure App (add HEMS and then exit to apply).
      The device serial number can be found in the Zendure App in the device settings.
params:
  - name: usage
    choice: ["battery"]
  - name: host
  - name: serial
    service: http/get?uri=http://{host}/properties/report&jq=.sn
    example: WOB1NHMAMXXXXX3
    help:
      de: Nur für die aktive Batteriesteuerung. Seriennummer des Geräts (zu finden in der Zendure App)
      en: Required only for active battery control. Device serial number (can be found in the Zendure App)
  - preset: battery-capacity
  - name: minsoc
    deprecated: true
  - name: maxsoc
    deprecated: true
  - name: maxchargepower
    deprecated: true
  - name: maxdischargepower
    deprecated: true
  - name: cache
    default: 1s
render: |
  type: custom
  power:
    source: http
    uri: http://{{ .host }}/properties/report
    jq: .properties.packInputPower - .properties.outputPackPower
    cache: {{ .cache }}
  soc:
    source: http
    uri: http://{{ .host }}/properties/report
    jq: .properties.electricLevel
    cache: {{ .cache }}
  minsoc:
    source: http
    uri: http://{{ .host }}/properties/report
    jq: .properties.minSoc
    scale: 0.1
    cache: {{ .cache }}
  maxsoc:
    source: http
    uri: http://{{ .host }}/properties/report
    jq: .properties.socSet
    scale: 0.1
    cache: {{ .cache }}
  maxchargepower:
    source: http
    uri: http://{{ .host }}/properties/report
    jq: .properties.chargeMaxLimit
    cache: {{ .cache }}
  maxdischargepower:
    source: http
    uri: http://{{ .host }}/properties/report
    jq: .properties.inverseMaxPower
    cache: {{ .cache }}
  {{- if .serial }}
  batterymode:
    source: watchdog
    timeout: 60s
    reset: 1 # reset to normal
    set:
      source: switch
      switch:
      - case: 1 # normal
        set:
          source: http
          uri: http://{{ .host }}/properties/write
          method: POST
          headers:
          - content-type: application/json
          body: '{"sn":"{{ .serial }}","properties":{"smartMode":0,"acMode":2,"outputLimit":0,"inputLimit":0}}'
      - case: 2 # hold
        set:
          source: http
          uri: http://{{ .host }}/properties/write
          method: POST
          headers:
          - content-type: application/json
          body: '{"sn":"{{ .serial }}","properties":{"smartMode":1,"acMode":2,"outputLimit":0,"inputLimit":0}}'
      - case: 3 # charge
        set:
          source: http
          uri: http://{{ .host }}/properties/write
          method: POST
          headers:
          - content-type: application/json
          body: '{"sn":"{{ .serial }}","properties":{"smartMode":1,"acMode":1,"outputLimit":0,"inputLimit":{{ .maxchargepower }}}}'
  {{- end }}
  {{- include "battery-capacity" . }}
