template: sma-inverter-speedwire
covers: ["sma-inverter"]
products:
  - brand: SMA
    description:
      de: Wechselrichter (Speedwire)
      en: Inverter (Speedwire)
caveats:
  - description:
      de: evcc und das Gerät müssen sich im selben Layer-2-Netzwerk befinden.
      en: evcc and the device must be on the same layer 2 network.
    link: https://github.com/evcc-io/evcc/discussions/16986
requirements:
  evcc: ["skiptest"]
discovery:
  hostname: ["sma*"]
  mac: ["0015BB", "0040AD"]
params:
  - name: usage
    choice: ["pv", "battery"]
  - name: host
  - name: password
    help:
      en: Password for user group Standard
      de: Passwort für Benutzergruppe Benutzer
  - preset: battery-params
render: |
  type: sma
  usage: {{ .usage }}
  uri: {{ .host }} # IP address or hostname
  password: {{ .password }} # optional
  {{- if eq .usage "battery" }}
  {{- include "battery-params" . }}
  {{- end }}
