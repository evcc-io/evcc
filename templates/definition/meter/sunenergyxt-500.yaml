# Used API docs for SunEnergyXT 500 Series: https://github.com/SunEnergyXT/SunEnergyXT-500-Series/blob/main/API.en.md
template: sunenergyxt-500
products:
  # single entry: the `model` param carries the Standard/PRO distinction
  - brand: SunEnergyXT
    description:
      generic: SunEnergyXT 500 / 500 PRO
capabilities: ["battery-control"]
requirements:
  description:
    en: |
      The battery's local mode must be enabled in the manufacturer's app.
      Furthermore, the device's IP address must be set to a fixed, permanent IP address in the router.
      An external meter (e.g., Shelly) measuring the grid connection point must be connected to the battery via the manufacturer's app.
      It is required for the `grid` usage, and also for the `battery` usage, because the normal battery mode enables the device's
      zero feed-in regulation, which reads this meter.
    de: |
      Der lokale Modus der Batterie muss in der Hersteller-App aktiviert werden.
      Des Weiteren muss die IP-Adresse des Geräts im Router auf eine feste, dauerhafte IP-Adresse eingestellt werden.
      Mit der Batterie muss ein externer Zähler (z. B. Shelly) verbunden sein, der den Hausanschlusspunkt misst (dieser wird über die Hersteller-App hinzugefügt).
      Er wird für die Verwendung `grid` benötigt und ebenso für die Verwendung `battery`, da der normale Batteriemodus die
      Nulleinspeise-Regelung des Geräts aktiviert, die diesen Zähler ausliest.
caveats:
  - description:
      de: |
        Aktuell muss jeder Kopfspeicher einzeln in EVCC angelegt werden.
        Mehrere Kopfspeicher in ein System zu verbinden, ist vom Hersteller angekündigt, jedoch softwareseitig noch nicht umgesetzt.
      en: |
        Currently, each head storage must be individually added in EVCC.
        Connecting multiple head storages into one system has been announced by the manufacturer but is not yet implemented on the software side.
    # link:
  - description:
      de: |
        `maxacpower` und `maxdischargepower` werden aus dem gewählten `model` abgeleitet, wenn sie leer bleiben.
        Ein ausdrücklich gesetzter Wert hat Vorrang und wird nicht auf das Modell-Limit begrenzt.
      en: |
        `maxacpower` and `maxdischargepower` are derived from the selected `model` when left empty.
        An explicitly configured value takes precedence and is not clamped to the model limit.
  - description:
      de: |
        Sind die Solarmodule nicht am Speicher, sondern an einem separaten Wechselrichter angeschlossen (AC-gekoppelt), pausiert der Standard-Haltemodus die Nulleinspeise-Regelung und damit auch das Laden mit Überschuss.
        Mit der Option `accoupled` bleibt die Nulleinspeise-Regelung aktiv und die maximale netzgekoppelte Ausgangsleistung (`MG`) wird auf 1 W begrenzt. Dadurch wird nicht entladen, Überschuss aber weiter geladen.
        Dieses Verhalten wurde gemessen und ist vom Hersteller nicht dokumentiert. Setze `maxgridoutput` auf den normalen Wert, damit er in den Modi normal und charge wiederhergestellt wird.
      en: |
        If the solar panels are not connected to the storage but to a separate inverter (AC-coupled), the default hold mode pauses the zero feed-in regulation and with it charging from surplus.
        With the `accoupled` option the zero feed-in regulation stays active and the maximum grid-connected output power (`MG`) is limited to 1 W. This blocks discharging while surplus is still charged.
        This behavior was measured and is not documented by the vendor. Set `maxgridoutput` to your normal value so it is restored in the normal and charge modes.
params:
  - name: usage
    type: choice
    choice: ["grid", "pv", "battery"]
    required: true
  - name: model
    type: choice
    choice: ["standard", "pro"]
    required: true
    description:
      de: Modell
      en: Model
    help:
      de: |
        `standard` für die SunEnergyXT 500, `pro` für die SunEnergyXT 500 PRO.
        Bestimmt die maximale AC- und Entladeleistung (800 W bzw. 2400 W).
      en: |
        `standard` for the SunEnergyXT 500, `pro` for the SunEnergyXT 500 PRO.
        Determines the maximum AC and discharge power (800 W resp. 2400 W).
  - name: host
    required: true
  # maxacpower/maxdischargepower: leave empty to derive the limit from `model`
  - name: maxacpower
  - preset: battery-capacity
  - preset: battery-minmaxsoc
  # head unit alone; each extension pack adds another 5 kWh
  - name: capacity
    default: 5
    help:
      de: |
        Gesamtkapazität des Speichers: Kopfspeicher 5 kWh, jede Erweiterung +5 kWh.
        Also 5 (nur Kopfspeicher), 10 (+1 Erweiterung) oder 15 (+2 Erweiterungen).
        Die Anzahl der erkannten Akkupakete steht im Feld `ON` unter `/read`.
      en: |
        Total storage capacity: head unit 5 kWh, each extension pack adds 5 kWh.
        So 5 (head unit only), 10 (+1 extension) or 15 (+2 extensions).
        The number of detected battery packs is reported in the `ON` field of `/read`.
  # grid charging is limited to -2400..0 W on both models
  - name: maxchargepower
    default: 2400
  - name: maxdischargepower
  - name: accoupled
    type: bool
    advanced: true
    usages: ["battery"]
    description:
      de: AC-gekoppelter Speicher
      en: AC-coupled storage
    help:
      de: |
        Für Speicher ohne Solarmodule am Gerät (PV an separatem Wechselrichter). Halten sperrt nur das Entladen (`MM:1`, `MG` auf 1 W) und lädt weiter mit Überschuss. Gemessenes Verhalten, vom Hersteller nicht dokumentiert. Ohne diese Option pausiert Halten das Gerät.
      en: |
        For storage without solar panels on the device (PV on a separate inverter). Hold only blocks discharging (`MM:1`, `MG` set to 1 W) and keeps charging from surplus. Measured behavior, not documented by the vendor. Without this option hold pauses the device.
  - name: maxgridoutput
    type: int
    advanced: true
    usages: ["battery"]
    description:
      de: Maximale netzgekoppelte Ausgangsleistung (MG)
      en: Max grid-connected output power (MG)
    help:
      de: |
        Normalwert für `MG` in W. Wenn gesetzt, schreiben die Modi normal und charge ihn zurück, damit die Begrenzung nach dem Halten nicht bei 1 W bleibt. Bei Verwendung von `accoupled` setzen. Leer lassen, um `MG` nicht zu verändern.
      en: |
        Normal value for `MG` in W. If set, the normal and charge modes write it back so the limit does not stay at 1 W after hold. Set it when using `accoupled`. Leave empty to not touch `MG`.
    example: 800
  - name: cache
    advanced: true
    default: 2s
  - name: timeout
    advanced: true
    default: 10s
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: http
    uri: http://{{ .host }}/read
    cache: {{ .cache }}
    timeout: {{ .timeout }}
    jq: .state.reported.GP
    scale: -1
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: http
    uri: http://{{ .host }}/read
    cache: {{ .cache }}
    timeout: {{ .timeout }}
    jq: .state.reported.BP
    scale: -1
  soc:
    source: http
    uri: http://{{ .host }}/read
    cache: {{ .cache }}
    timeout: {{ .timeout }}
    jq: .state.reported.SC
  batterymode:
    source: switch
    switch:
    - case: 1 # normal
      set:
        source: http
        method: POST
        uri: http://{{ .host }}/write
        headers:
          - Content-Type: application/json
        # GS must be reset explicitly: MM (zero feed-in regulation) and GS (manual
        # setpoint) are independent, so a leftover GS would keep grid charging.
        body: '{"state":{"MM":1,"GS":0{{ if gt (.maxgridoutput | int) 0 }},"MG":{{ .maxgridoutput | int }}{{ end }}}}'
    - case: 2 # hold
      set:
        source: http
        method: POST
        uri: http://{{ .host }}/write
        headers:
          - Content-Type: application/json
        # AC-coupled: keep zero feed-in regulation (MM:1) to charge from surplus and block discharge via MG
        body: '{{ if .accoupled }}{"state":{"MM":1,"GS":0,"MG":1}}{{ else }}{"state":{"MM":0,"GS":0}}{{ end }}'
    - case: 3 # charges
      set:
        source: http
        method: POST
        uri: http://{{ .host }}/write
        headers:
          - Content-Type: application/json
        # GS < 0 means grid import / grid charging
        body: '{"state":{"MM":0,"GS":-{{ .maxchargepower | int }}{{ if gt (.maxgridoutput | int) 0 }},"MG":{{ .maxgridoutput | int }}{{ end }}}}'
  {{- include "battery-capacity" . }}
  {{- include "battery-minmaxsoc" . }}
  maxchargepower: {{ .maxchargepower | int }} # W
  maxdischargepower: {{ if gt (.maxdischargepower | int) 0 }}{{ .maxdischargepower | int }}{{ else }}{{ ternary 2400 800 (eq .model "pro") }}{{ end }} # W
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: http
    uri: http://{{ .host }}/read
    cache: {{ .cache }}
    timeout: {{ .timeout }}
    jq: .state.reported.PV
  maxacpower: {{ if gt (.maxacpower | int) 0 }}{{ .maxacpower | int }}{{ else }}{{ ternary 2400 800 (eq .model "pro") }}{{ end }} # W
  {{- end }}
