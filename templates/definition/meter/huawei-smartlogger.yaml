template: huawei-smartlogger
products:
  - brand: Huawei
    description:
      generic: SmartLogger
params:
  - name: usage
    choice: ["grid", "pv"]
  - name: modbus
    choice: ["tcpip"]
    id: 0
  - name: maxacpower
  - name: timeout
    deprecated: true
  # stored by the config ui for grid/pv meters before the battery usage was removed in #35658
  - name: storageunit
    deprecated: true
  - name: maxsoc
    deprecated: true
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    id: 0
    {{- include "modbus-connection" . | indent 2 }}
    connectdelay: 1s
    register:
      address: 32278 # Active power
      type: holding
      decode: int32
    scale: 1
  energy:
    source: modbus
    id: 0
    {{- include "modbus-connection" . | indent 2 }}
    register:
      address: 32357 # Positive active electricity
      type: holding
      decode: int64
    scale: 0.01
  returnenergy:
    source: modbus
    id: 0
    {{- include "modbus-connection" . | indent 2 }}
    register:
      address: 32349 # Negative active electricity
      type: holding
      decode: int64
    scale: 0.01
  currents:
  - source: modbus
    id: 0
    {{- include "modbus-connection" . | indent 2 }}
    register:
      address: 32272 # Huawei phase A grid current
      type: holding
      decode: int32
    scale: 0.1
  - source: modbus
    id: 0
    {{- include "modbus-connection" . | indent 2 }}
    register:
      address: 32274 # Huawei phase B grid current
      type: holding
      decode: int32
    scale: 0.1
  - source: modbus
    id: 0
    {{- include "modbus-connection" . | indent 2 }}
    register:
      address: 32276 # Huawei phase C grid current
      type: holding
      decode: int32
    scale: 0.1
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: modbus
    id: 0
    {{- include "modbus-connection" . | indent 2 }}
    register:
      address: 40521 # Input power
      type: holding
      decode: int32
  energy:
    source: modbus
    id: 0
    {{- include "modbus-connection" . | indent 2 }}
    register:
      address: 40446 # Accumulated PV energy yield
      type: holding
      decode: int64
    scale: 0.01
  maxacpower: {{ .maxacpower }}
  {{- end }}
