template: sunspec-meter
products:
  - description:
      de: SunSpec Zähler
      en: SunSpec Meter
  - brand: Fronius
    description:
      de: Smartmeter (über Wechselrichter)
      en: Smartmeter (via Inverter)
  - brand: Fronius
    description:
      generic: Smart Meter IP
params:
  - name: usage
    choice: ["grid", "pv", "charge"]
  - name: modbus
    choice: ["tcpip"]
render: |
  type: custom
  # sunspec model 201-204 (int+sf) / 211-214 (float) meter, phase values for three-phase models only
  {{- if or (eq .usage "grid") (eq .usage "charge") }}
  power:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value:
      - 201:W
      - 211:W
      - 202:W
      - 212:W
      - 203:W
      - 213:W
      - 204:W
      - 214:W
  energy:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value:
      - 201:TotWhImp
      - 211:TotWhImp
      - 202:TotWhImp
      - 212:TotWhImp
      - 203:TotWhImp
      - 213:TotWhImp
      - 204:TotWhImp
      - 214:TotWhImp
    scale: 0.001
  returnenergy:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value:
      - 201:TotWhExp
      - 211:TotWhExp
      - 202:TotWhExp
      - 212:TotWhExp
      - 203:TotWhExp
      - 213:TotWhExp
      - 204:TotWhExp
      - 214:TotWhExp
    scale: 0.001
  currents:
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:AphA
        - 213:AphA
        - 204:AphA
        - 214:AphA
      nan: true
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:AphB
        - 213:AphB
        - 204:AphB
        - 214:AphB
      nan: true
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:AphC
        - 213:AphC
        - 204:AphC
        - 214:AphC
      nan: true
  voltages:
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:PhVphA
        - 213:PhVphA
      nan: true
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:PhVphB
        - 213:PhVphB
      nan: true
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:PhVphC
        - 213:PhVphC
      nan: true
  powers:
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:WphA
        - 213:WphA
      nan: true
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:WphB
        - 213:WphB
      nan: true
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:WphC
        - 213:WphC
      nan: true
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value:
      - 201:W
      - 211:W
      - 202:W
      - 212:W
      - 203:W
      - 213:W
      - 204:W
      - 214:W
  energy:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value:
      - 201:TotWhExp
      - 211:TotWhExp
      - 202:TotWhExp
      - 212:TotWhExp
      - 203:TotWhExp
      - 213:TotWhExp
      - 204:TotWhExp
      - 214:TotWhExp
    scale: 0.001
  returnenergy:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value:
      - 201:TotWhImp
      - 211:TotWhImp
      - 202:TotWhImp
      - 212:TotWhImp
      - 203:TotWhImp
      - 213:TotWhImp
      - 204:TotWhImp
      - 214:TotWhImp
    scale: 0.001
  {{- end }}
