template: solaredge-se-mtr-3y
products:
  - brand: SolarEdge
    description:
      generic: SE-MTR-3Y
discovery:
  mdns: ["_solaredge-modbus._tcp"]
  mac: ["002702", "84D6C5", "28B77C1", "9405BBA", "480BB25", "88A9A71"]
params:
  - name: usage
    choice: ["grid", "pv", "charge"]
  - name: modbus
    choice: ["rs485"]
render: |
  type: mbmd
  {{- include "modbus" . }}
  model: semtr
  {{- if ne .usage "pv" }}
  power: Power
  energy: Import
  returnenergy: Export
  currents:
    - CurrentL1
    - CurrentL2
    - CurrentL3
  powers:
    - PowerL1
    - PowerL2
    - PowerL3
  {{- else }}
  power: -Power
  energy: Export
  returnenergy: Import
  currents:
    - -CurrentL1
    - -CurrentL2
    - -CurrentL3
  powers:
    - -PowerL1
    - -PowerL2
    - -PowerL3
  {{- end }}
  voltages:
    - VoltageL1
    - VoltageL2
    - VoltageL3
