template: sunspec-inverter-control
products:
  - description:
      de: SunSpec Batterie (Model 124)
      en: SunSpec Battery (Model 124)
capabilities: ["battery-control"]
group: generic
params:
  - name: usage
    choice: ["battery"]
  - name: modbus
    choice: ["tcpip", "rs485"]
  - name: maxchargerate
  - preset: battery-params
render: |
  {{- if eq .usage "battery" }}
  type: custom
  power:
    source: calc
    add:
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value: 160:3:DCW # mppt 3 (charge)
      scale: -1
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value: 160:4:DCW # mppt 4 (discharge)
  energy:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 160:4:DCWH # mppt 4 (discharge)
    scale: 0.001
  soc:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 124:0:ChaState
  batterymode: # model 124
    source: switch
    switch:
    - case: 1 # normal
      set:
        source: sequence
        set:
        - source: const
          value: 0
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:StorCtl_Mod
        - source: const
          value: 100 # %
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:OutWRte
    - case: 2 # hold
      set:
        source: sequence
        set:
        - source: const
          value: 2
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:StorCtl_Mod
        - source: const
          value: 0 # %
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:OutWRte
        - source: const
          value: 0 # s
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:InOutWRte_RvrtTms
    - case: 3 # charge
      set:
        source: sequence
        set:
        - source: const
          value: 1 # on
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:ChaGriSet
        - source: const
          value: 2
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:StorCtl_Mod
        - source: const
          value: -{{ .maxchargerate }} # %
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:OutWRte
        - source: const
          value: 0 # s
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:InOutWRte_RvrtTms
    - case: 4 # holdcharge
      set:
        source: sequence
        set:
        - source: const
          value: 1
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:StorCtl_Mod
        - source: const
          value: 0 # %
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:InWRte
        - source: const
          value: 0 # s
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:InOutWRte_RvrtTms
    default:
      source: error
      error: ErrNotAvailable
  {{- if .maxchargepower }}
  limitchargepower: # model 124: charge power cap in W, written as % of maxchargepower
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 124:0:OutWRte
    scale: {{ divf -100.0 .maxchargepower }}
  limitchargepowerenable: # model 124
    source: switch
    switch:
    - case: 1 # enable rate control
      set:
        source: sequence
        set:
        - source: const
          value: 2
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:StorCtl_Mod
        - source: const
          value: 0 # s, disable device-side auto-revert; evcc watchdog owns refresh
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 124:0:InOutWRte_RvrtTms
    - case: 0 # disable: restore uncontrolled self-consumption (does not touch ChaGriSet)
      set:
        source: const
        value: 0
        set:
          source: sunspec
          {{- include "modbus" . | indent 8 }}
          value: 124:0:StorCtl_Mod
  {{- end }}
  {{- include "battery-params" . }}
  {{- end }}
