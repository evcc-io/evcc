template: sunspec-inverter-control
products:
  - description:
      de: SunSpec Batterie (Model 124)
      en: SunSpec Battery (Model 124)
capabilities: ["battery-control"]
group: generic
params:
  - name: usage
    choice: ["battery"]
  - name: modbus
    choice: ["tcpip", "rs485"]
  - name: maxchargerate
  - preset: battery-params
  - name: watchdog
    type: int
    default: 60 # s
    required: true
    service: sunspec/read?value=124:0:InOutWRte_RvrtTms&{modbus}
render: |
  {{- if eq .usage "battery" }}
  type: custom
  power:
    source: calc
    add:
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value: 160:3:DCW # mppt 3 (charge)
      scale: -1
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value: 160:4:DCW # mppt 4 (discharge)
  energy:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 160:4:DCWH # mppt 4 (discharge)
    scale: 0.001
  soc:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 124:0:ChaState
  batterymode: # model 124
    source: watchdog
    timeout: {{ .watchdog }}s
    reset: 1 # reset watchdog on normal
    set:
      source: switch
      switch:
      - case: 1 # normal
        set:
          source: sequence
          set:
          - source: const
            value: 0
            set:
              source: sunspec
              {{- include "modbus" . | indent 12 }}
              value: 124:0:StorCtl_Mod
          - source: const
            value: 100 # %
            set:
              source: sunspec
              {{- include "modbus" . | indent 12 }}
              value: 124:0:OutWRte
      - case: 2 # hold
        set:
          source: sequence
          set:
          # device reverts to normal unless refreshed by the watchdog
          - source: const
            value: {{ .watchdog }} # s
            set:
              source: sunspec
              {{- include "modbus" . | indent 12 }}
              value: 124:0:InOutWRte_RvrtTms
          - source: const
            value: 2
            set:
              source: sunspec
              {{- include "modbus" . | indent 12 }}
              value: 124:0:StorCtl_Mod
          - source: const
            value: 0 # %
            set:
              source: sunspec
              {{- include "modbus" . | indent 12 }}
              value: 124:0:OutWRte
      - case: 3 # charge
        set:
          source: sequence
          set:
          - source: const
            value: 1 # on
            set:
              source: sunspec
              {{- include "modbus" . | indent 12 }}
              value: 124:0:ChaGriSet
          - source: const
            value: {{ .watchdog }} # s
            set:
              source: sunspec
              {{- include "modbus" . | indent 12 }}
              value: 124:0:InOutWRte_RvrtTms
          - source: const
            value: 2
            set:
              source: sunspec
              {{- include "modbus" . | indent 12 }}
              value: 124:0:StorCtl_Mod
          - source: const
            value: -{{ .maxchargerate }} # %
            set:
              source: sunspec
              {{- include "modbus" . | indent 12 }}
              value: 124:0:OutWRte
      - case: 4 # holdcharge
        set:
          source: sequence
          set:
          - source: const
            value: {{ .watchdog }} # s
            set:
              source: sunspec
              {{- include "modbus" . | indent 12 }}
              value: 124:0:InOutWRte_RvrtTms
          - source: const
            value: 1
            set:
              source: sunspec
              {{- include "modbus" . | indent 12 }}
              value: 124:0:StorCtl_Mod
          - source: const
            value: 0 # %
            set:
              source: sunspec
              {{- include "modbus" . | indent 12 }}
              value: 124:0:InWRte
      default:
        source: error
        error: ErrNotAvailable
  {{- include "battery-params" . }}
  {{- end }}
