template: sunspec-hybrid-curtailable
products:
  - description:
      de: SunSpec Hybridwechselrichter (abregelbar)
      en: SunSpec Hybrid Inverter (curtailable)
group: generic
params:
  - name: usage
    choice: ["pv"]
  - name: modbus
    choice: ["tcpip", "rs485"]
  - name: maxacpower
    deprecated: true # read from nameplate
render: |
  type: custom
  # sunspec model 203 (int+sf)/ 213 (float) meter
  power:
    source: calc
    add:
      - source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 160:1:DCW # mppt 1
        nan: true
      - source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 160:2:DCW # mppt 2
        nan: true
  energy:
    source: calc
    add:
      - source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 160:1:DCWH # mppt 1
        scale: 0.001
      - source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 160:2:DCWH # mppt 2
        scale: 0.001
  {{- include "sunspec-maxacpower" . }}
