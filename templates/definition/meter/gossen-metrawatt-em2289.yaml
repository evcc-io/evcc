template: gossen-metrawatt-em2289

products:
  - brand: Gossen Metrawatt
    description:
      generic: ENERGYMID EM2289

params:
  - name: usage
    choice: ["grid", "pv", "charge"]
  - name: modbus
    choice: ["tcpip"]
    id: 1
    port: 502

render: |
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 203
      type: input
      decode: int16
    {{- if eq .usage "pv" }}
    scale: -10.0
    {{- else }}
    scale: 10.0
    {{- end }}
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 300
      type: input
      decode: uint32s
    scale: 0.001
