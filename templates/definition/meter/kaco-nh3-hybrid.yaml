template: kaco-nh3-hybrid
products:
  - brand: KACO
    description:
      generic: KACO Blueplanet Hybrid NH3
group: generic
capabilities: ["battery-control", "curtail"]
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["rs485"]
  - name: modbusdeviceid
    default: 3
    description:
      de: Geräte-ID (Slave ID)
      en: Device ID (Slave ID)
  - name: baudrate
    default: 9600
    type: choice
    choice: [9600, 19200, 38400]
    description:
      de: Baudrate der RS485-Verbindung
      en: Baud rate of RS485 connection
  - name: battery
    type: choice
    choice: ["1", "2"]
    required: true
    usages: ["battery"]
    description:
      de: Batteriespeichernummer
      en: Battery number
requirements:
  description:
    de: |
      Modbus-RTU (RS485) Verbindung mit konfigurierbarer Baudrate (9600, 19200, 38400 Baud),
      8 Datenbits, 1 Stoppbit, keine Parität.
      Der KACO NH3 muss sich im Grid-Feeding Modus befinden und Sunspec Model 704 (Generic Inverter Controls) unterstützen.
      Für Batteriesteuerung: Zwei Batteriepakete (BMS1 + BMS2) jeweils mit einem Batteriezähler mit Batteriespeichernummer 1 und 2 anlegen.
      Batteriekapazität: 30.72 kWh | Max. Lade-/Entladestrom: 30 A
      Lade-/Entladeleistung wird dynamisch aus der Batteriespannung berechnet (P = U × 30A).
    en: |
      Modbus-RTU (RS485) connection with configurable baud rate (9600, 19200, 38400 baud),
      8 data bits, 1 stop bit, no parity.
      KACO NH3 must be in Grid-Feeding mode and support SunSpec Model 704 (Generic Inverter Controls).
      For battery control: add one battery meter each for two battery packs (BMS1 + BMS2), using battery number 1 and 2.
      Battery capacity: 30.72 kWh | Max. charge/discharge current: 30 A
      Charge/discharge power is calculated dynamically from battery voltage (P = U × 30A).
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 203:W
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 701:W
  energy:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 701:TotWhInj
    scale: 0.001
  curtail:
    source: sequence
    set:
      - source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 704:WMaxLimPct
      - source: switch
        switch:
          - case: 100
            set:
              source: const
              value: 0
              set:
                source: sunspec
                {{- include "modbus" . | indent 14 }}
                value: 704:WMaxLimPctEna
        default:
          source: const
          value: 1
          set:
            source: sunspec
            {{- include "modbus" . | indent 12 }}
            value: 704:WMaxLimPctEna
  curtailed:
    source: go
    in:
    - name: ena
      type: bool
      config:
        source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 704:WMaxLimPctEna
    - name: limit
      type: float
      config:
        source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 704:WMaxLimPct
    script: |
      percent := 100
      if ena {
        percent = int(limit)
      }
      percent
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: {{ if eq .battery "2" }}714:Prt.2.DCW{{ else }}714:Prt.1.DCW{{ end }}
  soc:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 802:SoC
  capacity:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 802:WHRtg
  minsoc:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 802:SoCMin
  maxsoc:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 802:SoCMax
  maxchargepower:
    source: go
    in:
    - name: voltage
      type: float
      config:
        source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 802:V
    script: |
      int(voltage * 30)
  maxdischargepower:
    source: go
    in:
    - name: voltage
      type: float
      config:
        source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 802:V
    script: |
      int(voltage * 30)
  batterymode:
    source: switch
    switch:
      - case: 1
        set:
          source: const
          value: 1
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 802:ChaSt
      - case: 2
        set:
          source: const
          value: 6
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 802:ChaSt
      - case: 3
        set:
          source: const
          value: 3
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value: 802:ChaSt
    default:
      source: error
      error: ErrNotAvailable
  {{- end }}
