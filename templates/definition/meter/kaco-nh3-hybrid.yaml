template: kaco-nh3-hybrid
products:
  - brand: KACO
    description:
      generic: Blueplanet Hybrid NH3
requirements:
  description:
    de: |
      Modbus-RTU (RS485) Verbindung. Geräte mit eigenem Modbus-TCP-Ethernet-Port können alternativ das `solplanet-modbus` Template nutzen.
      Der Wechselrichter muss sich im Grid-Feeding Modus befinden.
      Bei zwei Batteriepaketen (BMS1 + BMS2) je einen Batteriezähler mit Batteriespeichernummer 1 und 2 anlegen.
    en: |
      Modbus RTU (RS485) connection. Devices with a dedicated Modbus TCP ethernet port can alternatively use the `solplanet-modbus` template.
      The inverter must be in grid-feeding mode.
      With two battery packs (BMS1 + BMS2) add one battery meter each, using battery number 1 and 2.
capabilities: ["battery-control", "curtail"]
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["rs485"]
    id: 3
  - name: maxacpower
    deprecated: true # read from nameplate
  - name: battery
    type: choice
    choice: [1, 2]
    required: true
    usages: ["battery"]
    description:
      de: Batteriespeichernummer
      en: Battery number
  - preset: battery-params
render: |
  type: custom
  {{- if eq .usage "grid" }}
  # sunspec model 20x (int+sf)/ 21x (float) meter
  power:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 203:W
  energy:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 203:TotWhImp
    scale: 0.001
  returnenergy:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value:
      - 201:TotWhExp
      - 211:TotWhExp
      - 203:TotWhExp
      - 213:TotWhExp
    scale: 0.001
  currents:
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 201:AphA
        - 211:AphA
        - 203:AphA
        - 213:AphA
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 201:AphB
        - 211:AphB
        - 203:AphB
        - 213:AphB
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 201:AphC
        - 211:AphC
        - 203:AphC
        - 213:AphC
  voltages:
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 201:PhVphA
        - 211:PhVphA
        - 203:PhVphA
        - 213:PhVphA
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 201:PhVphB
        - 211:PhVphB
        - 203:PhVphB
        - 213:PhVphB
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 201:PhVphC
        - 211:PhVphC
        - 203:PhVphC
        - 213:PhVphC
  powers:
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 201:WphA
        - 211:WphA
        - 203:WphA
        - 213:WphA
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 201:WphB
        - 211:WphB
        - 203:WphB
        - 213:WphB
    - source: sunspec
      {{- include "modbus" . | indent 4 }}
      value:
        - 201:WphC
        - 211:WphC
        - 203:WphC
        - 213:WphC
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: calc
    add:
      - source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 160:1:DCW # mppt 1
      - source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 160:2:DCW # mppt 2
      - source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 160:3:DCW # mppt 3
  energy:
    source: calc
    add:
      - source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 160:1:DCWH # mppt 1
        scale: 0.001
      - source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 160:2:DCWH # mppt 2
        scale: 0.001
      - source: sunspec
        {{- include "modbus" . | indent 6 }}
        value: 160:3:DCWH # mppt 3
        scale: 0.001
  curtail:
    source: sequence
    set:
      - source: sunspec
        {{- include "modbus" . | indent 6 }}
        value:
          - 704:WMaxLimPct
          - 123:WMaxLimPct
      - source: switch
        switch:
          - case: 100 # Uncurtailed
            set:
              source: const
              value: 0 # Limit disabled
              set:
                source: sunspec
                {{- include "modbus" . | indent 14 }}
                value:
                  - 704:WMaxLimPctEna
                  - 123:WMaxLim_Ena
        default:
          source: const
          value: 1 # Limit enabled
          set:
            source: sunspec
            {{- include "modbus" . | indent 10 }}
            value:
              - 704:WMaxLimPctEna
              - 123:WMaxLim_Ena
  curtailed: # the limit percentage only applies while the limit is enabled
    source: go
    in:
    - name: ena
      type: bool
      config:
        source: sunspec
        {{- include "modbus" . | indent 6 }}
        value:
          - 704:WMaxLimPctEna
          - 123:WMaxLim_Ena
    - name: limit
      type: float
      config:
        source: sunspec
        {{- include "modbus" . | indent 6 }}
        value:
          - 704:WMaxLimPct
          - 123:WMaxLimPct
    script: |
      percent := 100
      if ena {
        percent = int(limit)
      }
      percent
  {{- include "sunspec-maxacpower" . }}
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 714:{{ if eq .battery "2" }}2{{ else }}1{{ end }}:DCW # BMS2/1 battery power
  soc:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 802:SoC
  limitsoc: # model 802
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value: 802:SoCRsvMin
  {{- include "battery-params" . }}
  {{- end }}
