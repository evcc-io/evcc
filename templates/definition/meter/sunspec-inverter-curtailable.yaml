template: sunspec-inverter-curtailable
products:
  - description:
      de: SunSpec Wechselrichter (abregelbar)
      en: SunSpec Inverter (curtailable)
group: generic
params:
  - name: usage
    choice: ["pv"]
  - name: modbus
    choice: ["tcpip", "rs485"]
render: |
  type: custom
  power:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value:
      - 101:W
      - 111:W
      - 102:W
      - 112:W
      - 103:W
      - 113:W
  energy:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value:
      - 101:WH
      - 111:WH
      - 102:WH
      - 112:WH
      - 103:WH
      - 113:WH
    scale: 0.001
  {{- include "sunspec-maxacpower" . }}
