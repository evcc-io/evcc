template: keba-kecontact
# clone of kostal-ksem with different slave id
products:
  - brand: KEBA
    description:
      generic: KeContact E10
discovery:
  mac: ["0060B5", "00141D"]
params:
  - name: usage
    choice: ["grid"]
  - name: modbus
    choice: ["tcpip"]
    id: 1
render: |
  type: custom
  # sunspec model 203 (int+sf)/ 213 (float) meter
  power:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value:
      - 203:W
      - 213:W
  energy:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value:
      - 203:TotWhImp
      - 213:TotWhImp
    scale: 0.001
  returnenergy:
    source: sunspec
    {{- include "modbus" . | indent 2 }}
    value:
      - 203:TotWhExp
      - 213:TotWhExp
    scale: 0.001
  currents:
    - source: sunspec
      nan: true
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:AphA
        - 213:AphA
    - source: sunspec
      nan: true
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:AphB
        - 213:AphB
    - source: sunspec
      nan: true
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:AphC
        - 213:AphC
  voltages:
    - source: sunspec
      nan: true
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:PhVphA
        - 213:PhVphA
    - source: sunspec
      nan: true
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:PhVphB
        - 213:PhVphB
    - source: sunspec
      nan: true
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:PhVphC
        - 213:PhVphC
  powers:
    - source: sunspec
      nan: true
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:WphA
        - 213:WphA
    - source: sunspec
      nan: true
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:WphB
        - 213:WphB
    - source: sunspec
      nan: true
      {{- include "modbus" . | indent 4 }}
      value:
        - 203:WphC
        - 213:WphC
