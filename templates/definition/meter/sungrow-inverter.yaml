template: sungrow-inverter
products:
  - brand: Sungrow
    description:
      generic: SG Series Inverter
caveats:
  - description:
      de: Der Wechselrichter meldet den PV-Ertrag nur in 1-kWh-Schritten. Statistische Daten werden dadurch grob dargestellt.
      en: The inverter reports PV yield only in 1 kWh steps. This results in coarse statistical data.
    link: https://github.com/evcc-io/evcc/issues/32711
params:
  - name: usage
    choice: ["grid", "pv"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    baudrate: 9600
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      type: input
      address: 5082 # Meter power
      decode: int32s
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 5098 # Total import energy, 0.1 kWh
      type: input
      decode: uint32s
    scale: 0.1
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 5030 # Total Active Power
      type: input
      decode: uint32s
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 5003 # Total power yields, 1 kWh
      type: input
      decode: uint32s
  {{- end }}
