template: homewizard-kwh
products:
  - brand: HomeWizard
    description:
      generic: kWh Meter
discovery:
  mdns: ["_hwenergy._tcp", "_homewizard._tcp"]
  mac: ["5C2FAF", "3C39E72"]
params:
  - name: usage
    choice: ["pv", "charge"]
  - name: host
render: |
  type: homewizard
  uri: http://{{ .host }}
  usage: {{ .usage }}
