template: powerfox-poweropti
products:
  - brand: Powerfox
    description:
      generic: Poweropti
params:
  - name: usage
    choice: ["grid", "pv"]
  - name: user
    required: true
  - name: password
    required: true
  - name: id
    default: main
    required: true
    advanced: true
    help:
      en: Id in case of multiple PowerOpti
      de: Id im Falle mehrerer PowerOpti
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: http
    uri: https://backend.powerfox.energy/api/2.0/my/{{ .id }}/current
    auth:
      type: basic
      user: {{ .user }}
      password: {{ .password }}
    jq: .Watt
    cache: 5s
  energy:
    source: http
    uri: https://backend.powerfox.energy/api/2.0/my/{{ .id }}/current
    auth:
      type: basic
      user: {{ .user }}
      password: {{ .password }}
    jq: .A_Plus
    scale: 0.001
    cache: 5s
  returnenergy:
    source: http
    uri: https://backend.powerfox.energy/api/2.0/my/{{ .id }}/current
    auth:
      type: basic
      user: {{ .user }}
      password: {{ .password }}
    jq: .A_Minus
    scale: 0.001
    cache: 5s
  {{- end }}  
  {{- if eq .usage "pv" }}
  power:
    source: http
    uri: https://backend.powerfox.energy/api/2.0/my/{{ .id }}/current
    auth:
      type: basic
      user: {{ .user }}
      password: {{ .password }}
    jq: .Watt
    scale: -1
  {{- end }}
