template: marstek-venus-e
covers: ["marstek-venus", "marstek-venus-e-v3"]
products:
  - brand: Marstek
    description:
      generic: Venus E
  - brand: Marstek
    description:
      generic: Venus E Gen 2.0
  - brand: Marstek
    description:
      generic: Venus E Gen 3.0
  - brand: Marstek
    description:
      generic: Venus C
capabilities: ["battery-control"]
params:
  - name: usage
    choice: ["battery"]
  - name: modbus
    choice: ["rs485", "tcpip"]
    baudrate: 115200
    comset: 8N1
  - name: generation
    type: choice
    choice: ["2", "3"]
    required: true
    description:
      de: Generation
      en: Generation
    help:
      de: Venus E, Venus E Gen 2.0 und Venus C sind Generation 2. Generation 3 verwendet andere Register.
      en: Venus E, Venus E Gen 2.0 and Venus C are generation 2. Generation 3 uses different registers.
  - preset: battery-params
  - name: capacity
    default: 5.12
  - name: minsoc
    default: 11
  - name: maxsoc
    default: 100
  - name: maxchargepower
    default: 2500
  - name: maxdischargepower
    default: 800
  - name: work_mode_normal
    default: 1
    advanced: true
    description:
      en: Work mode for Normal state
      de: Work mode für Normal-Modus
    help:
      en: 0=manual, 1=anti-feed, 2=trade mode.
      de: 0=manuell, 1=Eigenverbrauch, 2=AI-Optimierung.
render: |
  type: custom
  power:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    {{- if eq .generation "3" }}
    register:
      address: 30006 # AC Power (W)
      type: holding
      decode: int16
    {{- else }}
    register:
      address: 32202 # AC Power (W)
      type: holding
      decode: int32
    {{- end }}
    scale: 1
  energy:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 33002 # Total energy discharged from battery (kWh)
      type: holding
      decode: uint32
    scale: 0.01
  soc:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    {{- if eq .generation "3" }}
    register:
      address: 34002 # Battery SOC (%)
      type: holding
      decode: uint16
    scale: 0.1
    {{- else }}
    register:
      address: 32104 # Battery SOC (%)
      type: holding
      decode: uint16
    scale: 1
    {{- end }}
  {{- include "marstek-batterymode" . }}
  {{- include "battery-params" . }}
