template: sma-home-manager
products:
  - brand: SMA
    description:
      generic: Sunny Home Manager 2.0
caveats:
  - description:
      de: evcc und das Gerät müssen sich im selben Layer-2-Netzwerk befinden.
      en: evcc and the device must be on the same layer 2 network.
    link: https://github.com/evcc-io/evcc/discussions/16986
requirements:
  evcc: ["skiptest"]
discovery:
  hostname: ["sma*"]
  mac: ["0015BB", "0040AD"]
params:
  - name: usage
    choice: ["grid"]
  - name: host
  - name: interface
render: |
  type: sma
  uri: {{ .host }}
  {{- if .interface }}
  interface: {{ .interface }}
  {{- end }}
