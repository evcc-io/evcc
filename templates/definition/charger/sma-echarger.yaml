template: sma-echarger
products:
  - brand: SMA
    description:
      generic: eCharger (Modbus)
capabilities: ["mA", "1p3p", "meter", "dim"]
requirements:
  evcc: ["sponsorship"]
  description:
    de: Firmware 2.7 oder neuer. Der Modbus TCP Server muss aktiviert sein. Der Charger darf nicht gleichzeitig vom Sunny Home Manager gesteuert werden. Die Zugriffsverwaltung muss auf "Entsperrt" stehen, der Lademodus auf Schnellladen und "Trennung nach Vollladung" auf "Nein".
    en: Firmware 2.7 or newer. The Modbus TCP server must be enabled. The charger must not be controlled by the Sunny Home Manager at the same time. Access management must be set to "Unlocked" the charging mode to fast charging and "Disconnect after full charge" to "No".
discovery:
  hostname: ["sma*"]
  mac: ["0015BB", "0040AD"]
params:
  - name: modbus
    choice: ["tcpip"]
    port: 502
    id: 3
render: |
  type: sma-echarger
  {{- include "modbus" . }}
