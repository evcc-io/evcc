template: stiebel-lwa
products:
  - brand: Stiebel Eltron
    description:
      generic: LWA/LWZ (SG Ready)
  - brand: Tecalor
    description:
      generic: THZ (SG Ready)
group: heating
capabilities: ["dim"]
# requirements:
#   evcc: ["sponsorship"]
discovery:
  hostname: ["servicewelt*"]
  mac: ["78E9962", "70B3D5C45"]
params:
  - name: modbus
    choice: ["tcpip"]
  - name: tempsource
    type: choice
    choice: ["warmwater"]
render: |
  {{- include "stiebel-sgready" . }}
  {{- if .tempsource }}
  temp:
    source: modbus
    {{- include "modbus" . | indent 2 }}
    register:
      address: 15
      type: input
      encoding: int16
    scale: 0.1
  {{- end }}
  {{ include "heatpumpswitch" . }}
