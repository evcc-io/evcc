template: shelly-topac
products:
  - brand: Shelly
    description:
      generic: Top AC Portable EV Charger
capabilities: ["mA", "meter", "dim"]
requirements:
  description:
    de: "'auto_charge' muss auf false gesetzt werden."
    en: "'auto_charge' must be set to false."
  evcc: ["sponsorship"]
discovery:
  mdns: ["_shelly._tcp", "_http._tcp:shelly*"]
  hostname: ["shelly*"]
  mac: ["8400EC"]
params:
  - name: host
  - name: user
  - name: password
render: |
  type: shelly-topac
  uri: http://{{ .host }}
  user: {{ .user }}
  password: {{ .password }}
