template: homewizard
products:
  - brand: HomeWizard
capabilities: ["meter"]
group: switchsockets
discovery:
  mdns: ["_hwenergy._tcp", "_homewizard._tcp"]
  mac: ["5C2FAF"]
params:
  - name: host
  - preset: switchsocket
render: |
  type: homewizard
  uri: http://{{ .host }}
  {{ include "switchsocket" . }}
