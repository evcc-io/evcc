template: daheimladen-pro
products:
  - { brand: DaheimLaden, description: { generic: Smart/Touch Pro } }
  - { brand: DaheimLaden, description: { generic: Business (Pro) } }
requirements:
  description:
    de: Firmware-Anforderungen= Smart/Touch Pro ab "3.11STP", Business (Pro) ab "4.03PTB". Während der Phasen-Umschaltung pausiert die Ladung für zwei Minuten. Ab Firmware Smart/Touch Pro "4.08STP"  bzw. Business (Pro) "4.07PTB" kann die Dauer der Umschaltpause per Modbus geändert werden (siehe Modbus Dokumentation von DaheimLaden). Informationen zur Ladefreigabe (AutoStart, App, RFID, Button), bitte der Wallbox Dokumentation von DaheimLaden entnehmen.
    en: Firmware requirements= Smart/Touch Pro from version "3.11STP", Business (Pro) from version "4.03PTB". Charging pauses for two minutes during phase switching. From firmware Smart/Touch Pro version "4.08STP" and Business (Pro) version "4.07PTB", the duration of the switching pause can be changed via Modbus (see DaheimLaden's Modbus documentation). For information on enabling charging (AutoStart, app, RFID, button), please refer to the DaheimLaden wallbox documentation.
capabilities: ["mA", "rfid", "1p3p", "meter", "dim"]
params:
  - name: host
  - name: port
    default: 502
render: |
  type: daheimladen
  uri: {{ joinHostPort .host .port }}
  phases1p3p: true
