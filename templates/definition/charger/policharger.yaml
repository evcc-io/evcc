template: policharger
products:
  - brand: Policharger
    description:
      generic: IN, NW, ÖN, OUT, PRO (8.1 series)
  - brand: Ksix
    description:
      generic: EVHOME+SC by Policharger
requirements:
  description:
    de: |
      Modbus RTU (Standard 9600 8N1, Slave-ID 1). Im Menü der Wallbox einstellen: Modbus aktiv, "Es Maestro" NEIN, Zähler NEIN, "Sensor general" NEIN, keine programmierten Ladungen, Talzeitkonfiguration NEIN.
      evcc schaltet die Wallbox in den Modus "normalerweise gesperrt" (Register 30) und gibt das Laden über Register 88 frei. Ohne evcc lädt die Wallbox daher nicht.
      Die Wallbox startet eine Ladung erst ab 16 A und etwa 3,5 Minuten nach dem Vorbereiten; evcc hält sie dafür im Ruhezustand vorbereitet. Getestet mit NW-T2 einphasig, Software 9.30.
    en: |
      Modbus RTU (default 9600 8N1, slave ID 1). In the charger menu set: Modbus enabled, "Es Maestro" NO, meter NO, "Sensor general" NO, no scheduled charging, off-peak configuration NO.
      evcc switches the charger to "normally locked" mode (register 30) and releases charging through register 88, so the charger does not charge without evcc.
      The charger only starts a session at 16 A or more and about 3.5 minutes after being armed; evcc keeps it armed while idle. Tested with a single-phase NW-T2, software 9.30.
params:
  - name: modbus
    choice: ["rs485", "tcpip"]
    baudrate: 9600
    comset: 8N1
    id: 1
render: |
  type: policharger
  {{- include "modbus" . }}
