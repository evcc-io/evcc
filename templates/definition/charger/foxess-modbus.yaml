template: foxess-modbus
products:
  - brand: FoxESS
    description:
      generic: AC EV Charger (Modbus)
capabilities: ["mA", "rfid", "meter", "1p3p"]
requirements:
  description:
    de: In der Fox Switch App muss der Arbeitsmodus auf "Modbus TCP" gestellt werden. evcc regelt ausschließlich die Ladeleistung, startet und beendet aber keine Ladevorgänge. Wie ein Ladevorgang beginnt, bestimmt der in der Wallbox eingestellte Betriebsmodus - entweder per App bzw. RFID-Karte oder automatisch beim Anstecken starten.
    en: The work mode must be set to "Modbus TCP" in the Fox Switch app. evcc only controls the charging power, it does not start or stop charging sessions. How a session starts depends on the charger's own operating mode - start either via app or RFID card, or automatically on plug-in.
  evcc: ["sponsorship"]
params:
  - name: modbus
    choice: ["tcpip"]
    id: 1
  - name: pbox
    type: bool
    advanced: true
    description:
      de: Phasenumschaltbox (PBOX) angeschlossen
      en: Phase switching box (PBOX) connected
    help:
      de: Aktivieren, wenn eine externe Phasenumschaltbox angeschlossen ist. Nur dann kann evcc zwischen ein- und dreiphasigem Laden umschalten.
      en: Enable when an external phase switching box is connected. Only then can evcc switch between single- and three-phase charging.
render: |
  type: foxess-modbus
  {{- include "modbus" . }}
  {{- if eq .pbox "true" }}
  pbox: true
  {{- end }}
