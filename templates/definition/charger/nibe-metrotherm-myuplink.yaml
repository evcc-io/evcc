template: nibe-metrotherm-myuplink
products:
  - brand: NIBE
    description:
      generic: Metrotherm (SG Ready via myUplink)
group: heating
capabilities: ["dim", "meter"]
requirements:
  evcc: ["skiptest"]
  description:
    de: |
      Integration via NIBE myUplink API für SG Ready Steuerung.
      API-Anmeldedaten auf https://dev.myuplink.com/ erstellen.
    en: |
      Integration via NIBE myUplink API for SG Ready control.
      Create API credentials on https://dev.myuplink.com/
params:
  - name: deviceid
    required: true
    description:
      en: NIBE device ID
      de: NIBE Geräte-ID
    help:
      en: Found in myUplink app or via https://api.myuplink.com/v2/devices
      de: Finden Sie in der myUplink-App oder über https://api.myuplink.com/v2/devices
  - name: clientid
    required: true
  - name: clientsecret
    required: true
    mask: true
    description:
      en: OAuth2 Client Secret
      de: OAuth2 Client-Geheimnis
  - name: useshelly
    type: bool
    default: false
    description:
      en: Shelly EM power metering
      de: Shelly EM Leistungsmessung
    help:
      en: Enable optional power metering via Shelly EM
      de: Optionale Leistungsmessung via Shelly EM
  - name: shellyhost
    description:
      en: Shelly EM host or IP
      de: Shelly EM Host oder IP
    help:
      en: Required when Shelly EM metering is enabled
      de: Erforderlich wenn Shelly EM aktiviert ist

render: |
  type: sgready
  setmode:
    source: switch
    switch:
    - case: 1 # dim
      set:
        source: http
        uri: https://api.myuplink.com/v2/devices/{{ .deviceid }}/points
        method: PATCH
        auth:
          type: oauth2
          clientid: {{ .clientid }}
          clientsecret: {{ .clientsecret }}
          tokenurl: https://api.myuplink.com/oauth/token
        body: '{"settings":[{"parameterId":"40067","value":3}]}'
        timeout: 10s
    - case: 2 # normal
      set:
        source: http
        uri: https://api.myuplink.com/v2/devices/{{ .deviceid }}/points
        method: PATCH
        auth:
          type: oauth2
          clientid: {{ .clientid }}
          clientsecret: {{ .clientsecret }}
          tokenurl: https://api.myuplink.com/oauth/token
        body: '{"settings":[{"parameterId":"40067","value":1}]}'
        timeout: 10s
    - case: 3 # boost
      set:
        source: http
        uri: https://api.myuplink.com/v2/devices/{{ .deviceid }}/points
        method: PATCH
        auth:
          type: oauth2
          clientid: {{ .clientid }}
          clientsecret: {{ .clientsecret }}
          tokenurl: https://api.myuplink.com/oauth/token
        body: '{"settings":[{"parameterId":"40067","value":2}]}'
        timeout: 10s
  getmode:
    source: map
    values:
      1: 2 # normal
      2: 3 # boost
      3: 1 # dim
    get:
      source: http
      uri: https://api.myuplink.com/v2/devices/{{ .deviceid }}/points?parameterIds=40067
      auth:
        type: oauth2
        clientid: {{ .clientid }}
        clientsecret: {{ .clientsecret }}
        tokenurl: https://api.myuplink.com/oauth/token
      jq: .data[0].value | tonumber
      timeout: 10s
  energy:
    source: http
    uri: https://api.myuplink.com/v2/devices/{{ .deviceid }}/points?parameterIds=40013
    auth:
      type: oauth2
      clientid: {{ .clientid }}
      clientsecret: {{ .clientsecret }}
      tokenurl: https://api.myuplink.com/oauth/token
    jq: .data[0].value | tonumber
    timeout: 10s
  temp:
    source: http
    uri: https://api.myuplink.com/v2/devices/{{ .deviceid }}/points?parameterIds=40004
    auth:
      type: oauth2
      clientid: {{ .clientid }}
      clientsecret: {{ .clientsecret }}
      tokenurl: https://api.myuplink.com/oauth/token
    jq: .data[0].value | tonumber
    timeout: 10s
  {{- if .useshelly }}
  power:
    source: http
    uri: http://{{ .shellyhost }}/rpc/EM.GetStatus?id=0
    jq: .act_power | floor
    timeout: 5s
  {{- end }}
