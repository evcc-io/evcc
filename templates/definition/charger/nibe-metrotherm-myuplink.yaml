template: nibe-metrotherm-myuplink
products:
  - brand: NIBE
    description:
      generic: Metrotherm (SG Ready via myUplink)
group: heating
capabilities: ["dim", "meter"]
requirements:
  description:
    de: |
      Direkte Integration via NIBE myUplink API für SG Ready Steuerung.
      Shelly EM mini Gen 4 für externe Energiemessung erforderlich.
      API-Anmeldedaten auf https://dev.myuplink.com/ erstellen.
    en: |
      Direct integration via NIBE myUplink API for SG Ready control.
      Shelly EM mini Gen 4 for power metering is required.
      Create API credentials on https://dev.myuplink.com/
params:
  - name: deviceid
    required: true
    description:
      en: NIBE device ID (from myUplink)
      de: NIBE Geräte-ID (aus myUplink)
    help:
      en: Can be found in myUplink app or via https://api.myuplink.com/v2/devices
      de: Finden Sie in der myUplink-App oder über https://api.myuplink.com/v2/devices
  - name: clientid
    required: true
    description:
      en: OAuth2 Client ID
      de: OAuth2 Client-ID
  - name: clientsecret
    required: true
    mask: true
    description:
      en: OAuth2 Client Secret
      de: OAuth2 Client-Geheimnis
  - name: shellyhost
    required: true
    description:
      en: Shelly EM Mini host or IP
      de: Shelly EM Mini Host oder IP-Adresse

render: |
  type: sgready
  
  # Set SG Ready mode via myUplink API
  setmode:
    source: http
    uri: https://api.myuplink.com/v2/devices/{{ .deviceid }}/points
    method: PATCH
    auth:
      type: oauth2
      clientid: {{ .clientid }}
      clientsecret: {{ .clientsecret }}
      tokenurl: https://api.myuplink.com/oauth/token
    body: |
      {
        "settings": [
          {
            "parameterId": "40067",
            "value": {{ if eq .setmode 1 }}3{{ else if eq .setmode 2 }}1{{ else if eq .setmode 3 }}2{{ end }}
          }
        ]
      }
    timeout: 10s
  
  # Read current SG Ready mode
  getmode:
    source: http
    uri: https://api.myuplink.com/v2/devices/{{ .deviceid }}/points?parameterIds=40067
    auth:
      type: oauth2
      clientid: {{ .clientid }}
      clientsecret: {{ .clientsecret }}
      tokenurl: https://api.myuplink.com/oauth/token
    jq: |
      if .data[0].value == 2 then 3
      elif .data[0].value == 3 then 1
      else 2
      end
    timeout: 10s
  
  # Power consumption from Shelly EM Mini (instantaneous)
  power:
    source: http
    uri: http://{{ .shellyhost }}/rpc/Switch.GetStatus?id=0
    jq: .apower | floor
    timeout: 5s
  
  # Energy meter from Shelly EM Mini (cumulative kWh)
  energy:
    source: http
    uri: http://{{ .shellyhost }}/rpc/Switch.GetStatus?id=0
    jq: .aenergy.total / 1000
    timeout: 5s
  
  # Temperature from myUplink
  temp:
    source: http
    uri: https://api.myuplink.com/v2/devices/{{ .deviceid }}/points?parameterIds=40004
    auth:
      type: oauth2
      clientid: {{ .clientid }}
      clientsecret: {{ .clientsecret }}
      tokenurl: https://api.myuplink.com/oauth/token
    jq: .data[0].value | tonumber
    timeout: 10s
