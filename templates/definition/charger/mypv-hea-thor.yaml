template: mypv-hea-thor
products:
  - brand: my-PV
    description:
      generic: HEA•THOR
capabilities: ["meter"]
group: heating
requirements:
  evcc: ["sponsorship"]
params:
  - name: modbus
    choice: ["tcpip"]
  - name: tempsource
    choice: ["1", "2", "3"]
    default: "1"
  # - name: scale
  #   type: float
  #   default: 1
  #   description:
  #     de: "Skalierungsfaktor der Leistungsvorgabe"
  #     en: "Scale factor for power target value"
render: |
  type: mypv-hea-thor
  {{- include "modbus" . }}
  tempsource: {{ .tempsource }}
