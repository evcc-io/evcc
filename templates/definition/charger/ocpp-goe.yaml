template: ocpp-goe
covers: ["ocpp-fronius-wattpilot"]
products:
  - brand: go-e
    description:
      generic: Charger Gemini flex 2.0 (OCPP)
  - brand: go-e
    description:
      generic: Charger Gemini 2.0 (OCPP)
  - brand: go-e
    description:
      generic: Charger Gemini flex (OCPP)
  - brand: go-e
    description:
      generic: Charger Gemini (OCPP)
  - brand: go-e
    description:
      generic: Charger CORE (OCPP)
  - brand: go-e
    description:
      generic: Charger V3 (OCPP)
  - brand: go-e
    description:
      generic: Charger PRO (OCPP)
  - brand: Fronius
    description:
      generic: Wattpilot (OCPP)
capabilities: ["rfid", "1p3p", "meter", "dim"]
requirements:
  evcc: ["sponsorship", "skiptest"]
  description:
    de: |
      Für die Fahrzeugerkennung per RFID muss die OCPP-Einstellung `LocalAuthListEnabled` in der Wallbox deaktiviert sein (`false`).
    en: |
      For vehicle identification via RFID, the OCPP setting `LocalAuthListEnabled` must be disabled (`false`) in the charger.
params:
  - preset: ocpp
  - name: metervalues
    default: -Current.Offered
render: |
  {{ include "ocpp" . }}
