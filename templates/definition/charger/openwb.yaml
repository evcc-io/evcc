template: openwb
products:
  - brand: openWB
    description:
      generic: series2
capabilities: ["meter", "dim"]
requirements:
  description:
    en: The wallbox has to be configured as loadpoint.
    de: Die Wallbox muss als Ladepunkt konfiguriert sein.
params:
  - name: host
  - name: connector
  - name: phases1p3p
    advanced: true
render: |
  type: openwb
  broker: {{ .host }}
  id: {{ .connector }} # loadpoint id
  {{- if .phases1p3p }}
  phases1p3p: true
  {{- end }}
