template: smart-evse
products:
  - brand: Stegen Electronics
    description:
      generic: v3.11.2 or newer
capabilities: ["mA", "rfid", "1p3p", "dim"]
requirements:
  description:
    de: |
      Anbindung über die REST API der Smart Evse Firmware (FW >= 3.11.2).
      evcc setzt das Gerät in den konfigurierten Modus und steuert den Ladestrom über `override_current`.
    en: |
      Uses the REST API of the Smart Evse firmware (FW >= 3.11.2).
      evcc puts the device into the configured mode and controls the charge current via `override_current`.
params:
  - name: host
  - name: cache
    default: 1s
  - name: chargeMode
    default: normal
    advanced: true
    type: choice
    choice: ["normal", "smart"]
    description:
      en: Charge mode
      de: Lademodus
render: |
  type: smart-evse
  uri: http://{{ .host }}
  cache: {{ .cache }}
  chargeMode: {{ .chargeMode }}
