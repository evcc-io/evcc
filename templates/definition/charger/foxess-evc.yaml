template: foxess-evc
products:
  - brand: FoxESS
    description:
      generic: AC EV Charger (Modbus)
capabilities: ["mA", "rfid", "meter", "1p3p"]
discovery:
  mdns: ["_modbus._tcp:EVC-*"]
requirements:
  description:
    de: In der Fox Switch App muss der Arbeitsmodus auf "Modbus TCP" gestellt werden. Wie eine Ladesession beginnt, bestimmt der in der Wallbox eingestellte Betriebsmodus - entweder per App bzw. RFID-Karte oder automatisch beim Anstecken starten.
    en: The work mode must be set to "Modbus TCP" in the Fox Switch app. How a session starts depends on the charger's own operating mode - start either via app or RFID card, or automatically on plug-in.
  evcc: ["sponsorship"]
params:
  - name: modbus
    choice: ["tcpip"]
    id: 1
  - name: connector
    type: int
    advanced: true
    description:
      de: Ladepunkt
      en: Connector
    help:
      de: Nur bei Wallboxen mit mehreren Ladepunkten (z.B. C-Serie), 1 oder 2. Pro Ladepunkt eine eigene Wallbox mit gleicher Adresse anlegen. Bei Wallboxen mit einem Ladepunkt leer lassen.
      en: Only for chargers with multiple connectors (e.g. C-series), 1 or 2. Add one charger per connector with the same address. Leave empty for single-connector chargers.
render: |
  type: foxess-evc
  {{- include "modbus" . }}
  {{- if .connector }}
  connector: {{ .connector }}
  {{- end }}
