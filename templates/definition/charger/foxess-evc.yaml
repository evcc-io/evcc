template: foxess-evc
products:
  - brand: FoxESS
    description:
      generic: AC EV Charger (Modbus)
capabilities: ["mA", "rfid", "meter", "1p3p"]
requirements:
  description:
    de: In der Fox Switch App muss der Arbeitsmodus auf "Modbus TCP" gestellt werden. Wie eine Ladesession beginnt, bestimmt der in der Wallbox eingestellte Betriebsmodus - entweder per App bzw. RFID-Karte oder automatisch beim Anstecken starten.
    en: The work mode must be set to "Modbus TCP" in the Fox Switch app. How a session starts depends on the charger's own operating mode - start either via app or RFID card, or automatically on plug-in.
  evcc: ["sponsorship"]
params:
  - name: modbus
    choice: ["tcpip"]
    id: 1
render: |
  type: foxess-evc
  {{- include "modbus" . }}
