template: lektrico
products:
  - brand: Lektrico
    description:
      generic: 1P7K / 3P22K Charging Station
capabilities: ["meter", "dim"]
requirements:
  evcc: ["sponsorship"]
discovery:
  mdns: ["_http._tcp:lektrico*"]
params:
  - name: host
  - name: cache
render: |
  type: lektrico
  host: {{ .host }}
  cache: {{ .cache }}
