template: nrggen2
products:
  - brand: NRGkick
    description:
      generic: Gen2
requirements:
  evcc: ["sponsorship"]
capabilities: ["mA", "1p3p", "meter", "dim"]
params:
  - name: modbus
    choice: ["tcpip"]
    id: 1
  - name: phases1p3p
    type: bool
    help:
      de: Erweiterte Funktion "Phasenumschaltung" muss in der NRGkick App aktiviert sein.
      en: Extended feature "Phase Switching" must be activated in the NRGKick app.
render: |
  type: nrggen2
  {{- include "modbus" . }}
  {{- if .phases1p3p }}
  phases1p3p: true
  {{- end }}
