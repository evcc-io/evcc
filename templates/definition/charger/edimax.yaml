template: edimax
products:
  - brand: Edimax
    description:
      generic: SP-2101W
  - brand: Edimax
    description:
      generic: SP-2101W V2
  - brand: Edimax
    description:
      generic: SP-2101W V3
capabilities: ["meter"]
group: switchsockets
discovery:
  mac: ["74DA38"]
params:
  - name: host
  - name: user
    default: admin
  - name: password
    default: 1234
  - preset: switchsocket
render: |
  type: edimax
  host: {{ .host }}
  user: {{ .user }}
  password: {{ .password }}
  {{ include "switchsocket" . }}
