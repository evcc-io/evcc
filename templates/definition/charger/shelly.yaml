template: shelly
products:
  - { brand: Shelly, description: { generic: 1 } }
  - { brand: Shelly, description: { generic: Plus 1 } }
  - { brand: Shelly, description: { generic: Pro 1 } }
  - { brand: Shelly, description: { generic: Plug S } }
  - { brand: Shelly, description: { generic: Plug M } }
capabilities: ["meter"]
group: switchsockets
discovery:
  mdns: ["_shelly._tcp", "_http._tcp:shelly*"]
  hostname: ["shelly*"]
  mac: ["8400EC"]
params:
  - name: host
  - name: user
  - name: password
  - name: channel
    default: 0
  - preset: switchsocket
render: |
  type: shelly
  uri: http://{{ .host }}
  user: {{ .user }}
  password: {{ .password }}
  channel: {{ .channel }}  # shelly device relay channel
  {{ include "switchsocket" . }}
