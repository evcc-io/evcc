template: viessmann
products:
  - brand: Viessmann
    description:
      generic: Heatpump (API)
group: heating
requirements:
  # evcc: ["sponsorship"]
  evcc: ["skiptest"]
  description:
    de: |
      Einmalige Warmwasserbereitung. Das Gerät entscheidet eigenständig, ob die Wärmepumpe oder die elektrische Zusatzheizung (falls vorhanden) genutzt wird.

      Leistungs- und Temperaturwerte setzen Datenpunkte der One-Base-/E3-Gerätegeneration voraus (z. B. Vitocal 25x, getestet mit Vitocal 250-A). Welche Datenpunkte ein Gerät liefert, ist geräteabhängig und lässt sich über die [Viessmann API](https://developer.viessmann-climatesolutions.com/) am Feature-Endpunkt der Anlage ablesen. Für Geräte ohne diese Datenpunkte die Option „Leistungs- und Temperaturwerte auslesen" deaktivieren.
    en: |
      One-time hot water preparation. The device automatically decides whether to use the heat pump or the auxiliary electric heater (if available).

      Power and temperature readings require data points of the One Base/E3 device generation (e.g. Vitocal 25x, tested with a Vitocal 250-A). Which data points a device provides is device-specific and can be inspected via the [Viessmann API](https://developer.viessmann-climatesolutions.com/) feature endpoint of the installation. For devices without these data points, disable the "Read power and temperature values" option.
params:
  - name: user
    deprecated: true
  - name: password
    deprecated: true
  - name: clientid
    help:
      de: Konfigurieren in [app.developer.viessmann-climatesolutions.com](https://app.developer.viessmann-climatesolutions.com)
      en: Configure at [app.developer.viessmann-climatesolutions.com](https://app.developer.viessmann-climatesolutions.com)
  - name: redirecturi
    help:
      en: "Redirect URI of the evcc instance. Must match the redirect URI set in the Viessmann developer portal."
      de: "Redirect-URI der evcc-Instanz. Muss mit der Redirect URI übereinstimmen, die im Viessmann Developer Portal konfiguriert ist."
    service: auth/redirecturi
  - name: gateway_serial
    required: true
    service: viessmann/equipment?detail=gateways&clientid={clientid}&redirecturi={redirecturi}
    description:
      de: Gateway Serial
      en: Gateway Serial
    help:
      de: Wird nach der Anmeldung automatisch ermittelt. Alternativ manuell eintragen (VitoCare App -> Einstellungen -> Kommunikationsmodul -> Seriennummer)
      en: Determined automatically after login. Alternatively enter manually (VitoCare App -> Settings -> Communication module -> Serial number)
  - name: installation_id
    required: true
    service: viessmann/equipment?clientid={clientid}&redirecturi={redirecturi}
    description:
      de: Installation ID
      en: Installation ID
    help:
      de: |
        Wird nach der Anmeldung automatisch ermittelt.

        <details><summary>Fallback: Installation ID per Kommandozeile ermitteln</summary>

        Vorraussetzungen: curl, jq, und die folgenden Umgebungsvariblen:

        ```
        VIESSMANN_USER=<your-user>
        VIESSMANN_PASS=<your-password>
        VIESSMANN_CLIENT_ID=<your-clientid>
        ```

        Dann holen wir uns einen oauth token (n.b. am besten den gesamten Block in das Terminal kopieren, da die Zwischenvariable 'CODE' nur 20 Sekunden gültig ist):

        ```
        VIESSMANN_REDIRECT_URI=<your-redirect-uri>
        VIESSMANN_CODE_CHALLENGE="5M5nhkBfkWZCGfLZYcTL-l7esjPUN7PpZ4rq8k4cmys"
        VIESSMANN_CODE_VERIFIER="6PygdmeK8JKPuuftlkc6q4ceyvjhMM_a_cJrPbcmcLc-SPjx2ZXTYr-SOofPUBydQ3McNYRy7Hibc2L2WtVLJFpOQ~Qbgic455ArKjUz9_UiTLnO6q8A3e.I_fIF8hAo"

        VIESSMANN_CODE=$(curl -X POST --silent \
          --user $VIESSMANN_USER:$VIESSMANN_PASS \
          --output /dev/null \
          --dump-header -    \
          "https://iam.viessmann-climatesolutions.com/idp/v3/authorize?client_id=$VIESSMANN_CLIENT_ID&redirect_uri=$VIESSMANN_REDIRECT_URI&scope=IoT%20User%20offline_access&response_type=code&code_challenge=$VIESSMANN_CODE_CHALLENGE&code_challenge_method=S256" \
          | grep "^location: "            \
          | sed 's/.*\?code=\(.*\).*/\1/' \
          | tr -d '[:space:]')

        TOKEN_RESPONSE=$(curl -XPOST --silent \
          -H "Content-Type: application/x-www-form-urlencoded" \
          --data "grant_type=authorization_code&client_id=$VIESSMANN_CLIENT_ID&redirect_uri=$VIESSMANN_REDIRECT_URI&code_verifier=$VIESSMANN_CODE_VERIFIER&code=$VIESSMANN_CODE" \
          https://iam.viessmann-climatesolutions.com/idp/v3/token)

        VIESSMANN_TOKEN=$(echo $TOKEN_RESPONSE | jq --raw-output .access_token)
        ```

        Damit können wir jetzt die Installation ID abfragen:

        ```
        curl --silent -H "Authorization: Bearer $VIESSMANN_TOKEN" \
          https://api.viessmann-climatesolutions.com/iot/v2/equipment/installations?includeGateways=true \
          | jq '.data[].id'
        ```

        </details>
      en: |
        Determined automatically after login.

        <details><summary>Fallback: determine the installation id on the command line</summary>

        Prerequisites: curl, jq, and the following parameters:

        ```
        VIESSMANN_USER=<your-user>
        VIESSMANN_PASS=<your-password>
        VIESSMANN_CLIENT_ID=<your-clientid>
        ```

        Then execute the following to get an oauth token (n.b. it's best to paste the entire block as-is, since the intermediate 'CODE' is only valid for 20 seconds):

        ```
        VIESSMANN_REDIRECT_URI=<your-redirect-uri>
        VIESSMANN_CODE_CHALLENGE="5M5nhkBfkWZCGfLZYcTL-l7esjPUN7PpZ4rq8k4cmys"
        VIESSMANN_CODE_VERIFIER="6PygdmeK8JKPuuftlkc6q4ceyvjhMM_a_cJrPbcmcLc-SPjx2ZXTYr-SOofPUBydQ3McNYRy7Hibc2L2WtVLJFpOQ~Qbgic455ArKjUz9_UiTLnO6q8A3e.I_fIF8hAo"

        VIESSMANN_CODE=$(curl -X POST --silent \
          --user $VIESSMANN_USER:$VIESSMANN_PASS \
          --output /dev/null \
          --dump-header -    \
          "https://iam.viessmann-climatesolutions.com/idp/v3/authorize?client_id=$VIESSMANN_CLIENT_ID&redirect_uri=$VIESSMANN_REDIRECT_URI&scope=IoT%20User%20offline_access&response_type=code&code_challenge=$VIESSMANN_CODE_CHALLENGE&code_challenge_method=S256" \
          | grep "^location: "            \
          | sed 's/.*\?code=\(.*\).*/\1/' \
          | tr -d '[:space:]')

        TOKEN_RESPONSE=$(curl -XPOST --silent \
          -H "Content-Type: application/x-www-form-urlencoded" \
          --data "grant_type=authorization_code&client_id=$VIESSMANN_CLIENT_ID&redirect_uri=$VIESSMANN_REDIRECT_URI&code_verifier=$VIESSMANN_CODE_VERIFIER&code=$VIESSMANN_CODE" \
          https://iam.viessmann-climatesolutions.com/idp/v3/token)

        VIESSMANN_TOKEN=$(echo $TOKEN_RESPONSE | jq --raw-output .access_token)
        ```

        Finally, get the installation id:

        ```
        curl --silent -H "Authorization: Bearer $VIESSMANN_TOKEN" \
          https://api.viessmann-climatesolutions.com/iot/v2/equipment/installations?includeGateways=true \
          | jq '.data[].id'
        ```

        </details>
  - name: device_id
    required: true
    description:
      de: Device ID
      en: Device ID
    help:
      de: normalerweise `0`
      en: typically `0`
    default: 0
  - name: measurements
    required: true
    type: bool
    default: true
    description:
      de: Leistungs- und Temperaturwerte auslesen
      en: Read power and temperature values
    help:
      de: Liest die aktuelle elektrische Leistungsaufnahme und die Warmwassertemperatur aus (Geräte der One-Base-/E3-Generation, z. B. Vitocal 25x). Deaktivieren, wenn das Gerät diese Datenpunkte nicht liefert (ältere Hardware/Firmware); die Verfügbarkeit lässt sich am Feature-Endpunkt der API ablesen.
      en: Reads the current electrical power consumption and the domestic hot water temperature (One Base/E3 generation devices, e.g. Vitocal 25x). Disable if the device does not provide these data points (older hardware/firmware); availability can be checked via the API feature endpoint.
  - name: uri
    advanced: true
    default: https://api.viessmann-climatesolutions.com/iot/v2
    description:
      de: API-Basis-URL
      en: API base URL
    help:
      de: Nur ändern, falls Viessmann die API-Domain erneut umzieht oder ein Proxy verwendet wird
      en: Only change if Viessmann moves the API domain again or a proxy is used
  - name: target_temperature
    deprecated: true
    description:
      de: Zieltemperatur für Einmal-Warmwasser-Zubereitung
      en: Target temperature for one-time charge
    unit: °C
    help:
      de: Parameter existiert nur aus historischen Gründen. Zieltemperatur kann in der ViCare App eingestellt werden (wird nicht von allen Anlagen unterstützt)
      en: Parameter only exists for historic reasons. Target Temperature can be configured in the ViCare app (not supported by all devices)
    default: 45
    type: int
auth:
  type: viessmann
  params: [clientid, redirecturi, gateway_serial]
render: |
  {{- $device := printf "%s/features/installations/%s/gateways/%s/devices/%s" .uri .installation_id .gateway_serial .device_id }}
  type: sgready
  getmode:
    source: http
    # Read the whole device feature list in ONE request. All GET readers below use
    # this exact same URL, so evcc's shared HTTP cache serves them from a single API
    # call per cache window. The Viessmann API has a strict daily request quota
    # (shared with the ViCare app); per-feature polling exhausts it (HTTP 429).
    uri: {{ $device }}/features
    cache: 120s # ~720 requests/day; raise further if you still hit 429
    auth:
      source: viessmann
      clientid: {{ .clientid }}
      redirecturi: {{ .redirecturi }}
      gateway_serial: {{ .gateway_serial }}
    jq: '.data[] | select(.feature == "heating.dhw.oneTimeCharge") | .properties.active.value | if . == false then 2 elif . == true then 3 else . end'
    # false -> oneTimeCharge is disabled -> normal mode -> 2
    # true -> oneTimeCharge is enabled -> boost mode -> 3
  setmode:
    source: watchdog
    timeout: 60m # re-write at timeout/2
    reset: 1 # reset watchdog on normal
    set:
      source: switch
      switch:
      - case: 2 # normal
        set:
          source: http
          uri: {{ $device }}/features/heating.dhw.oneTimeCharge/commands/deactivate
          method: POST 
          headers:  
            - content-type: application/json
          auth:
            source: viessmann
            clientid: {{ .clientid }}
            redirecturi: {{ .redirecturi }}
            gateway_serial: {{ .gateway_serial }}
          body: >
            { }
      - case: 3 # boost
        set:
          source: http
          uri: {{ $device }}/features/heating.dhw.oneTimeCharge/commands/activate
          method: POST 
          headers:  
            - content-type: application/json
          auth:
            source: viessmann
            clientid: {{ .clientid }}
            redirecturi: {{ .redirecturi }}
            gateway_serial: {{ .gateway_serial }}
          body: >
            { }
      - case: 1 # dimm
        set:
          source: error
          error: ErrNotAvailable
  {{- if eq .measurements "true" }}
  power:
    # heating.power.consumption.current reports the real electrical input power in kW.
    # Reading it replaces evcc's fallback estimate (current * phases * voltage), which
    # wrongly assumed a full electric-heater draw when no meter was configured.
    # Same URL + cache as getmode -> served from the shared cached feature list.
    source: http
    uri: {{ $device }}/features
    cache: 120s
    auth:
      source: viessmann
      clientid: {{ .clientid }}
      redirecturi: {{ .redirecturi }}
      gateway_serial: {{ .gateway_serial }}
    jq: '.data[] | select(.feature == "heating.power.consumption.current") | .properties.value.value * 1000' # kW -> W
  temp:
    # heating.dhw.sensors.temperature.dhwCylinder: domestic hot water temperature (°C).
    # The device controls one-time DHW charging, so the hot water tank is the natural
    # temperature to display on the loadpoint gauge.
    source: http
    uri: {{ $device }}/features
    cache: 120s
    auth:
      source: viessmann
      clientid: {{ .clientid }}
      redirecturi: {{ .redirecturi }}
      gateway_serial: {{ .gateway_serial }}
    jq: '.data[] | select(.feature == "heating.dhw.sensors.temperature.dhwCylinder") | .properties.value.value'
  limittemp:
    # heating.dhw.temperature.main: configured DHW target temperature (°C).
    source: http
    uri: {{ $device }}/features
    cache: 120s
    auth:
      source: viessmann
      clientid: {{ .clientid }}
      redirecturi: {{ .redirecturi }}
      gateway_serial: {{ .gateway_serial }}
    jq: '.data[] | select(.feature == "heating.dhw.temperature.main") | .properties.value.value'
  {{- end }}
  {{ include "heatpumpswitch" . }}
