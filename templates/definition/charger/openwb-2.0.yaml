template: openwb-2.0
products:
  - brand: openWB
    description:
      generic: Software 2.x
capabilities: ["mA", "1p3p", "meter", "dim", "rfid"]
requirements:
  description:
    de: |
      Erfordert [`Software 2.x`](https://github.com/openWB/core).
      Folgende Änderungen sind unter dem `Einstellungen`-Reiter erforderlich:

      * Steuerungsmodus: `secondary`
      * Steuerung über Modbus als secondary: `An`

      RFID-Autorisierung ist erst ab openWB Software 2.3.0 sinnvoll nutzbar, siehe
      [`openWB Issue 2832`](https://github.com/openWB/core/issues/2832)
    en: |
      Requires [`Software 2.x`](https://github.com/openWB/core).
      The following changes are necessary under the 'Einstellungen' tab:

      * Steuerungsmodus: `secondary`
      * Steuerung über Modbus als secondary: `An`

      RFID authorisation requires openWB Software 2.3.0 or later, check
      [`openWB Issue 2832`](https://github.com/openWB/core/issues/2832)
discovery:
  hostname: ["openWB*"]
params:
  - name: modbus
    choice: ["tcpip"]
    port: 1502
    id: 1
  - name: connector
  - name: phases1p3p
    advanced: true
    default: true
  - name: identify
    type: bool
    description:
      en: Use RFID-Reader
      de: RFID-Reader verwenden
    help:
      en: Requires openWB 2.3.0 or later, see [`openWB Issue 2832`](https://github.com/openWB/core/issues/2832).
      de: Erfordert openWB 2.3.0 oder neuer, siehe [`openWB Issue 2832`](https://github.com/openWB/core/issues/2832).
render: |
  type: openwb-2.0
  {{- include "modbus" . }}
  connector: {{ .connector }}
  phases1p3p: {{ .phases1p3p }}
  identify: {{ .identify }}
