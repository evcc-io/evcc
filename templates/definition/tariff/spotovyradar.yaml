template: spotovyradar
link: https://spotovyradar.cz/ucet/api
products:
  - brand: Spotový Radar
    description:
      generic: Predicted spot prices
requirements:
  description:
    en: "Czech (OTE, CZK) or Slovak (OKTE, EUR) day-ahead prices in 15-minute intervals plus a 72-hour forecast. Optionally the final price from your settings at spotovyradar.cz (CZ: supplier fee, distribution and VAT; SK: supplier fee and VAT). Requires an API key from [spotovyradar.cz](https://spotovyradar.cz/ucet/api) (Smart Home plan)."
    de: "Tschechische (OTE, CZK) oder slowakische (OKTE, EUR) Day-Ahead-Preise in 15-Minuten-Intervallen plus 72-Stunden-Prognose. Optional der Endpreis aus den Einstellungen auf spotovyradar.cz (CZ: Händleraufschlag, Netzentgelte und Mehrwertsteuer; SK: Händleraufschlag und Mehrwertsteuer). Benötigt einen API-Key von [spotovyradar.cz](https://spotovyradar.cz/ucet/api) (Tarif Smart Home)."
  evcc: ["skiptest"]
group: price
countries: ["CZ", "SK"]
params:
  - name: apikey
    required: true
    example: sr_live_abcdefgh_…
    help:
      en: "Create a key at [spotovyradar.cz/ucet/api](https://spotovyradar.cz/ucet/api)."
      de: "Key erstellen unter [spotovyradar.cz/ucet/api](https://spotovyradar.cz/ucet/api)."
  - name: zone
    type: choice
    choice: ["CZ", "SK"]
    advanced: true
    description:
      en: Market
      de: Markt
    help:
      en: "Empty = market of your account at spotovyradar.cz. CZ = OTE prices in CZK (currency: CZK), SK = OKTE prices in EUR (currency: EUR)."
      de: "Leer = Markt Ihres Kontos auf spotovyradar.cz. CZ = OTE-Preise in CZK (currency: CZK), SK = OKTE-Preise in EUR (currency: EUR)."
  - name: price
    type: choice
    choice: ["spot", "final"]
    default: spot
    description:
      en: Price
      de: Preis
    help:
      en: "spot = spot price per kWh (CZK or EUR by market) excluding VAT and charges (add them with charges and tax). final = final price according to your settings at spotovyradar.cz (CZ tariff: supplier fee, distribution peak/off-peak, other charges, VAT; SK: supplier fee and VAT). Do not combine final with charges or tax."
      de: "spot = Börsenpreis pro kWh (CZK oder EUR je nach Markt) ohne Mehrwertsteuer und Gebühren (über charges und tax ergänzen). final = Endpreis gemäß Ihren Einstellungen auf spotovyradar.cz (CZ-Tarif: Händleraufschlag, Netzentgelt HT/NT, weitere Umlagen, Mehrwertsteuer; SK: Händleraufschlag und Mehrwertsteuer). final nicht mit charges oder tax kombinieren."
  - preset: tariff-base
  - preset: tariff-features
render: |
  type: custom
  {{ include "base" . }}
  {{ include "features" (merge (dict "basefeatures" (list "cacheable")) .) }}
  forecast:
    source: http
    uri: https://spotovyradar.cz/api/v1/forecast?hours=72{{ if .zone }}&zone={{ .zone }}{{ end }}
    auth:
      type: bearer
      token: {{ .apikey }}
    jq: |
      [.points[] | {
        "start": .start,
        "end": .end,
        {{- if eq .price "final" }}
        "value": (.final // .spot)
        {{- else }}
        "value": .spot
        {{- end }}
      }] | tostring
