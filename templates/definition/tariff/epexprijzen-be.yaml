template: epexprijzen-be
link: https://epexprijzen.be
products:
  - brand: epexprijzen.be
requirements:
  evcc: ["skiptest"]
  description:
    en: Current energy prices in Belgium. Prices include energy tax and provider charge by default. When 'tax' or 'charges' are configured, the included amounts are automatically subtracted to avoid double-counting.
    de: Aktuelle Energiepreise in Belgien. Preise enthalten standardmäßig Energiesteuer und Anbietergebühr. Wenn 'tax' oder 'charges' konfiguriert sind, werden die enthaltenen Beträge automatisch abgezogen, um Doppelzählungen zu vermeiden.
group: price
countries: ["BE"]
params:
  - name: provider
    description:
      en: Energy provider
      de: Energieversorger
    type: choice
    choice:
      [
        "bolt",
        "dots-energy",
        "ebem",
        "ecofix",
        "ecopower",
        "eneco",
        "energiebe",
        "energy-knights",
        "energyvision",
        "engie",
        "evident-energie",
        "frank-energie",
        "hoa-energy",
        "luminus",
        "mega",
        "octaplus",
        "power2you",
        "servolt-energie",
        "smappee-smiles",
        "totalenergies",
        "trevion",
        "wase-wind",
      ]
    required: true
  - name: region
    example: vlaanderen
    type: choice
    choice: ["vlaanderen", "wallonie", "brussel"]
    required: true
    description:
      generic: Region
  - name: price-interval
    description:
      en: Price interval
      de: Preisintervall
    type: choice
    choice: ["hourly", "quarterly"]
    default: quarterly
    required: true
  - preset: tariff-base
  - name: interval
    default: 1h
    advanced: true
render: |
  type: custom
  {{ include "base" . }}
  forecast:
    source: http
    uri: https://epexprijzen.be/api/v1/prices/{{ .provider }}/{{ index . "price-interval" }}?region={{ .region }}
    jq: |
      . as $root |
      ({{ if index . "tax" }}($root.energy_tax // 0){{ else }}0{{ end }}) as $energy_tax |
      ({{ if index . "charges" }}($root.provider_charge // 0){{ else }}0{{ end }}) as $provider_charge |
      ($root.today // []) + ($root.tomorrow // []) |
      map({
        "start": (.t | strptime("%Y-%m-%dT%H:%M:%S%z") | strftime("%Y-%m-%dT%H:%M:%SZ")),
        "end": (.t | strptime("%Y-%m-%dT%H:%M:%S%z") | mktime + {{ if eq (index . "price-interval") "hourly" }}3600{{ else }}900{{ end }} | strftime("%Y-%m-%dT%H:%M:%SZ")),
        "value": (.price - $energy_tax - $provider_charge)
      }) | tostring
    cache: 1h
  interval: {{ .interval }}
