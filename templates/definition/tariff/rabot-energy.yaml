template: rabot-energy
link: https://www.rabot.energy/dynamischer-stromtarif/
products:
  - brand: Rabot Energy
    description:
      de: Dynamischer Stromtarif
      en: Dynamic electricity tariff
requirements:
  description:
    de: "Der Preis wird aus dem Day-ahead-Börsenpreis (DE-LU, [Energy-Charts](https://api.energy-charts.info/)) berechnet: `(Börsenpreis + Aufschlag) * (1 + Steuer)`. Die Voreinstellung von 15,5 ct/kWh netto Aufschlag und 19 % MwSt. entspricht der Rechnung des Live-Strompreis-Widgets von Rabot Energy. Das ist ein bundesweiter Durchschnitt, der tatsächliche Preis hängt von Netzentgelten und Abgaben am Wohnort ab. Den Aufschlag bitte in den erweiterten Einstellungen anhand der eigenen Rechnung oder der App anpassen. Bei zeitabhängigen Netzentgelten (z.B. §14a Modul 3) kann `chargesZones` verwendet werden. Es wird keine Anmeldung bei Rabot Energy benötigt."
    en: "The price is calculated from the day-ahead exchange price (DE-LU, [Energy-Charts](https://api.energy-charts.info/)): `(exchange price + charge) * (1 + tax)`. The default of 15.5 ct/kWh net charge and 19 % VAT matches the calculation of Rabot Energy's own live price widget. This is a nationwide average, the actual price depends on grid fees and levies at your location. Please adjust the charge in the advanced settings according to your own invoice or the app. For time-dependent grid fees (e.g. §14a module 3) `chargesZones` can be used. No registration with Rabot Energy is required."
  evcc: ["skiptest"]
group: price
countries: ["DE"]
params:
  - preset: tariff-base
  - name: charges
    default: 0.155
  - name: tax
    default: 0.19
  - preset: tariff-features
render: |
  type: custom
  {{ include "base" . }}
  {{ include "features" . }}
  forecast:
    source: http
    uri: https://api.energy-charts.info/price?bzn=DE-LU&end={{ `{{ addDate now 0 0 1 | date "2006-01-02" }}` }}
    cache: 1h
    jq: |
      [.unix_seconds, .price] | transpose | map({
        "start": .[0] | todate,
        "end":   .[0]+900 | todate,
        "value": .[1]/1000
      }) | tostring
