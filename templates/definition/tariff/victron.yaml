template: victron
link: https://www.victronenergy.com/panel-systems-remote-monitoring/vrm
products:
  - brand: Victron
    description:
      generic: VRM Solar Forecast
requirements:
  description:
    en: >-
      [vrm.victronenergy.com](https://vrm.victronenergy.com) get the
      solar forecast for up to 7 days from your installation in VRM portal. You
      need a free user access token.
    de: >-
      [vrm.victronenergy.com](https://vrm.victronenergy.com) abrufen der
      Solarprognose für bis zu 7 Tage einer Installation im VRM-Portal. Es wird
      ein kostenloses User Access Token benoetigt.
  evcc: ["skiptest"]
group: solar
params:
  - name: idsite
    description:
      en: VRM Site ID of the installation
      de: VRM-Installations-ID der Installation
    help:
      en: The VRM Site ID is displayed in the installation settings under "General"
      de: Die VRM-Installations-ID wird in den Einstellungen der Installation unter "Allgemeines" angezeigt
    example: 123456
    required: true
  - name: token
    description:
      en: API access token
      de: API Zugriffstoken
    help:
      en: Tokens can be created in VRM in Preferences->Integrations
      de: Token können im VRM erstellt werden unter Präferenzen->Integrationen
    required: true
  - name: interval
    default: 1h
    advanced: true
render: |
  type: custom
  tariff: solar
  forecast:
    source: http
    uri: https://vrmapi.victronenergy.com/v2/installations/{{ .idsite }}/stats?start={{ `{{ now | unixEpoch | int }}` }}&end={{ `{{ add (now | unixEpoch | int) 604800 }}` }}&interval=hours&type=forecast
    method: "GET"
    headers:
      - X-Authorization: "Token {{ .token }}"
    jq: |
      # values are the energy of the hour starting at the timestamp. evcc expects the
      # power at the timestamp, which is the mean of the hours meeting there.
      .records.solar_yield_forecast as $s
      | [ range(0; $s|length) as $i |
          {
            start: (($s[$i][0] / 1000) | todateiso8601),
            end:   ((($s[$i][0] + 3600000) / 1000) | todateiso8601),
            value: (($s[[$i-1, 0] | max][1] + $s[$i][1]) / 2)
          }**Is your feature request related to a problem? Please describe.**
The VRM solar template requests a fixed 48 h window (`end = now + 172800`), although VRM provides an hourly forecast for up to 7 days. evcc limits the optimizer horizon to the shortest of grid, feed-in and solar, so the hosted optimizer loses up to 18 h of its horizon (it plans until the end of the day after tomorrow, up to ~66 h). A self-hosted optimizer is capped at 48 h altogether.

**Describe the solution you'd like**
In `templates/definition/tariff/victron.yaml` change `172800` to `604800` in the `uri` and update the description ("2-days-forecast" → "solar forecast for up to 7 days"). VRM returns whatever is available.

**Describe alternatives you've considered**
A `forecast_days` parameter like pvnode. Not needed, since VRM has no per-plan day limit.

**Additional context**
Tested on a real installation with `end = now + 7d`: VRM returned 166 hourly values (2026-11-01T22:01Z to 2026-11-08T19:01Z). A 96 h variant of the template has been running on the same installation. `go test ./util/templates/...` and `TestTemplates/victron` pass with the change.
        ] | tostring
  interval: {{ .interval }}
