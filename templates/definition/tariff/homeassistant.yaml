template: homeassistant
products:
  - brand: Home Assistant
group: solar
requirements:
  description:
    en: Uses the solar forecast that is selected for the solar production in the Home Assistant Energy dashboard, e.g. from Forecast.Solar, Solcast or Helios Forecast. Several forecasts are added up. Values are hourly.
    de: Verwendet die Solarprognose, die im Home Assistant Energie-Dashboard für die Solarproduktion ausgewählt ist, z.B. von Forecast.Solar, Solcast oder Helios Forecast. Mehrere Prognosen werden addiert. Die Werte sind stündlich.
  evcc: ["skiptest"]
auth:
  type: homeassistant
  params: [uri, insecure]
params:
  - name: uri
    description:
      de: Home Assistant URI
      en: Home Assistant URI
    example: http://homeassistant.local:8123
    help:
      en: " " # overwrite default
      de: " " # overwrite default
    service: homeassistant/instances
    required: true
  - name: insecure
  - name: interval
    default: 1h
    advanced: true
render: |
  type: homeassistant
  features: ["cacheable"]
  uri: {{ .uri }}
  insecure: {{ .insecure }}
  interval: {{ .interval }}
