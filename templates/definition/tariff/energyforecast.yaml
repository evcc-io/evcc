template: energyforecast
link: https://www.energyforecast.de
products:
  - brand: Energy Forecast
requirements:
  description:
    de: Aufschlag und Steuer, die hier nicht gesetzt sind, werden aus dem Profil auf energyforecast.de übernommen. Wer nur einen Aufschlag setzt, sollte auch die Steuer setzen, da der Aufschlag sonst unversteuert bleibt.
    en: Charges and tax not set here are taken from your energyforecast.de profile. When setting a charge, also set the tax, otherwise the charge is not taxed.
  evcc: ["skiptest"]
group: price
countries:
  ["DE", "LU", "AT", "FR", "NL", "BE", "PL", "DK", "CH", "CZ", "HU", "SI", "IT", "NO", "SE"]
params:
  - name: token
    required: true
  - name: domain
    type: choice
    choice: [DE-LU, AT, FR, NL, BE, PL, DK1, DK2, CH, CZ, HU, SI, IT-North, NO2, SE4]
  - preset: tariff-base
  - preset: tariff-features
render: |
  type: custom
  {{ include "base" . }}
  {{ include "features" . }}
  # values set in evcc are applied locally and zeroed in the API, unset values come from the energyforecast.de profile
  forecast:
    source: http
    uri: https://www.energyforecast.de/api/v2/forecast?token={{ .token }}{{ if .domain }}&market_zone={{ .domain }}{{ end }}{{ if or (ne (toString .charges) "") .chargesZones .formula }}&fixed_cost_cent=0{{ end }}{{ if or (ne (toString .tax) "") .formula }}&vat=0{{ end }}
    jq: |
      .data | map({
        "start": .start,
        "end": .end,
        "value": (.total_ct_kwh / 100),
        "estimate": (.price_origin == "forecast")
      }) | tostring
