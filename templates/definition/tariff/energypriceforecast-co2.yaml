template: energypriceforecast-co2
products:
  - brand: Energy Price Forecast EU
    description:
      generic: CO₂
requirements:
  description:
    de: "5 Tage Prognose [energypriceforecast.eu](https://energypriceforecast.eu/de/evcc-strompreis-co2-prognose/)"
    en: "5 days prognosis [energypriceforecast.eu](https://energypriceforecast.eu/en/evcc-electricity-price-co2-forecast/)"
  evcc: ["skiptest"]
group: co2
countries: ["DE", "NL", "BE", "DK", "FR", "AT", "CZ", "PL", "FI", "SE", "NO"]
params:
  - name: region
    example: DE
    type: choice
    choice:
      [
        "DE",
        "NL",
        "BE",
        "DK1",
        "DK2",
        "FR",
        "AT",
        "CZ",
        "PL",
        "FI",
        "SE1",
        "SE2",
        "SE3",
        "SE4",
        "NO1",
        "NO2",
        "NO3",
        "NO4",
        "NO5",
      ]
    required: true
  - name: horizon
    default: 120
    type: int
    unit: h
    description:
      en: Forecast horizon
      de: Prognosehorizont
    required: true
render: |
  type: custom
  features: ["cacheable"]
  tariff: co2
  forecast:
    source: http
    uri: https://api.energypriceforecast.eu/api/v1/evcc/tariff?country={{.region}}&type=co2&hours={{.horizon}}
