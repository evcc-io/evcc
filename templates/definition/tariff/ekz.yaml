# Documentation: https://api.tariffs.ekz.ch/swagger
# Tariff names: https://www.ekz.ch/dam/ekz/privatkunden/strom/tarife-und-agb/Tarif-bersicht_EKZ_2026.json
#
# Limitations:
# - Fallback in case of non-avaiable API is not implemented. Docs: "In case of API unavailability between 18:00 and 24:00 the fallback stated in EKZ tariff publication applies (for 2026 the standard tariff applies for the following day)."
# - Public "/tariffs" endpoint is used. Protected "/customerTariffs" is not supported.

template: ekz
link: https://www.ekz.ch/de/angebote/strom/tarife/dynamischer-wahltarif.html
products:
  - brand: EKZ
requirements:
  evcc: ["skiptest"]
group: price
countries: ["CH"]
params:
  - preset: tariff-base
  - name: tariff_name
    description:
      generic: Desired tariff (400D for dynamic).
    example: 400D
    type: choice
    choice: ["400D", "400F", "400ST", "400WP", "400L", "400LS", "16L", "16LS"]
    required: true
    default: 400D
  - name: tax
    default: 0.081
  - name: interval
    default: 1h
    advanced: true
render: |
  type: custom
  {{ include "base" . }}
  forecast:
    source: http
    # dateInZone: sprig `date` formats in local time; UTC window replaces the hardcoded +02:00 offset
    uri: https://api.tariffs.ekz.ch/v1/tariffs?tariff_name=integrated_{{ .tariff_name }}&start_timestamp={{ `{{ dateInZone "2006-01-02T15" now "UTC" }}` }}:00:00Z&end_timestamp={{ `{{ dateInZone "2006-01-02T15" (addDate now 0 0 2) "UTC" }}` }}:00:00Z
    jq: |
      [.prices[] |
        {
          start: (.start_timestamp),
          end: (.end_timestamp),
          value: (.integrated[] | select(.unit == "CHF_kWh") | .value)
        }
      ] | tostring
  cache: 1h
  interval: {{ .interval }}
