template: awattar
link: https://www.awattar.at/tariffs/hourly
products:
  - brand: Awattar
group: price
countries: ["DE", "AT"]
protocols: [http]
cloud: true
params:
  - name: region
    example: AT
    type: choice
    choice: ["DE", "AT"]
    required: true
  - preset: tariff-base
render: |
  type: awattar
  region: {{ .region }}
  {{ include "base" . }}
