template: fnn-gpio
products:
  - description:
      generic: FNN-Steuerbox via GPIO (§ 14a EnWG, § 9 EEG)
params:
  - name: maxconsumptionpower
    type: float
    unit: W
    required: true
    description:
      en: Guaranteed minimum power (Pmin)
      de: Garantierte Mindestleistung (Pmin)
    help:
      en: Power limit applied to the root circuit while the limit is active.
      de: Leistungsbegrenzung des Hauptstromkreises während die Limitierung aktiv ist.
  - name: w4pin
    type: int
    required: true
    description:
      en: W4 GPIO pin
      de: W4 GPIO-Pin
    help:
      en: Input pin for the W4 signal (Dimmer for controllable loads)
      de: Eingangspin für das W4-Signal (Dimmen der steuerbaren Verbrauchseinrichtungen)
  - name: productionnominalmax
    type: float
    unit: Wp
    description:
      en: Installed generator power
      de: Installierte Generatorleistung
    help:
      en: Rated generator/module power of the installation (reference value according to § 9 EEG).
      de: Gesamtnennleistung bzw. Modul- oder Generatorleistung der Anlage (Bezugsgröße nach § 9 EEG).
  - name: maxproductionpower
    deprecated: true
  - name: w3pin
    type: int
    required: true
    description:
      en: W3 GPIO pin
      de: W3 GPIO-Pin
    help:
      en: Input pin for the W3 signal (Zero export, 0%)
      de: Eingangspin für das W3-Signal (Keine Netzeinspeisung, 0%)
  - name: s1pin
    type: int
    description:
      en: S1 GPIO pin
      de: S1 GPIO-Pin
    help:
      en: Input pin for the S1 signal (60% export power limit)
      de: Eingangspin für das S1-Signal (Reduzierung der Einspeiseleistung auf 60%)
  - name: s2pin
    type: int
    description:
      en: S2 GPIO pin
      de: S2 GPIO-Pin
    help:
      en: Input pin for the S2 signal (30% export power limit)
      de: Eingangspin für das S2-Signal (Reduzierung der Einspeiseleistung auf 30%)
  - name: activelow
    type: bool
    advanced: true
    description:
      en: Inputs active low
      de: Eingänge invertiert (active low)
    help:
      en: Signals are active when the input is pulled to ground, e.g. by a relay contact switching to GND.
      de: Signale sind aktiv, wenn der Eingang auf Masse gezogen wird, z. B. durch einen Relaiskontakt gegen GND.
  - name: bias
    type: choice
    choice: ["pull-up", "pull-down", "disabled", "as-is"]
    default: pull-up
    advanced: true
    description:
      en: Input bias
      de: Interner Pull-Widerstand
    help:
      en: Internal pull resistor of the inputs. Determines the input level while the contact is open.
      de: Interner Pull-Widerstand der Eingänge. Bestimmt den Eingangspegel bei offenem Kontakt.
render: |
  type: fnn
  maxdimpower: {{ .maxconsumptionpower }}
  w4:
    source: gpio
    pin: {{ .w4pin }}
    function: read
    {{- if .activelow }}
    activelow: true
    {{- end }}
    {{- if .bias }}
    bias: {{ .bias }}
    {{- end }}
  productionnominalmax: {{ or .productionnominalmax .maxproductionpower }}
  w3:
    source: gpio
    pin: {{ .w3pin }}
    function: read
    {{- if .activelow }}
    activelow: true
    {{- end }}
    {{- if .bias }}
    bias: {{ .bias }}
    {{- end }}
  {{- if .s1pin }}
  s1:
    source: gpio
    pin: {{ .s1pin }}
    function: read
    {{- if .activelow }}
    activelow: true
    {{- end }}
    {{- if .bias }}
    bias: {{ .bias }}
    {{- end }}
  {{- end }}
  {{- if .s2pin }}
  s2:
    source: gpio
    pin: {{ .s2pin }}
    function: read
    {{- if .activelow }}
    activelow: true
    {{- end }}
    {{- if .bias }}
    bias: {{ .bias }}
    {{- end }}
  {{- end }}
