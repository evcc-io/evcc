template: fnn-shelly-i4
products:
  - brand: Shelly
    description:
      generic: Plus i4
  - brand: Shelly
    description:
      generic: Plus i4 DC
  - brand: Shelly
    description:
      generic: i4 Gen3
  - brand: Shelly
    description:
      generic: i4 DC Gen3
requirements:
  description:
    de: Die Schaltkontakte der Steuerbox werden an die Eingänge SW1 bis SW4 angeschlossen. Alle verwendeten Eingänge müssen in der Shelly-App bzw. im Webinterface als Eingangstyp "Schalter" konfiguriert sein, nicht als "Taster".
    en: Connect the relay contacts of the control box to the inputs SW1 to SW4. All used inputs must be configured as input type "switch" in the Shelly app or web interface, not as "button".
params:
  - name: host
  - name: password
    help:
      en: Only required if authentication is enabled on the device (user is always admin)
      de: Nur erforderlich, wenn am Gerät die Authentifizierung aktiviert ist (Benutzer ist immer admin)
  - name: maxconsumptionpower
    type: float
    unit: W
    required: true
    description:
      en: Guaranteed minimum power (Pmin)
      de: Garantierte Mindestleistung (Pmin)
    help:
      en: Power limit applied to the root circuit while the limit is active.
      de: Leistungsbegrenzung des Hauptstromkreises während die Limitierung aktiv ist.
  - name: w4input
    type: int
    required: true
    default: 1
    description:
      en: W4 input
      de: W4-Eingang
    help:
      en: Input number for the W4 signal (Dimmer for controllable loads), 1 to 4 (SW1 = 1)
      de: Nummer des Eingangs für das W4-Signal (Dimmen der steuerbaren Verbrauchseinrichtungen), 1 bis 4 (SW1 = 1)
  - name: productionnominalmax
    type: float
    unit: Wp
    description:
      en: Installed generator power
      de: Installierte Generatorleistung
    help:
      en: Rated generator/module power of the installation (reference value according to § 9 EEG).
      de: Gesamtnennleistung bzw. Modul- oder Generatorleistung der Anlage (Bezugsgröße nach § 9 EEG).
  - name: w3input
    type: int
    required: true
    default: 2
    description:
      en: W3 input
      de: W3-Eingang
    help:
      en: Input number for the W3 signal (Zero export, 0%), 1 to 4 (SW1 = 1)
      de: Nummer des Eingangs für das W3-Signal (Keine Netzeinspeisung, 0%), 1 bis 4 (SW1 = 1)
  - name: s1input
    type: int
    example: 3
    description:
      en: S1 input
      de: S1-Eingang
    help:
      en: Input number for the S1 signal (60% export power limit), 1 to 4 (SW1 = 1)
      de: Nummer des Eingangs für das S1-Signal (Reduzierung der Einspeiseleistung auf 60%), 1 bis 4 (SW1 = 1)
  - name: s2input
    type: int
    example: 4
    description:
      en: S2 input
      de: S2-Eingang
    help:
      en: Input number for the S2 signal (30% export power limit), 1 to 4 (SW1 = 1)
      de: Nummer des Eingangs für das S2-Signal (Reduzierung der Einspeiseleistung auf 30%), 1 bis 4 (SW1 = 1)
render: |
  {{- define "input" }}
  source: http
  uri: http://{{ .host }}/rpc/Input.GetStatus?id={{ sub (int .input) 1 }}
  {{- if .password }}
  auth:
    type: digest
    user: admin
    password: {{ .password }}
  {{- end }}
  jq: .state
  {{- end }}
  type: fnn
  maxdimpower: {{ .maxconsumptionpower }}
  w4:
    {{- include "input" (dict "host" .host "password" .password "input" .w4input) | indent 2 }}
  productionnominalmax: {{ .productionnominalmax }}
  w3:
    {{- include "input" (dict "host" .host "password" .password "input" .w3input) | indent 2 }}
  {{- if .s1input }}
  s1:
    {{- include "input" (dict "host" .host "password" .password "input" .s1input) | indent 2 }}
  {{- end }}
  {{- if .s2input }}
  s2:
    {{- include "input" (dict "host" .host "password" .password "input" .s2input) | indent 2 }}
  {{- end }}
