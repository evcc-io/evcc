template: opel
products:
  - brand: Opel
requirements:
  description:
    de: |
      Beim Einrichten des Fahrzeugs dem Link folgen und im Browser mit dem Opel-Konto anmelden.
      Anschließend den Code oder die vollständige Weiterleitungs-URL in den Fahrzeugdialog kopieren.
    en: |
      When configuring the vehicle, follow the link and sign in with your Opel account in the browser.
      Then paste the code or the full redirect URL into the vehicle dialog.
params:
  - preset: vehicle-common
  - preset: vehicle-online
  - name: user
    required: true
  - name: country
    default: de
    description:
      de: Ländercode
      en: Country code
  - name: password
    deprecated: true
  - name: accessToken
    advanced: true
  - name: refreshToken
    advanced: true
  - name: vin
    example: V...
  - name: cache
    default: 15m
auth:
  type: opel
  params: [user, country]
render: |
  type: opel
  vin: {{ .vin }}
  user: {{ .user }}
  country: {{ .country }}
  tokens:
    access: {{ .accessToken }}
    refresh: {{ .refreshToken }}
  {{ include "common" . }}
  cache: {{ .cache }}
  {{ include "features" . }}
