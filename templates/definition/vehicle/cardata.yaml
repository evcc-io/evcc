template: cardata
products:
  - brand: BMW
    description:
      generic: CarData
  - brand: Mini
    description:
      generic: CarData
requirements:
  description:
    de: |
      Benötigt CarData Einrichtung im BMW/Mini portal. Die folgenden Datenpunkte müssen für Streaming konfiguriert werden (die Verfügbarkeit der Datenpunkte kann je nach Fahrzeugmodell variieren):

      ```
      vehicle.body.chargingPort.status
      vehicle.cabin.infotainment.navigation.currentLocation.latitude
      vehicle.cabin.infotainment.navigation.currentLocation.longitude
      vehicle.cabin.hvac.preconditioning.status.comfortState
      vehicle.drivetrain.batteryManagement.header
      vehicle.drivetrain.electricEngine.charging.hvStatus
      vehicle.drivetrain.electricEngine.charging.status
      vehicle.drivetrain.electricEngine.charging.timeRemaining
      vehicle.drivetrain.electricEngine.kombiRemainingElectricRange
      vehicle.drivetrain.lastRemainingRange
      vehicle.powertrain.electric.battery.stateOfCharge.target
      vehicle.powertrain.electric.battery.stateOfCharge.displayed
      vehicle.vehicle.preConditioning.activity
      vehicle.vehicle.travelledDistance
      ```

      Aktualisierung der Daten erfolgt einmalig bei Neustart und wenn Streamingdaten eingehen. Dies ist ausschließlich der Fall, wenn das Fahrzeug aktiv Daten erzeugt.

      Sollte die Fahrzeugerkennung nicht zuverlässig funktionieren, sollte `welcomecharge` (Laden bei Verbindung) aktiviert werden.

      BMW erlaubt nur eine Streaming-Verbindung pro Konto. Wird diese bereits von einem anderen Tool genutzt, können die Streamingdaten optional von einem MQTT-Broker gelesen werden (Streaming-Quelle `mqtt`, ohne Host wird der MQTT-Broker von evcc verwendet). Das Tool muss die CarData-Nachrichten unverändert veröffentlichen, z.B. [bmw-mqtt-bridge](https://github.com/dj0abr/bmw-mqtt-bridge) mit Standardeinstellungen. Nur dieses Tool sollte auf dem Topic veröffentlichen dürfen, z.B. per ACL des MQTT-Brokers. Die Anmeldung mit `clientid` wird weiterhin für die REST-Abfragen benötigt.
    en: |
      Requires CarData activation in BMW/Mini portal. The following data points need to be configured for streaming access (the availability of data points may vary depending on the vehicle model):

      ```
      vehicle.body.chargingPort.status
      vehicle.cabin.infotainment.navigation.currentLocation.latitude
      vehicle.cabin.infotainment.navigation.currentLocation.longitude
      vehicle.cabin.hvac.preconditioning.status.comfortState
      vehicle.drivetrain.batteryManagement.header
      vehicle.drivetrain.electricEngine.charging.hvStatus
      vehicle.drivetrain.electricEngine.charging.status
      vehicle.drivetrain.electricEngine.charging.timeRemaining
      vehicle.drivetrain.electricEngine.kombiRemainingElectricRange
      vehicle.drivetrain.lastRemainingRange
      vehicle.powertrain.electric.battery.stateOfCharge.target
      vehicle.powertrain.electric.battery.stateOfCharge.displayed
      vehicle.vehicle.preConditioning.activity
      vehicle.vehicle.travelledDistance
      ```

      Data will be updated on restart and when received using streaming. This only happens when the vehicle actively creates new updates.

      In case the vehicle detection does not work reliably, `welcomecharge` (charge on connection) should be enabled.

      BMW allows only one streaming connection per account. If another tool already uses it, the streaming data can optionally be read from an MQTT broker (streaming source `mqtt`, the evcc MQTT broker is used if host is empty). The tool must publish the unmodified CarData messages, e.g. [bmw-mqtt-bridge](https://github.com/dj0abr/bmw-mqtt-bridge) with its default settings. Only this tool should be allowed to publish to the topic, e.g. using broker ACLs. Login with `clientid` is still required for REST requests.
params:
  - preset: vehicle-common
  - name: vin
    required: true
    example: WBMW...
  - name: clientid
  - preset: vehicle-features
  - name: streaming
    help:
      en: Enable if vehicle sends streaming updates during charging.
      de: Aktivieren falls das Fahrzeug Streaming Updates während des Ladevorgangs schickt.
  - name: stream
    type: choice
    choice: ["bmw", "mqtt"]
    default: bmw
    advanced: true
    description:
      en: Streaming source
      de: Streaming-Quelle
    help:
      en: Read the streaming data from BMW or from an MQTT broker
      de: Streamingdaten von BMW oder von einem MQTT-Broker lesen
  - preset: mqtt
  - name: host
    advanced: true
    optional: true
    example: 192.168.1.10
  - name: port
    advanced: true
  - name: topic
    advanced: true
    default: bmw/raw/+
    description:
      generic: Topic
    help:
      en: Topic on the MQTT broker carrying the unmodified CarData messages
      de: Topic auf dem MQTT-Broker mit den unveränderten CarData-Nachrichten
  - name: cache
    example: 30m
    help:
      en: Time interval for REST data refresh. Default 15m, 30m with streaming. BMW allows 50 requests per day per account, raise it if other tools also use REST requests on the same account.
      de: Zeitintervall für erneute REST-Datenabfrage. Standard 15m, 30m mit Streaming. BMW erlaubt 50 Abfragen pro Tag und Konto, bei REST-Abfragen weiterer Tools am selben Konto erhöhen.
auth:
  type: cardata
  params: [clientid]
render: |
  type: cardata
  vin: {{ .vin }}
  clientid: {{ .clientid }}
  stream: {{ .stream }}
  {{- if eq .stream "mqtt" }}
  {{- include "mqtt" . }}
  topic: {{ .topic }}
  {{- end }}
  {{- if .cache }}
  cache: {{ .cache }}
  {{- end }}
  {{ include "common" . }}
  {{ include "features" . }}
