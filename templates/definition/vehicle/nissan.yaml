template: nissan
products:
  - brand: Nissan
    description:
      generic: Leaf
params:
  - preset: vehicle-base
  - preset: vehicle-online
  - name: country
    description:
      de: Land
      en: Country
    help:
      de: Zweistelliger Ländercode des Landes, in dem das Nissan Konto registriert ist
      en: Two-letter code of the country the Nissan account is registered in
    required: true
    default: DE
render: |
  type: nissan
  country: {{ .country }}
  {{ include "base" . }}
  {{ include "features" . }}
