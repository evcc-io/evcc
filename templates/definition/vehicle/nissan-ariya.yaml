template: nissan-ariya
products:
  - brand: Nissan
    description:
      generic: Ariya
  - brand: Nissan
    description:
      generic: Micra
params:
  - preset: vehicle-base
  - preset: vehicle-online
  - name: country
    description:
      de: Land
      en: Country
    help:
      de: Zweistelliger Ländercode des Landes, in dem das Nissan Konto registriert ist
      en: Two-letter code of the country the Nissan account is registered in
    required: true
    default: DE
  - name: expiry
    description:
      de: Ablauf
      en: Expiry
    help:
      de: Maximales Alter der Daten vor erneuter Abfrage
      en: Maximum data age before refresh
    advanced: true
    type: duration
    example: 5m
render: |
  type: nissan
  version: v2
  country: {{ .country }}
  {{ include "base" . }}
  expiry: {{ .expiry }}
  {{ include "features" . }}
