template: niu-e-scooter
products:
  - brand: NIU
    description:
      generic: E-Scooter
group: scooter
params:
  - preset: vehicle-common
  - preset: vehicle-online
  - name: icon
    default: scooter
    advanced: true
  - name: capacity
    default: 4
  - name: user
    required: true
  - name: password
    required: true
  - name: serial
    description:
      de: Scooter Seriennummer, wie in der NIU app angegeben
      en: Scooter serial number like shown in NIU app
    required: true
render: |
  type: niu
  {{ include "common" . }}
  user: {{ .user }} # NIU app user
  password: {{ .password }} # NIU app password
  serial: {{ .serial }} # NIU E-Scooter serial number like shown in app
  {{ include "features" . }}
