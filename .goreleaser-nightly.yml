version: 2

dist: release
release:
  disable: true

builds:
  - id: evcc
    main: .
    flags:
      - -trimpath
      - -tags=release
    ldflags:
      # the package version carries a timestamp for ordering, the reported version does not
      - -X github.com/evcc-io/evcc/util.Version={{ if .IsSnapshot }}{{ incminor .Tag }}-dev+{{ .ShortCommit }}{{ else }}{{ .Version }}{{ end }} -X github.com/evcc-io/evcc/util.Commit={{ .ShortCommit }} -s -w
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    overrides:
      - goos: windows
        goarch: amd64
        flags:
          - -trimpath
          - -tags=release,timetzdata

env:
  - CGO_ENABLED=0

archives:
  - ids:
      - evcc
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - evcc.dist.yaml
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}

universal_binaries:
  - replace: true

checksum:
  name_template: "checksums.txt"

snapshot:
  # semver pre-release of the upcoming version. The timestamp makes the package
  # version increase monotonically: apt compares it numerically, while the commit
  # alone would sort randomly.
  version_template: "{{ incminor .Version }}-dev.{{ .Timestamp }}+{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "(?i)^bump"
      - "(?i)^ci:"
      - "^docs:"
      - "^test:"
      - "^build"
      - "^Translations"

nfpms:
  - id: default
    package_name: evcc
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}-{{ .Arch }}{{ if .Arm }}hf{{ end }}"

    homepage: https://evcc.io
    description: EV Charge Controller
    maintainer: info@evcc.io
    license: MIT
    vendor: evcc.io

    formats:
      - deb

    dependencies:
      - adduser
      - ucf

    contents:
      - src: ./packaging/init/evcc.service
        dst: /lib/systemd/system/evcc.service

    scripts:
      preinstall: ./packaging/scripts/preinstall.sh
      postinstall: ./packaging/scripts/postinstall.sh
      preremove: ./packaging/scripts/preremove.sh
      postremove: ./packaging/scripts/postremove.sh
